<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>像素农场 · Pixel Farm v0.1</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b0d12}
  body{display:flex;align-items:center;justify-content:center;
       font-family:"Courier New",Consolas,monospace}
  /* 整数倍缩放 + 最近邻采样 = 像素永不糊、比例永不变形 */
  #game{
    display:block;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    background:#141922;
    box-shadow:0 0 0 2px #000,0 0 40px rgba(0,0,0,.6);
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<script>
'use strict';

/* === 1.CONFIG === */
/* 所有可调数字都来自这里 —— 改这一个对象即可调整个游戏 */
const CONFIG = {
  VERSION: 'v0.1',          // 版本号（显示在左上角）

  /* 逻辑分辨率（画布内部像素，与屏幕缩放无关） */
  VIEW_W: 960,
  VIEW_H: 540,

  /* 世界 */
  TILE: 32,                 // 每格像素
  MAP_W: 64,                // 地图宽（格）
  MAP_H: 64,                // 地图高（格）

  /* 主循环 */
  TARGET_FPS: 60,           // 逻辑帧率（固定步长）
  MAX_FRAME_TIME: 0.25,     // 单帧最大时间（防止切后台后补帧爆炸）
  MAX_STEPS: 5,             // 单帧最多追几步
  FPS_INTERVAL: 0.25,       // FPS 刷新间隔（秒）

  /* 占位小人 */
  CHAR_W: 16,               // 精灵宽（像素）
  CHAR_H: 24,               // 精灵高（像素）
  CHAR_SCALE: 2,            // 精灵整数放大倍数
  CHAR_POS_X: 0.5,          // 屏幕归一化位置（0~1）
  CHAR_POS_Y: 0.5,

  /* 缩放 */
  INTEGER_SCALE: true,      // true = 放大时只用整数倍（像素最锐利）
  MIN_SCALE: 0.25,          // 最小缩放比（窗口小于逻辑分辨率时按比例缩小，不裁切）

  /* 配色 */
  COLORS: {
    bg:        '#141922',   // 画布背景（深色）
    grid:      '#1b2231',   // 网格线
    hudBg:     'rgba(8,10,16,0.72)',
    hudBorder: '#3d4a63',
    hudText:   '#cfe3ff',
    hudAccent: '#ffd76a',
    shadow:    'rgba(0,0,0,0.40)',
    hair:      '#4a3222',
    skin:      '#f0c090',
    eye:       '#20202a',
    shirt:     '#3f7fd0',
    shirtDark: '#2f63a8',
    pants:     '#3a4a5a',
    shoe:      '#26262e'
  }
};

/* === 2.世界 === */
/* 固定步长：逻辑每步恒为 1/60 秒，与显示器刷新率无关 */
const FIXED_DT = 1 / CONFIG.TARGET_FPS;

/* 3×5 点阵字库（像素风 HUD 文字，缩放后依然锐利） */
const FONT = {
  '0':['111','101','101','101','111'],
  '1':['010','110','010','010','111'],
  '2':['111','001','111','100','111'],
  '3':['111','001','111','001','111'],
  '4':['101','101','111','001','001'],
  '5':['111','100','111','001','111'],
  '6':['111','100','111','101','111'],
  '7':['111','001','010','010','010'],
  '8':['111','101','111','101','111'],
  '9':['111','101','111','001','111'],
  'F':['111','100','111','100','100'],
  'P':['110','101','110','100','100'],
  'S':['111','100','111','001','111'],
  'V':['101','101','101','101','010'],
  'v':['101','101','101','101','010'],
  '.':['000','000','000','000','010'],
  '-':['000','000','111','000','000'],
  ' ':['000','000','000','000','000']
};
const GLYPH_W = 3, GLYPH_H = 5;

/* 占位小人：16×24 字符画（每格 1 像素，运行时用 fillRect 拼出） */
const SPRITE = [
  '.....hhhhhh.....',
  '....hhhhhhhh....',
  '...hhhhhhhhhh...',
  '...hh......hh...',
  '...hh......hh...',
  '...ssssssssss...',
  '...ssssssssss...',
  '...ss.ee..ee.ss.',
  '...ssssssssss...',
  '....ssssssss....',
  '.....ssssss.....',
  '....bbbbbbbb....',
  '...bbbbbbbbbb...',
  '..bbbbbbbbbbbb..',
  '..bbbbbbbbbbbb..',
  '..sbbbbbbbbbbs..',
  '..sbbbbbbbbbbs..',
  '...bbbbbbbbbb...',
  '....pppppppp....',
  '....pp....pp....',
  '....pp....pp....',
  '....ss....ss....',
  '....ss....ss....',
  '................'
];
const SPRITE_PALETTE = {
  h: CONFIG.COLORS.hair,
  s: CONFIG.COLORS.skin,
  e: CONFIG.COLORS.eye,
  b: CONFIG.COLORS.shirt,
  p: CONFIG.COLORS.pants,
  d: CONFIG.COLORS.shoe
};

/* === 3.渲染 === */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', {alpha:false});
canvas.width  = CONFIG.VIEW_W;
canvas.height = CONFIG.VIEW_H;
ctx.imageSmoothingEnabled = false;

/* 等比缩放并居中：整数倍优先（像素锐利），窗口再小也不会变形/溢出 */
function fitCanvas(){
  const scale = Math.min(window.innerWidth / CONFIG.VIEW_W,
                         window.innerHeight / CONFIG.VIEW_H);
  const s = CONFIG.INTEGER_SCALE && scale >= 1 ? Math.floor(scale) : scale;
  const finalScale = Math.max(CONFIG.MIN_SCALE, s);
  canvas.style.width  = Math.round(CONFIG.VIEW_W  * finalScale) + 'px';
  canvas.style.height = Math.round(CONFIG.VIEW_H * finalScale) + 'px';
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

/* --- 4.玩家 --- */
const player = {
  x: CONFIG.VIEW_W * CONFIG.CHAR_POS_X,
  y: CONFIG.VIEW_H * CONFIG.CHAR_POS_Y
};

/* --- 5.系统 --- */
let fps = 0, frameCount = 0, fpsTimer = 0;
let firstRenderDone = false;
const renderLog = {ground:false, objects:false, player:false, ui:false};

/* 点阵文字绘制：每个字形 3×5 像素，scale 为整数放大倍数 */
function drawText(g, text, x, y, scale, color){
  g.fillStyle = color;
  let cx = x;
  for(const raw of String(text)){
    const ch = raw.toUpperCase();
    const glyph = FONT[ch] || FONT[raw] || FONT[' '];
    for(let r=0;r<GLYPH_H;r++){
      const row = glyph[r];
      for(let c=0;c<GLYPH_W;c++){
        if(row[c] === '1') g.fillRect(cx + c*scale, y + r*scale, scale, scale);
      }
    }
    cx += (GLYPH_W + 1) * scale;
  }
  return cx;
}

/* --- 6.UI --- */
/* 分层渲染：drawGround → drawObjects → drawPlayer → drawUI（顺序固定） */
function drawGround(g){
  if(!renderLog.ground){ renderLog.ground = true; console.log('[render] 1/4 drawGround'); }
  g.fillStyle = CONFIG.COLORS.bg;
  g.fillRect(0, 0, CONFIG.VIEW_W, CONFIG.VIEW_H);
  /* 均匀网格（仅作参照，不是地图） */
  g.fillStyle = CONFIG.COLORS.grid;
  for(let x=0;x<CONFIG.VIEW_W;x+=CONFIG.TILE) g.fillRect(x, 0, 1, CONFIG.VIEW_H);
  for(let y=0;y<CONFIG.VIEW_H;y+=CONFIG.TILE) g.fillRect(0, y, CONFIG.VIEW_W, 1);
}

function drawObjects(g){
  if(!renderLog.objects){ renderLog.objects = true; console.log('[render] 2/4 drawObjects'); }
  /* 本轮为空占位：后续放地图物件 */
}

function drawPlayer(g){
  if(!renderLog.player){ renderLog.player = true; console.log('[render] 3/4 drawPlayer'); }
  const s = CONFIG.CHAR_SCALE;
  const w = CONFIG.CHAR_W * s, h = CONFIG.CHAR_H * s;
  const ox = Math.round(player.x - w/2);
  const oy = Math.round(player.y - h/2);

  /* 地面阴影 */
  g.fillStyle = CONFIG.COLORS.shadow;
  g.fillRect(ox + Math.round(3*s), oy + h - Math.round(1*s), Math.round(10*s), Math.round(2*s));

  /* 逐行合并同色像素，用 fillRect 拼出小人 */
  for(let r=0;r<CONFIG.CHAR_H;r++){
    const row = SPRITE[r] || '';
    let c = 0;
    while(c < CONFIG.CHAR_W){
      const ch = row[c];
      if(!ch || ch === '.'){ c++; continue; }
      let run = 1;
      while(c + run < CONFIG.CHAR_W && row[c+run] === ch) run++;
      g.fillStyle = SPRITE_PALETTE[ch] || CONFIG.COLORS.skin;
      g.fillRect(ox + c*s, oy + r*s, run*s, s);
      c += run;
    }
  }
}

function drawUI(g){
  if(!renderLog.ui){ renderLog.ui = true; console.log('[render] 4/4 drawUI'); }
  const scale = 2;
  const lineW = 13 * scale;          // "FPS 000" 的点阵宽度
  const pad = 6;
  const boxW = lineW + pad*2;
  const boxH = GLYPH_H*scale*2 + pad*2 + 4;

  g.fillStyle = CONFIG.COLORS.hudBg;
  g.fillRect(8, 8, boxW, boxH);
  g.fillStyle = CONFIG.COLORS.hudBorder;
  g.fillRect(8, 8, boxW, 1); g.fillRect(8, 8+boxH-1, boxW, 1);
  g.fillRect(8, 8, 1, boxH); g.fillRect(8+boxW-1, 8, 1, boxH);

  const fpsText = 'FPS ' + String(Math.round(fps)).padStart(2,' ');
  drawText(g, fpsText, 8+pad, 8+pad, scale, CONFIG.COLORS.hudAccent);
  const verText = CONFIG.VERSION + ' ' + CONFIG.TARGET_FPS + 'HZ';
  drawText(g, verText, 8+pad, 8+pad + GLYPH_H*scale + 4, scale, CONFIG.COLORS.hudText);
}

/* === 7.存档 === */
/* 本轮不做存档 */

function update(dt){
  /* 本轮不做游戏逻辑；dt 为固定步长（恒 1/60 秒） */
}

/* === 8.主循环 === */
let accumulator = 0;
let lastTime = performance.now();

function render(){
  ctx.imageSmoothingEnabled = false;
  drawGround(ctx);
  drawObjects(ctx);
  drawPlayer(ctx);
  drawUI(ctx);
  if(!firstRenderDone){
    firstRenderDone = true;
    console.log('[render] 顺序确认: drawGround -> drawObjects -> drawPlayer -> drawUI');
  }
}

function loop(now){
  /* delta time（真实帧间隔） */
  let frameTime = (now - lastTime) / 1000;
  lastTime = now;
  if(frameTime < 0) frameTime = 0;
  if(frameTime > CONFIG.MAX_FRAME_TIME) frameTime = CONFIG.MAX_FRAME_TIME;

  /* 固定步长累加器：逻辑恒定 60Hz */
  accumulator += frameTime;
  let steps = 0;
  while(accumulator >= FIXED_DT && steps < CONFIG.MAX_STEPS){
    update(FIXED_DT);
    accumulator -= FIXED_DT;
    steps++;
  }
  if(steps === CONFIG.MAX_STEPS) accumulator = 0;   /* 追不上就丢弃，避免螺旋死亡 */

  render();

  /* FPS 统计 */
  frameCount++;
  fpsTimer += frameTime;
  if(fpsTimer >= CONFIG.FPS_INTERVAL){
    fps = frameCount / fpsTimer;
    frameCount = 0;
    fpsTimer = 0;
  }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
