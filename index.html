<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>像素农场 · Pixel Farm v0.1</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b0d12}
  body{display:flex;align-items:center;justify-content:center;
       font-family:"Courier New",Consolas,monospace}
  /* 整数倍缩放 + 最近邻采样 = 像素永不糊、比例永不变形 */
  #game{
    display:block;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    background:#141922;
    box-shadow:0 0 0 2px #000,0 0 40px rgba(0,0,0,.6);
  }
  /* 右上角信息面板（不随画布缩放，保持文字清晰） */
  #stats{
    position:fixed;right:10px;top:10px;z-index:10;
    font:12px/1.7 Consolas,"Courier New",monospace;color:#cfe3ff;
    background:rgba(8,10,16,.74);border:2px solid #3d4a63;padding:6px 10px;
    white-space:pre;pointer-events:none;
  }
  #stats b{color:#ffd76a}
  /* 屏幕底部提示条：多条同时出现时向上排（容器底边固定，新增的一条排在最下） */
  #toasts{
    position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:20;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    pointer-events:none;
  }
  .toast{
    background:rgba(8,10,16,.88);border:2px solid #3d4a63;color:#e8f0ff;
    font:13px/1.4 Consolas,"Microsoft YaHei","PingFang SC",monospace;
    padding:5px 14px;box-shadow:0 3px 0 rgba(0,0,0,.45);
    white-space:nowrap;animation:toastFade 1.5s ease-out forwards;
  }
  @keyframes toastFade{
    0%  {opacity:1;transform:translateY(0)}
    70% {opacity:1;transform:translateY(0)}
    100%{opacity:0;transform:translateY(-6px)}
  }
  /* 背包面板（DOM 覆盖层；打开时游戏时间冻结） */
  #pack{
    position:fixed;inset:0;z-index:40;display:none;
    align-items:center;justify-content:center;
    font:13px/1.6 Consolas,"Microsoft YaHei","PingFang SC",monospace;color:#cfe3ff;
  }
  #pack.open{display:flex}
  #packMask{position:absolute;inset:0;background:rgba(4,6,10,.55)}
  #packPanel{
    position:relative;background:#12161f;border:2px solid #3d4a63;padding:12px 14px 10px;
    box-shadow:0 0 0 2px #000,0 14px 40px rgba(0,0,0,.65);
  }
  #packHead{font-size:14px;color:#ffd76a;margin-bottom:8px}
  #packHead span{color:#8fa3bd;font-size:12px;margin-left:10px}
  #packGrid{display:grid;grid-template-columns:repeat(6,42px);gap:5px}
  #packGrid .cell,
  #chestGrid .cell,
  #chestInv .cell{
    position:relative;width:42px;height:42px;background:#1a2130;
    border:2px solid #2c3a4e;cursor:pointer;
  }
  #packGrid .cell.hot{border-color:#7a6a30}
  #chestGrid .cell{border-color:#5a4526}
  #packGrid .cell:hover,
  #chestGrid .cell:hover,
  #chestInv .cell:hover{background:#232c3e}
  #packGrid .cell .ic,
  #chestGrid .cell .ic,
  #chestInv .cell .ic{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-56%);
    font-size:22px;line-height:1;
  }
  #packGrid .cell .n,
  #chestGrid .cell .n,
  #chestInv .cell .n{
    position:absolute;right:2px;bottom:0px;font-size:11px;color:#ffd76a;
    text-shadow:0 0 3px #000;
  }
  #packGrid .cell .k,
  #chestGrid .cell .k,
  #chestInv .cell .k{
    position:absolute;left:3px;top:0px;font-size:10px;color:#7f92ad;
  }
  /* 木箱面板（复用背包的格子样式） */
  #chest{
    position:fixed;inset:0;z-index:44;display:none;
    align-items:center;justify-content:center;
    font:13px/1.6 Consolas,"Microsoft YaHei","PingFang SC",monospace;color:#cfe3ff;
  }
  #chest.open{display:flex}
  #chestMask{position:absolute;inset:0;background:rgba(4,6,10,.55)}
  #chestPanel{
    position:relative;background:#12161f;border:2px solid #3d4a63;padding:12px 14px 10px;
    box-shadow:0 0 0 2px #000,0 14px 40px rgba(0,0,0,.65);
  }
  #chestHead{font-size:14px;color:#ffd76a;margin-bottom:8px}
  #chestHead span{color:#8fa3bd;font-size:12px;margin-left:10px}
  #chestGrid{display:grid;grid-template-columns:repeat(4,42px);gap:5px;margin-bottom:10px}
  #chestSub{font-size:12px;color:#8fa3bd;margin-bottom:6px}
  #chestInv{display:grid;grid-template-columns:repeat(6,42px);gap:5px}
  #chestFoot{margin-top:9px;font-size:11px;color:#8fa3bd}
  #packFoot{margin-top:9px;font-size:11px;color:#8fa3bd}
  /* 物品名提示（跟随鼠标） */
  #packTip{
    position:fixed;z-index:60;display:none;pointer-events:none;
    background:rgba(8,10,16,.95);border:1px solid #3d4a63;color:#e8f0ff;
    padding:3px 8px;font:12px/1.4 Consolas,"Microsoft YaHei",monospace;
    white-space:nowrap;
  }
  /* 手上拿着的物品（跟随鼠标） */
  #packHeld{
    position:fixed;z-index:60;display:none;pointer-events:none;
    transform:translate(-50%,-50%);font-size:26px;line-height:1;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.8));
  }
  /* 商店面板（DOM 覆盖层；打开时游戏时间冻结） */
  #shop{
    position:fixed;inset:0;z-index:45;display:none;
    align-items:center;justify-content:center;
    font:13px/1.6 Consolas,"Microsoft YaHei","PingFang SC",monospace;color:#cfe3ff;
  }
  #shop.open{display:flex}
  #shopMask{position:absolute;inset:0;background:rgba(4,6,10,.55)}
  #shopPanel{
    position:relative;background:#12161f;border:2px solid #3d4a63;padding:12px 14px 10px;
    box-shadow:0 0 0 2px #000,0 14px 40px rgba(0,0,0,.65);width:470px;
  }
  #shopHead{font-size:14px;color:#ffd76a;margin-bottom:8px}
  #shopHead span{color:#8fa3bd;font-size:12px;margin-left:10px}
  #shopGold{color:#ffd76a;font-size:14px;margin-left:10px;display:inline-block}
  @keyframes goldBump{
    0%  {transform:scale(1.45);color:#7ee08a}
    60% {transform:scale(1.10);color:#7ee08a}
    100%{transform:scale(1);color:#ffd76a}
  }
  #shopTabs{display:flex;gap:6px;margin-bottom:8px}
  #shopTabs .tab{
    background:#1a2130;border:2px solid #2c3a4e;color:#8fa3bd;
    font:13px/1 Consolas,"Microsoft YaHei",monospace;padding:6px 18px;cursor:pointer;
  }
  #shopTabs .tab.on{background:#2a3550;border-color:#ffd76a;color:#ffd76a}
  #shopBody{max-height:330px;overflow-y:auto}
  .srow{
    display:flex;align-items:center;gap:8px;padding:5px 6px;
    border-bottom:1px solid #232c3e;
  }
  .srow:hover{background:#1a2130}
  .srow .ic{font-size:20px;width:26px;text-align:center;line-height:1}
  .srow .nm{flex:1;color:#e8f0ff}
  .srow .nm em{font-style:normal;color:#8fa3bd;font-size:11px;margin-left:6px}
  .srow .pr{color:#ffd76a;min-width:52px;text-align:right;white-space:nowrap}
  .srow .pr .up{color:#7ee08a;margin-left:3px}
  .srow .pr .dn{color:#ff9a8a;margin-left:3px}
  .srow .btn{
    background:#243050;border:2px solid #3d4a63;color:#cfe3ff;
    font:12px/1 Consolas,"Microsoft YaHei",monospace;padding:5px 10px;cursor:pointer;
    white-space:nowrap;
  }
  .srow .btn:hover{border-color:#ffd76a;color:#ffd76a}
  .srow .btn.off{opacity:.42;cursor:not-allowed;border-color:#2c3a4e;color:#7f92ad}
  .srow .btn.off:hover{border-color:#2c3a4e;color:#7f92ad}
  .sempty{padding:16px 6px;color:#8fa3bd;text-align:center}
  #shopFoot{margin-top:9px;font-size:11px;color:#8fa3bd}
  /* 启动菜单（本地有存档时：继续 / 新游戏） */
  #start{
    position:fixed;inset:0;z-index:80;display:none;
    align-items:center;justify-content:center;background:rgba(4,6,10,.80);
    font:13px/1.7 Consolas,"Microsoft YaHei","PingFang SC",monospace;color:#cfe3ff;
  }
  #start.open{display:flex}
  #startPanel{
    background:#12161f;border:2px solid #3d4a63;padding:20px 24px 16px;min-width:380px;
    box-shadow:0 0 0 2px #000,0 14px 40px rgba(0,0,0,.65);text-align:center;
  }
  #startTitle{font-size:22px;color:#ffd76a;letter-spacing:3px}
  #startSub{font-size:11px;color:#8fa3bd;margin:2px 0 14px}
  #startInfo{
    font-size:12px;color:#cfe3ff;margin-bottom:8px;white-space:pre-line;text-align:left;
    background:#1a2130;border:1px solid #2c3a4e;padding:8px 10px;
  }
  #startWarn{font-size:12px;color:#ffb08a;margin-bottom:10px;white-space:pre-line;text-align:left}
  #startBtns,#startBtns2{display:flex;gap:10px;justify-content:center;margin-top:8px}
  #startConfirm{display:none;margin-top:14px;padding-top:10px;border-top:1px solid #2c3a4e}
  #startConfirm.open{display:block}
  #confirmText{font-size:12px;color:#ffb08a;margin-bottom:6px}
  #startFoot{font-size:11px;color:#7f92ad;margin-top:14px}
  .mbtn{
    background:#243050;border:2px solid #3d4a63;color:#cfe3ff;
    font:13px/1 Consolas,"Microsoft YaHei",monospace;padding:9px 18px;cursor:pointer;
  }
  .mbtn:hover{border-color:#ffd76a;color:#ffd76a}
  .mbtn.danger:hover{border-color:#ff9a8a;color:#ff9a8a}
  /* 系统菜单（Esc）：保存 / 读档 */
  #sys{
    position:fixed;inset:0;z-index:46;display:none;
    align-items:center;justify-content:center;
    font:13px/1.6 Consolas,"Microsoft YaHei","PingFang SC",monospace;color:#cfe3ff;
  }
  #sys.open{display:flex}
  #sysMask{position:absolute;inset:0;background:rgba(4,6,10,.55)}
  #sysPanel{
    position:relative;background:#12161f;border:2px solid #3d4a63;padding:14px 16px 12px;width:330px;
    box-shadow:0 0 0 2px #000,0 14px 40px rgba(0,0,0,.65);
  }
  #sysHead{font-size:14px;color:#ffd76a;margin-bottom:8px}
  #sysInfo{font-size:11px;color:#8fa3bd;margin-bottom:10px;white-space:pre-line}
  #sysBtns{display:flex;flex-direction:column;gap:8px}
  #sysBtns .mbtn{width:100%}
  #sysFoot{margin-top:10px;font-size:11px;color:#8fa3bd}
</style>
</head>
<body>

<canvas id="game"></canvas>
<div id="stats"></div>
<div id="toasts"></div>

<!-- 背包面板：DOM 覆盖层，打开时游戏时间冻结 -->
<div id="pack">
  <div id="packMask"></div>
  <div id="packPanel">
    <div id="packHead">背包 <span id="packInfo"></span></div>
    <div id="packGrid"></div>
    <div id="packFoot">点击拾起 · 再点放下（两格之间可交换）· 拖到面板外自动放回 · Esc 关闭</div>
  </div>
</div>
<div id="packTip"></div>
<div id="packHeld"></div>

<!-- 木箱面板：DOM 覆盖层，复用背包格子样式；打开时游戏时间冻结 -->
<div id="chest">
  <div id="chestMask"></div>
  <div id="chestPanel">
    <div id="chestHead">木箱 <span id="chestInfo"></span></div>
    <div id="chestGrid"></div>
    <div id="chestSub">背包（点一下存进木箱）</div>
    <div id="chestInv"></div>
    <div id="chestFoot">点木箱格 = 取回背包 · 点背包格 = 存入木箱 · Esc 关闭</div>
  </div>
</div>

<!-- 商店面板：DOM 覆盖层，打开时游戏时间冻结 -->
<div id="shop">
  <div id="shopMask"></div>
  <div id="shopPanel">
    <div id="shopHead">商店 <span id="shopSeason"></span><span id="shopGold"></span></div>
    <div id="shopTabs">
      <button class="tab" data-tab="buy">购买</button>
      <button class="tab" data-tab="sell">出售</button>
    </div>
    <div id="shopBody"></div>
    <div id="shopFoot">Esc 关闭 · 走到商店摊附近按 E 打开</div>
  </div>
</div>

<!-- 启动菜单：本地有存档时显示「继续 / 新游戏」 -->
<div id="start">
  <div id="startPanel">
    <div id="startTitle">像素农场</div>
    <div id="startSub">P I X E L &nbsp; F A R M</div>
    <div id="startInfo"></div>
    <div id="startWarn"></div>
    <div id="startBtns">
      <button class="mbtn" id="btnContinue">继续游戏</button>
      <button class="mbtn" id="btnNew">新游戏</button>
    </div>
    <div id="startConfirm">
      <div id="confirmText">确定要删除旧存档，从头开始吗？</div>
      <div id="startBtns2">
        <button class="mbtn danger" id="btnNewYes">确定删除并重开</button>
        <button class="mbtn" id="btnNewNo">取消</button>
      </div>
    </div>
    <div id="startFoot">存档保存在浏览器本地（localStorage），刷新页面不会丢</div>
  </div>
</div>

<!-- 系统菜单（Esc）：保存 / 读档 / 删档 -->
<div id="sys">
  <div id="sysMask"></div>
  <div id="sysPanel">
    <div id="sysHead">系统菜单</div>
    <div id="sysInfo"></div>
    <div id="sysBtns">
      <button class="mbtn" id="btnSave">保存游戏</button>
      <button class="mbtn" id="btnLoad">读取存档</button>
      <button class="mbtn danger" id="btnWipe">删除存档</button>
      <button class="mbtn" id="btnClose">继续游戏（Esc）</button>
    </div>
    <div id="sysFoot">Esc 关闭 · 每天开始与离开页面前都会自动保存</div>
  </div>
</div>

<script>
'use strict';

/* === 1.CONFIG === */
/* 所有可调数字都来自这里 —— 改这一个对象即可调整个游戏 */

/* 地块类型（放在 CONFIG 之前：工具表要引用它们） */
const T = {GRASS:0, DIRT:1, WATER:2, TREE:3, ROCK:4, FLOWER:5, HOUSE:6, SHOP:7,
           TILLED:8, WATERED:9, BARE:10};

const CONFIG = {
  VERSION: 'v0.1',          // 版本号（显示在左上角）

  /* 逻辑分辨率（画布内部像素，与屏幕缩放无关） */
  VIEW_W: 960,
  VIEW_H: 540,

  /* 初始金币 */
  INIT_GOLD: 100,

  /* 体力：干活掉体力，睡觉回满；为 0 时干不了活（只能走路） */
  STAMINA: {
    MAX: 100,               // 体力上限
    LOW: 20,                // 低于这个值体力条变红闪烁
    RUN_PER_SEC: 2,         // 奔跑：每秒消耗
    TOOL_COST: {            // 各动作消耗（简报给的：锄地3 浇水1 砍树4 敲石4 收获1 奔跑2/秒）
      hoe: 3,               // 锄地
      can: 1,               // 浇水
      axe: 4,               // 砍树
      pick: 4,              // 敲石
      sickle: 2,            // 清理枯萎作物（简报未列，取 2）
      harvest: 1            // 收获
    }
  },

  /* 睡觉：走到小屋 CONFIG.SLEEP.RANGE 格内按 E */
  SLEEP: {
    RANGE: 1.5,             // 交互距离（格）
    FADE_OUT: 0.8,          // 淡出（秒）
    HOLD: 0.8,              // 全黑停留（秒）
    FADE_IN: 0.8,           // 淡入（秒）
    TITLE: 2.2,             // 「第 N 天」标题停留（秒）
    FAINT_PENALTY: 0.2      // 强制昏睡惩罚：次日体力上限 -20%
  },

  /* 世界 */
  TILE: 32,                 // 每格像素
  MAP_W: 64,                // 地图宽（格）
  MAP_H: 64,                // 地图高（格）
  SEED: 20240613,           // 随机种子（同种子 → 同一张地图）

  /* 地图生成 */
  GEN: {
    FARM_W: 12,             // 中央空地宽（格）
    FARM_H: 12,             // 中央空地高（格）
    HOUSE_W: 3, HOUSE_H: 2, // 小屋尺寸（格）
    SHOP_W: 2,  SHOP_H: 2,  // 商店摊尺寸（格）
    WATER_LEVEL: 0.66,      // 噪声高于此值 → 水
    NOISE_FREQ: 0.11,       // 水体噪声频率（大团块）
    NOISE_FREQ2: 0.045,     // 水体噪声频率（大尺度）
    DIRT_PATCHES: 7,        // 泥土斑块数量
    TREE_CHANCE: 0.075,     // 草地长树概率
    ROCK_CHANCE: 0.05,      // 草地出石概率
    FLOWER_CHANCE: 0.06     // 草地开花概率
  },

  /* 玩家 */
  PLAYER: {
    SPEED: 78,              // 步行速度（像素/秒）
    RUN_MULT: 1.6,          // 奔跑倍率（Shift）
    BODY_W: 16,             // 体型宽
    BODY_H: 24,             // 体型高
    BOX_W: 12,              // 碰撞盒宽（脚部）
    BOX_H: 16,              // 碰撞盒高（脚部）
    ANIM_FPS: 8             // 走路摆腿帧率
  },

  /* 摄像机 */
  CAMERA: { SMOOTH: 7 },    // 跟随缓动（越大越跟手）

  /* 时间：1 游戏日 = 现实 DAY_MINUTES 分钟；6:00 天亮 → 20:00 入夜 → 2:00 强制结束一天 */
  DAY_MINUTES: 6,           // 1 游戏日 = 现实 6 分钟
  DAY_START_HOUR: 6,        // 天亮
  DAY_END_HOUR: 2,          // 强制结束（次日）
  DAY_END_HOLD: 1.2,        // 停在 2:00 多久再翻到次日 6:00（现实秒）
  SKY_SMOOTH: 3,            // 昼夜色平滑系数（越大越快，越小越柔）

  /* 季节 */
  SEASONS: ['春','夏','秋','冬'],
  DAYS_PER_SEASON: 10,      // 每季几天（第 6 轮由 7 调成 10：南瓜 8 天 / 番茄 6+2 天要能在当季走完）
  SEASON_TINT: {            // 地面色调（覆盖在地面上，越大越明显）
    '春': {c:'#7fd05a', a:0.10},
    '夏': {c:'#2f8f22', a:0.18},
    '秋': {c:'#c8862f', a:0.22},
    '冬': {c:'#e8f1fb', a:0.40}
  },

  /* 昼夜染色关键帧：h=一天中的小时，c=叠加色，a=透明度，v=暗角强度 */
  SKY: [
    {h:0.0,  c:'#081432', a:0.55, v:1.00},   /* 深夜 */
    {h:4.5,  c:'#0d1c40', a:0.52, v:0.92},
    {h:6.0,  c:'#ff9a4d', a:0.30, v:0.45},   /* 清晨暖橙 */
    {h:8.0,  c:'#ffc98a', a:0.10, v:0.12},
    {h:11.0, c:'#ffffff', a:0.00, v:0.00},   /* 白天透明 */
    {h:16.0, c:'#ffffff', a:0.00, v:0.00},
    {h:17.5, c:'#ff9a4d', a:0.22, v:0.25},   /* 黄昏橙 */
    {h:19.0, c:'#e0503a', a:0.40, v:0.60},   /* 黄昏橙红 */
    {h:20.5, c:'#101f4a', a:0.55, v:0.95},   /* 入夜深蓝 */
    {h:24.0, c:'#081432', a:0.55, v:1.00}
  ],

  /* 夜间暗角（以玩家为中心的径向渐变） */
  VIGNETTE: { DAY_R: 760, NIGHT_R: 240, NIGHT_A: 0.55 },

  /* 天气：每天早晨随机（带权重）；本轮只做画面与音效，不影响玩法 */
  WEATHER: [
    { id:'sun',  name:'晴', icon:'☀', w:6 },
    { id:'rain', name:'雨', icon:'🌧', w:3 },
    { id:'snow', name:'雪', icon:'❄', w:1 }
  ],
  WEATHER_FX: { RAIN_COUNT: 130, SNOW_COUNT: 90, RAIN_SPEED: 560, SNOW_SPEED: 42 },
  RAIN_TICK_MIN: 0.30,      // 雨声滴答间隔（现实秒，随机下限）
  RAIN_TICK_MAX: 0.85,

  /* 暂停（为 true 时时间/天气/角色全部冻结） */

/* === 2.世界 === */
const TILE_NAMES = ['草地','泥土','水','树','岩石','野花','小屋','商店','耕地','已浇水','空地'];

const MAP_W = CONFIG.MAP_W, MAP_H = CONFIG.MAP_H, TILE = CONFIG.TILE;
const VIEW_W = CONFIG.VIEW_W, VIEW_H = CONFIG.VIEW_H;
let map = new Uint8Array(MAP_W * MAP_H);
/* 作物层：每格最多一株作物；null = 空地
 * 记录字段：type 作物 id / stage 视觉阶段 0~3 / grown 累计生长天数（浇过水的天数）
 *           watered 当天是否浇过水 / mature 是否成熟 / dead 是否枯萎 */
let crops = new Array(MAP_W * MAP_H).fill(null);

/* 中央空地 + 建筑位置（全部由 CONFIG 推导） */
const FARM = {
  x: Math.floor((MAP_W - CONFIG.GEN.FARM_W) / 2),
  y: Math.floor((MAP_H - CONFIG.GEN.FARM_H) / 2),
  w: CONFIG.GEN.FARM_W, h: CONFIG.GEN.FARM_H
};
const HOUSE_POS = {x:FARM.x + 1, y:FARM.y, w:CONFIG.GEN.HOUSE_W, h:CONFIG.GEN.HOUSE_H};
const SHOP_POS  = {x:FARM.x + FARM.w - 1 - CONFIG.GEN.SHOP_W, y:FARM.y, w:CONFIG.GEN.SHOP_W, h:CONFIG.GEN.SHOP_H};
const SPAWN = {x:FARM.x + Math.floor(FARM.w/2), y:FARM.y + Math.floor(FARM.h/2) + 2};

const inFarm = (x,y)=> x>=FARM.x && x<FARM.x+FARM.w && y>=FARM.y && y<FARM.y+FARM.h;
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=> a+(b-a)*t;

/* --- 带种子的伪随机 --- */
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashSeed(x,y,s){
  let n = Math.imul(x|0, 374761393) + Math.imul(y|0, 668265263) + Math.imul(s|0, 1442695041);
  n = Math.imul(n ^ (n>>>13), 1274126177);
  return ((n ^ (n>>>16)) >>>0) / 4294967296;
}
function hash2(x,y){ return hashSeed(x,y,0); }

/* --- 平滑值噪声（用于成片的水塘） --- */
function valueNoise(x,y,freq,seed){
  const fx = x*freq, fy = y*freq;
  const x0 = Math.floor(fx), y0 = Math.floor(fy);
  const tx = fx-x0, ty = fy-y0;
  const sx = tx*tx*(3-2*tx), sy = ty*ty*(3-2*ty);
  const a = lerp(hashSeed(x0,y0,seed),   hashSeed(x0+1,y0,seed),   sx);
  const b = lerp(hashSeed(x0,y0+1,seed), hashSeed(x0+1,y0+1,seed), sx);
  return lerp(a,b,sy);
}
function fbm(x,y,seed){
  return valueNoise(x,y,CONFIG.GEN.NOISE_FREQ,  seed)  * 0.65 +
         valueNoise(x,y,CONFIG.GEN.NOISE_FREQ2, seed+1) * 0.35;
}

/* --- 地图生成 --- */
function genMap(seed){
  const rnd = mulberry32(seed);
  map.fill(T.GRASS);
  crops.fill(null);

  /* 1) 外围一圈水：天然边界 */
  for(let x=0;x<MAP_W;x++){ map[x] = T.WATER; map[(MAP_H-1)*MAP_W+x] = T.WATER; }
  for(let y=0;y<MAP_H;y++){ map[y*MAP_W] = T.WATER; map[y*MAP_W+MAP_W-1] = T.WATER; }

  /* 2) 噪声水塘（成片分布），中央空地除外 */
  for(let y=1;y<MAP_H-1;y++) for(let x=1;x<MAP_W-1;x++){
    if(inFarm(x,y)) continue;
    if(fbm(x,y,seed) > CONFIG.GEN.WATER_LEVEL) map[y*MAP_W+x] = T.WATER;
  }

  /* 3) 泥土斑块 */
  for(let k=0;k<CONFIG.GEN.DIRT_PATCHES;k++){
    const w = 2 + ((rnd()*3)|0), h = 2 + ((rnd()*2)|0);
    const px = 2 + ((rnd()*(MAP_W-w-4))|0), py = 2 + ((rnd()*(MAP_H-h-4))|0);
    for(let y=py;y<py+h;y++) for(let x=px;x<px+w;x++){
      if(inFarm(x,y)) continue;
      if(map[y*MAP_W+x] === T.GRASS) map[y*MAP_W+x] = T.DIRT;
    }
  }

  /* 4) 中央 12×12 强制空地（纯草地，无任何随机物件） */
  for(let y=FARM.y;y<FARM.y+FARM.h;y++)
    for(let x=FARM.x;x<FARM.x+FARM.w;x++) map[y*MAP_W+x] = T.GRASS;

  /* 5) 树 / 岩石 / 野花（只在草地上，且避开空地） */
  for(let y=1;y<MAP_H-1;y++) for(let x=1;x<MAP_W-1;x++){
    if(inFarm(x,y)) continue;
    const i = y*MAP_W+x;
    if(map[i] !== T.GRASS) continue;
    const r = rnd();
    if(r < CONFIG.GEN.TREE_CHANCE) map[i] = T.TREE;
    else if(r < CONFIG.GEN.TREE_CHANCE + CONFIG.GEN.ROCK_CHANCE) map[i] = T.ROCK;
    else if(r < CONFIG.GEN.TREE_CHANCE + CONFIG.GEN.ROCK_CHANCE + CONFIG.GEN.FLOWER_CHANCE) map[i] = T.FLOWER;
  }

  /* 6) 建筑（小屋 1 间 + 商店摊 1 个，放在空地内上缘） */
  for(let y=HOUSE_POS.y;y<HOUSE_POS.y+HOUSE_POS.h;y++)
    for(let x=HOUSE_POS.x;x<HOUSE_POS.x+HOUSE_POS.w;x++) map[y*MAP_W+x] = T.HOUSE;
  for(let y=SHOP_POS.y;y<SHOP_POS.y+SHOP_POS.h;y++)
    for(let x=SHOP_POS.x;x<SHOP_POS.x+SHOP_POS.w;x++) map[y*MAP_W+x] = T.SHOP;

  const cnt = [0,0,0,0,0,0,0,0];
  for(let i=0;i<map.length;i++) cnt[map[i]]++;
  let farmWild = 0;
  for(let y=FARM.y;y<FARM.y+FARM.h;y++) for(let x=FARM.x;x<FARM.x+FARM.w;x++){
    const t = map[y*MAP_W+x];
    if(t===T.TREE||t===T.ROCK||t===T.FLOWER) farmWild++;
  }
  console.log('[map] seed=' + seed + ' | grass=' + cnt[T.GRASS] + ' dirt=' + cnt[T.DIRT] +
    ' water=' + cnt[T.WATER] + ' tree=' + cnt[T.TREE] + ' rock=' + cnt[T.ROCK] +
    ' flower=' + cnt[T.FLOWER] + ' house=' + cnt[T.HOUSE] + ' shop=' + cnt[T.SHOP] +
    ' | farm ' + FARM.w + 'x' + FARM.h + ' wild-in-farm=' + farmWild);
  return cnt;
}

/* 等比缩放并居中：整数倍优先（像素锐利），窗口再小也不会变形/溢出 */
function fitCanvas(){
  const scale = Math.min(window.innerWidth / VIEW_W, window.innerHeight / VIEW_H);
  const s = CONFIG.INTEGER_SCALE && scale >= 1 ? Math.floor(scale) : scale;
  const finalScale = Math.max(CONFIG.MIN_SCALE, s);
  canvas.style.width  = Math.round(VIEW_W * finalScale) + 'px';
  canvas.style.height = Math.round(VIEW_H * finalScale) + 'px';
}
window.addEventListener('resize', ()=>{ fitCanvas(); layoutToasts(); });
fitCanvas();

/* --- 单个瓦片绘制 --- */
function drawTree(g,x,y){
  const C = CONFIG.TILE_COLORS;
  g.fillStyle = C.treeTrunk;     g.fillRect(x+13, y+18, 6, 14);
  g.fillStyle = C.treeTrunkDark; g.fillRect(x+14, y+19, 2, 13);
  g.fillStyle = C.treeLeaf;      g.fillRect(x+6,  y+8,  20, 14);
  g.fillStyle = C.treeLeaf;      g.fillRect(x+9,  y+4,  14, 18);
  g.fillStyle = C.treeLeafLight; g.fillRect(x+8,  y+7,  16, 12);
  g.fillStyle = C.treeLeafTop;   g.fillRect(x+11, y+5,  9,  7);
}
function drawRock(g,x,y){
  const C = CONFIG.TILE_COLORS;
  g.fillStyle = C.rockDark;  g.fillRect(x+6,  y+16, 20, 13);
  g.fillStyle = C.rock;      g.fillRect(x+9,  y+11, 14, 11);
  g.fillStyle = C.rockLight; g.fillRect(x+11, y+9,   9,  6);
  g.fillStyle = C.rockDark;  g.fillRect(x+19, y+18,  7,  9);
}
function drawFlower(g,x,y,v){

/* --- 建造物：木栅栏 / 木箱 / 洒水器 --- */
function drawFence(g,x,y){

  g.fillRect(x+23, y+9, 5, 23);
  g.fillStyle = C.fencePostDark; g.fillRect(x+4,  y+9, 2, 23);
  g.fillRect(x+23, y+9, 2, 23);
  g.fillStyle = C.fenceRail;     g.fillRect(x+2, y+12, 28, 4);
  g.fillRect(x+2, y+22, 28, 4);
  g.fillStyle = C.fenceRailDark; g.fillRect(x+2, y+15, 28, 1);
  g.fillRect(x+2, y+25, 28, 1);
}
function drawChest(g,x,y,open){
  const C = CONFIG.TILE_COLORS;
  const lidY = open ? y+3 : y+8;
  g.fillStyle = C.chestBodyDark; g.fillRect(x+4, y+16, 24, 15);
  g.fillStyle = C.chestBody;     g.fillRect(x+5, y+17, 22, 13);
  g.fillStyle = C.chestLidDark;  g.fillRect(x+2, lidY, 28, 8);
  g.fillStyle = C.chestLid;      g.fillRect(x+3, lidY+1, 26, 6);
  g.fillStyle = C.chestLock;     g.fillRect(x+14, y+15, 4, 5);
  g.fillStyle = C.chestBodyDark; g.fillRect(x+5, y+28, 22, 2);
}
function drawSprinkler(g,x,y,t){
  const C = CONFIG.TILE_COLORS;
  g.fillStyle = C.sprinkBase; g.fillRect(x+7, y+27, 18, 4);
  g.fillStyle = C.sprinkPost; g.fillRect(x+14, y+15, 4, 13);
  const a = t * 1.8;
  const dx = Math.cos(a) * 9, dy = Math.sin(a) * 4;
  g.fillStyle = C.sprinkHeadDark; g.fillRect(x+12+dx, y+12+dy, 8, 5);
  g.fillStyle = C.sprinkHead;     g.fillRect(x+13+dx, y+11+dy, 6, 3);
  g.fillStyle = C.dropWater;      g.fillRect(x+4+dx, y+17+dy, 2, 2);
  g.fillRect(x+22+dx, y+17+dy, 2, 2);
}
function drawBuilding(g,b,x,y){
  if(b.type === 'fence')     drawFence(g,x,y);
  else if(b.type === 'chest') drawChest(g,x,y, chestOpen && openChest === b);
  else if(b.type === 'sprinkler') drawSprinkler(g,x,y, animTime);
}
/* 石板路：半透明地铺在地面上（底下是耕地也照样能看见犁沟） */
function drawRoadTile(g,x,y){
  const C = CONFIG.TILE_COLORS;
  const sl = [[1,1],[17,1],[1,17],[17,17]];
  for(const s of sl){
    g.globalAlpha = 0.60; g.fillStyle = C.roadStone;
    g.fillRect(x+s[0], y+s[1], 14, 14);
    g.globalAlpha = 0.80; g.fillStyle = C.roadStoneLight;
    g.fillRect(x+s[0], y+s[1], 14, 2);
    g.globalAlpha = 0.55; g.fillStyle = C.roadStoneDark;
    g.fillRect(x+s[0], y+s[1]+12, 14, 2);
  }
  g.globalAlpha = 1;
}
function drawRoads(g,x0,y0,x1,y1){
  for(let ty=y0;ty<=y1;ty++)
    for(let tx=x0;tx<=x1;tx++){
      if(!roads[ty*MAP_W+tx]) continue;
      drawRoadTile(g, tx*TILE - cam.x, ty*TILE - cam.y);
    }
}

/* 地面层：草地 / 泥土 / 水
 * 注意：树/岩石/野花/建筑所在格也铺草地底色（物件画在其上），避免出现黑块 */
function drawGround(g,x0,y0,x1,y1){
  const C = CONFIG.TILE_COLORS;
  for(let ty=y0;ty<=y1;ty++){
    for(let tx=x0;tx<=x1;tx++){
      const x = tx*TILE - cam.x, y = ty*TILE - cam.y;
      const t = map[ty*MAP_W+tx];
      if(t === T.DIRT){
        g.fillStyle = C.dirt; g.fillRect(x,y,TILE,TILE);
        g.fillStyle = C.dirtLine;
        g.fillRect(x+1, y+5,  TILE-2, 4);
        g.fillRect(x+1, y+15, TILE-2, 4);
        g.fillRect(x+1, y+25, TILE-2, 4);
        g.fillStyle = C.dirtLine2; g.fillRect(x+1, y+2, TILE-2, 2);
      } else if(t === T.TILLED){                       /* 耕地：横向犁沟 */
        g.fillStyle = C.tilled; g.fillRect(x,y,TILE,TILE);
        g.fillStyle = C.tilledRidge;
        g.fillRect(x+1, y+4,  TILE-2, 3);
        g.fillRect(x+1, y+13, TILE-2, 3);
        g.fillRect(x+1, y+22, TILE-2, 3);
        g.fillStyle = C.tilledLine;
        g.fillRect(x+1, y+8,  TILE-2, 2);
        g.fillRect(x+1, y+17, TILE-2, 2);
        g.fillRect(x+1, y+26, TILE-2, 2);
      } else if(t === T.WATERED){                     /* 已浇水：湿土 + 反光 */
        g.fillStyle = C.watered; g.fillRect(x,y,TILE,TILE);
        g.fillStyle = C.tilledRidge;
        g.fillRect(x+1, y+4,  TILE-2, 3);
        g.fillRect(x+1, y+13, TILE-2, 3);
        g.fillRect(x+1, y+22, TILE-2, 3);
        g.fillStyle = C.wateredSheen;
        g.fillRect(x + 4 + ((hash2(tx,ty)*8)|0), y+9,  7, 2);
        g.fillRect(x + 18 - ((hash2(ty,tx)*7)|0), y+24, 6, 2);
      } else if(t === T.BARE){                         /* 空地：浅色裸土 */
        g.fillStyle = C.bare; g.fillRect(x,y,TILE,TILE);
        g.fillStyle = C.bareDot;
        g.fillRect(x + ((hash2(tx,ty)*26)|0), y + ((hash2(ty,tx)*26)|0), 3, 2);
        g.fillRect(x + ((hash2(tx*3+1,ty)*24)|0), y + ((hash2(tx,ty*5+2)*24)|0), 2, 2);
        g.fillStyle = C.bareStone;
        g.fillRect(x + 6 + ((hash2(tx*7,ty*3)*18)|0), y + 20, 3, 3);
      } else if(t === T.WATER){
        g.fillStyle = C.water; g.fillRect(x,y,TILE,TILE);
        const ph = ((animTime*3)|0) + tx*3 + ty*5;
        g.fillStyle = C.waterLight;
        g.fillRect(x + 3 + (ph % 7),      y + 8,  9, 2);
        g.fillRect(x + 14 - ((ph*2) % 7), y + 21, 8, 2);
        g.fillStyle = C.waterDark;
        g.fillRect(x + 2 + ((ph*3) % 9),   y + 28, 6, 1);
      } else {
        /* 草地（含树/石/花/建筑所在格的地基） */
        g.fillStyle = C.grass; g.fillRect(x,y,TILE,TILE);
        const h1 = hash2(tx,ty), h2 = hash2(ty*7+3, tx*11+5), h3 = hash2(tx*13+1, ty*17+2);
        g.fillStyle = C.grassDot;  g.fillRect(x + ((h1*28)|0), y + ((h2*28)|0), 2, 2);
        g.fillStyle = C.grassDot2; g.fillRect(x + ((h2*26)|0), y + ((h3*27)|0), 2, 2);
        g.fillStyle = C.grassDot;  g.fillRect(x + ((h3*25)|0), y + ((h1*29)|0), 3, 1);
      }
    }
  }
}

/* 物件层：树 / 岩石 / 野花（建筑单独绘制，可跨格） */
function drawObjects(g,x0,y0,x1,y1){
  for(let ty=y0;ty<=y1;ty++){
    for(let tx=x0;tx<=x1;tx++){
      const t = map[ty*MAP_W+tx];
      if(t===T.TREE || t===T.ROCK || t===T.FLOWER){
        const x = tx*TILE - cam.x, y = ty*TILE - cam.y;
        if(t===T.TREE) drawTree(g,x,y);
        else if(t===T.ROCK) drawRock(g,x,y);
        else drawFlower(g,x,y,(hash2(tx,ty)*3)|0);
      }
    }
  }
}

/* 季节层：给地面叠一层季节色调（冬偏冷白），只影响地面，不影响物件 */
function drawSeasonOverlay(g,x0,y0,x1,y1){
  const st = CONFIG.SEASON_TINT[seasonName()];
  if(!st || st.a <= 0) return;
  g.globalAlpha = st.a;
  g.fillStyle = st.c;
  g.fillRect(x0*TILE - cam.x, y0*TILE - cam.y, (x1-x0+1)*TILE, (y1-y0+1)*TILE);
  g.globalAlpha = 1;
}

/* --- 作物层：4 个视觉阶段（株高/叶片递增）+ 结果期果实 + 枯萎形态 --- */
function mixHex(a,b,t){
  const A = hexToRgb(a), B = hexToRgb(b);
  const c = [0,1,2].map(i => Math.round(A[i] + (B[i]-A[i]) * t));
  return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
}
function drawCrop(g,x,y,crop){
  const A = CONFIG.CROP_ART, def = cropDef(crop.type);
  const baseY = y + TILE - 7;                       /* 地表基线 */
  const cx = x + TILE/2;
  if(crop.dead){                                   /* 枯萎：褐茎 + 下垂黄叶 */
    g.fillStyle = A.DEAD_STEM; g.fillRect(cx-1, baseY-6, 3, 6);
    g.fillStyle = A.DEAD_LEAF;
    g.fillRect(cx-6, baseY-5, 6, 3);
    g.fillRect(cx+1, baseY-2, 5, 3);
    g.fillStyle = '#6b5730'; g.fillRect(cx-3, baseY-1, 6, 2);
    return;
  }
  const stage = crop.stage;
  const h = A.STAGE_H[stage], lw = A.LEAF_W[stage];
  g.fillStyle = def.leaf;                          /* 茎 */
  g.fillRect(cx-1, baseY-h, 3, h);
  g.fillStyle = def.leaf;                          /* 叶 */
  g.fillRect(cx-lw, baseY-h+1, lw, 3);
  g.fillRect(cx+1, baseY-h+Math.max(2, h>>1), lw, 3);
  if(stage >= 2){                                  /* 嫩叶高光 */
    g.fillStyle = mixHex(def.leaf, '#d8e86a', 0.35);
    g.fillRect(cx-lw+1, baseY-h+2, Math.max(1, lw-2), 2);
  }
  if(stage >= 3){                                  /* 结果期：果实 */
    const ripe = ripeness(crop);
    const col = mixHex(def.unripe, def.ripe, ripe);
    if(crop.type === 'radish'){                    /* 根菜：露出土面的红萝卜 */
      const r = 3 + Math.round(3*ripe);
      g.fillStyle = col; g.fillRect(cx-r, baseY-r+1, r*2, r+2);
      g.fillStyle = mixHex(col, '#ffffff', 0.35);
      g.fillRect(cx-r+1, baseY-r+2, 2, 2);
    }else if(crop.type === 'potato'){              /* 土豆：土里的褐色块 */
      const r = 4 + Math.round(2*ripe);
      g.fillStyle = col; g.fillRect(cx-r, baseY-r, r*2, r+1);
      g.fillStyle = mixHex(col, '#000000', 0.25);
      g.fillRect(cx-r+2, baseY-1, 3, 2);
    }else if(crop.type === 'tomato'){              /* 番茄：挂在茎上的红果 */
      const r = 3 + Math.round(3*ripe);
      const fx = cx + (ripe > 0.5 ? 5 : -5), fy = baseY - h + 6;
      g.fillStyle = col;
      g.beginPath(); g.arc(fx, fy, r, 0, Math.PI*2); g.fill();
      g.fillStyle = mixHex(col, '#ffffff', 0.4);
      g.fillRect(fx-1, fy-r+1, 2, 2);
    }else{                                          /* 南瓜：地上的大果子 */
      const r = 5 + Math.round(4*ripe);
      g.fillStyle = col;
      g.beginPath(); g.arc(cx, baseY-r+2, r, 0, Math.PI*2); g.fill();
      g.fillStyle = mixHex(col, '#000000', 0.22);
      g.fillRect(cx-1, baseY-r, 3, 4);
      g.fillStyle = mixHex(col, '#ffffff', 0.3);
      g.fillRect(cx-r+2, baseY-r+1, 3, 2);
    }
  }
  if(crop.mature){                                 /* 成熟：果实旁闪一下金光 */
    const bob = ((animTime*10)|0) % 6;
    g.fillStyle = 'rgba(255,215,106,' + (0.9 - bob*0.12).toFixed(2) + ')';
    g.fillRect(cx + 7, baseY - h - 5 + bob, 2, 2);
  }
}
function drawCrops(g,x0,y0,x1,y1){
  for(let ty=y0;ty<=y1;ty++){
    for(let tx=x0;tx<=x1;tx++){
      const c = crops[ty*MAP_W+tx];
      if(!c) continue;
      drawCrop(g, tx*TILE - cam.x, ty*TILE - cam.y, c);
    }
  }
}

/* 建筑层：整栋绘制（跨 3×2 / 2×2 格） */
function drawBuildings(g){
  const hx = HOUSE_POS.x*TILE - cam.x, hy = HOUSE_POS.y*TILE - cam.y;
  if(hx < VIEW_W && hx + HOUSE_POS.w*TILE > 0 && hy < VIEW_H && hy + HOUSE_POS.h*TILE > 0) drawHouse(g,hx,hy);
  const sx = SHOP_POS.x*TILE - cam.x, sy = SHOP_POS.y*TILE - cam.y;
  if(sx < VIEW_W && sx + SHOP_POS.w*TILE > 0 && sy < VIEW_H && sy + SHOP_POS.h*TILE > 0) drawShop(g,sx,sy);
}

/* --- 按 Y 排序的实体层：小屋 / 商店 / 建造物 / 玩家 ---
 * 排序键 = 脚底的 Y：站在后面的东西先画，站在前面的东西压在上面 */
function drawEntities(g){
  const list = [];
  list.push({y:(HOUSE_POS.y + HOUSE_POS.h)*TILE, f:()=>drawHouse(g, HOUSE_POS.x*TILE-cam.x, HOUSE_POS.y*TILE-cam.y)});
  list.push({y:(SHOP_POS.y + SHOP_POS.h)*TILE,  f:()=>drawShop(g, SHOP_POS.x*TILE-cam.x, SHOP_POS.y*TILE-cam.y)});
  for(const b of buildings){
    const bx = b.tx*TILE - cam.x, by = b.ty*TILE - cam.y;
    if(bx < -TILE || bx > VIEW_W || by < -TILE || by > VIEW_H) continue;
    list.push({y:b.ty*TILE + TILE, f:()=>drawBuilding(g,b,bx,by)});
  }
  list.push({y:player.y + BOX_OFF_Y + CONFIG.PLAYER.BOX_H/2, f:()=>drawPlayer(g)});
  list.sort((a,b)=>a.y - b.y);
  for(const e of list) e.f();
}

/* --- 建造预览：能放 = 绿色，放不了 = 红色 --- */
function drawBuildPreview(g){
  if(!buildMode) return;
  if(hover.tx < 0 || hover.ty < 0) return;
  const r = curRecipe();
  if(!r) return;
  const tx = hover.tx, ty = hover.ty;
  const x = tx*TILE - cam.x, y = ty*TILE - cam.y;
  const p = buildPreview(tx,ty,r);
  g.globalAlpha = 0.40;
  g.fillStyle = p.ok ? 'rgba(90,230,120,0.75)' : 'rgba(240,90,80,0.75)';
  g.fillRect(x+1, y+1, TILE-2, TILE-2);
  g.globalAlpha = 0.62;
  if(r.overlay) drawRoadTile(g,x,y);
  else if(r.id === 'fence')     drawFence(g,x,y);
  else if(r.id === 'chest')     drawChest(g,x,y,false);
  else if(r.id === 'sprinkler') drawSprinkler(g,x,y, animTime);
  g.globalAlpha = 1;
  g.strokeStyle = p.ok ? 'rgba(120,255,150,0.95)' : 'rgba(255,110,100,0.95)';
  g.lineWidth = 2;
  g.strokeRect(x+1, y+1, TILE-2, TILE-2);
}
/* 建造面板里的 14×14 小图标 */
function drawBuildIcon(g,id,x,y){
  const C = CONFIG.TILE_COLORS;
  if(id === 'fence'){
    g.fillStyle = C.fencePost; g.fillRect(x+1, y+2, 3, 11); g.fillRect(x+10, y+2, 3, 11);
    g.fillStyle = C.fenceRail; g.fillRect(x, y+4, 14, 2); g.fillRect(x, y+8, 14, 2);
  }else if(id === 'chest'){
    g.fillStyle = C.chestLid;  g.fillRect(x, y+2, 14, 4);
    g.fillStyle = C.chestBody; g.fillRect(x+1, y+6, 12, 7);
    g.fillStyle = C.chestLock; g.fillRect(x+6, y+6, 2, 3);
  }else if(id === 'path'){
    g.fillStyle = C.roadStone;     g.fillRect(x, y+2, 6, 5); g.fillRect(x+8, y+2, 6, 5);
    g.fillRect(x, y+9, 6, 5); g.fillRect(x+8, y+9, 6, 5);
    g.fillStyle = C.roadStoneDark; g.fillRect(x+6, y+2, 2, 5); g.fillRect(x, y+7, 6, 2);
  }else if(id === 'sprinkler'){
    g.fillStyle = C.sprinkPost; g.fillRect(x+6, y+6, 2, 7);
    g.fillStyle = C.sprinkHead; g.fillRect(x+2, y+3, 10, 3);
    g.fillStyle = C.dropWater;  g.fillRect(x+1, y+9, 2, 2); g.fillRect(x+11, y+9, 2, 2);
  }
}
/* 建造面板（左侧）：配方 + 材料够不够 */
function drawBuildPanel(g, y0){
  const R = CONFIG.BUILD.RECIPES;
  const rowH = 24, w = 214, headH = 22, footH = 20;
  const h = headH + R.length*rowH + footH;
