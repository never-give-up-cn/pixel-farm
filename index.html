/* === 7.存档 === */
/* 浏览器本地存档：localStorage 单档位，键名 CONFIG.SAVE.KEY（farm_save_v1）
 *
 * 存档结构（版本 CONFIG.SAVE.VERSION）：
 * {
 *   v    : 1,                        // 存档版本号（对不上会提示并可选择重置）
 *   at   : 1730000000000,            // 保存时刻（时间戳）
 *   seed : 20240613,                 // 地图种子（读档时按它重新生成底图）
 *   player : {x, y},                 // 位置
 *   gold, stamina, staminaMax, canWater, canLevel, hotSel,
 *   time  : {day, min, hold},        // 第几天 / 从 6:00 起过的分钟 / 2:00 停留计时
 *   weather : 'sun',                 // 天气 id
 *   map   : {"x,y": 地块类型},          // 只存与初始生成不同的格子（diff）
 *   crops : [{x,y,type,stage,grown,watered,mature,dead}],   // 只存有作物的格
 *   buildings : [{type,x,y,slots:[{id,n}]}],                 // 建造物（木箱带储物）
 *   roads : ["x,y"],                 // 石板路（叠加层）
 *   inv   : [{slot,id,n}]            // 背包（只存有物品的格）
 * }
 *
 * 读档流程：按 seed 重新生成底图 → 叠加 map 的 diff → 还原其余状态。
 * 底图 diff 是省体积的关键：整张 64×64 地图要 ~8KB，改 20 格只要几百字节。 */
let baseMap = new Uint8Array(MAP_W*MAP_H);   /* 初始生成的底图（用来算 diff） */
let lastSaveBytes = 0;                      /* 最近一次存档的字节数 */
let sessionActive = false;                  /* 本次会话是否已开始（标题界面没选之前不覆盖旧档） */

/* 把当前地图记成"底图" */
function snapshotBaseMap(){ baseMap.set(map); }

/* 地图 diff：只记录与底图不同的格子 */
function mapDiff(){
  const d = {};
  for(let i=0;i<map.length;i++){
    if(map[i] !== baseMap[i]) d[(i % MAP_W) + ',' + ((i / MAP_W) | 0)] = map[i];
  }
  return d;
}
/* 把 diff 叠回地图（读档时用） */
function applyMapDiff(diff){
  if(!diff || typeof diff !== 'object') return 0;
  let n = 0;
  for(const k in diff){
    const p = k.split(',');
    const x = +p[0], y = +p[1];
    if(!(x >= 0 && y >= 0 && x < MAP_W && y < MAP_H)) continue;
    setTile(y*MAP_W+x, diff[k] | 0);
    n++;
  }
  return n;
}
/* 背包面板里"拎在手上"的物品先放回背包，免得存档时丢东西 */
function stowHeld(){
  if(!held) return;
  const h = held; held = null;
  if(typeof h.from === 'number' && h.from >= 0 && h.from < inv.length && !inv[h.from])
    inv[h.from] = {id:h.id, n:h.n};
  else addItem(h.id, h.n);
}
/* 生成一份存档数据（纯 JSON 对象） */
function serializeState(){
  stowHeld();
  const cs = [];
  for(let i=0;i<crops.length;i++){
    const c = crops[i];
    if(!c) continue;
    cs.push({x:(i % MAP_W), y:((i / MAP_W) | 0), type:c.type, stage:c.stage|0,
             grown:c.grown|0, watered:!!c.watered, mature:!!c.mature, dead:!!c.dead});
  }
  const rs = [];
  for(let i=0;i<roads.length;i++) if(roads[i]) rs.push((i % MAP_W) + ',' + ((i / MAP_W) | 0));
  return {
    v: CONFIG.SAVE.VERSION,
    at: Date.now(),
    seed: CONFIG.SEED,
    player: {x: player.x, y: player.y},
    gold: gold,
    stamina: stamina,
    staminaMax: staminaMax,
    canWater: canWater,
    canLevel: canLevel,
    hotSel: hotSel,
    time: {day: clock.day, min: clock.min, hold: clock.hold},
    weather: weather.id,
    map: mapDiff(),
    crops: cs,
    buildings: buildings.map(b => ({type:b.type, x:b.tx, y:b.ty,
      slots: b.slots ? b.slots.map(s => s ? {id:s.id, n:s.n} : null) : null})),
    roads: rs,
    inv: inv.map((s,i)=> s ? {slot:i, id:s.id, n:s.n} : null).filter(Boolean),
    /* 第 12 轮新增（可选字段，老存档没有也能读）：新手引导进度 + 静音状态 */
    tut: {step:tut.step|0, moved:Math.round(tut.moved), tilled:tut.tilled|0,
          sown:tut.sown|0, slept:!!tut.slept},
    snd: audioMuted ? 1 : 0,
    /* 第 13 轮新增：居民好感度 / 当日已送礼标记 / 解锁状态（紧凑结构） */
    npc: npcSerialize(),
    /* 第 14 轮新增：图鉴（两个位掩码，8 位鱼 + 3 位采集物，固定 30 字节左右） */
    dex: {f: dexState.f >>> 0, g: dexState.g >>> 0}
  };
}
/* 读入一份存档数据（覆盖当前状态） */
function deserializeState(d){
  if(!d || typeof d !== 'object') return false;
  try{
    /* 地图：按存档里的种子重新生成底图，再叠加 diff */
    const seed = (typeof d.seed === 'number') ? d.seed : CONFIG.SEED;
    genMap(seed);
    snapshotBaseMap();
    applyMapDiff(d.map);
    /* 作物 */
    crops.fill(null);
    if(Array.isArray(d.crops))
      for(const c of d.crops){
        if(!c) continue;
        const x = c.x|0, y = c.y|0;
        if(x < 0 || y < 0 || x >= MAP_W || y >= MAP_H) continue;
        if(!cropDef(c.type)) continue;
        crops[y*MAP_W+x] = {type:c.type, stage:c.stage|0, grown:c.grown|0,
                            watered:!!c.watered, mature:!!c.mature, dead:!!c.dead};
      }
    /* 建造物 + 石板路 */
    buildings = [];
    buildIndex.fill(-1);
    roads = new Uint8Array(MAP_W*MAP_H);
    if(Array.isArray(d.buildings))
      for(const b of d.buildings){
        if(!b || !buildRecipe(b.type)) continue;
        const x = b.x|0, y = b.y|0;
        if(x < 0 || y < 0 || x >= MAP_W || y >= MAP_H) continue;
        const nb = {type:b.type, tx:x, ty:y};
        if(b.type === 'chest'){
          nb.slots = new Array(CONFIG.BUILD.CHEST_SLOTS).fill(null);
          if(Array.isArray(b.slots))
            for(let k=0;k<nb.slots.length && k<b.slots.length;k++){
              const s = b.slots[k];
              if(s && CONFIG.ITEMS[s.id]) nb.slots[k] = {id:s.id, n:s.n|0};
            }
        }
        buildings.push(nb);
        buildIndex[y*MAP_W+x] = buildings.length - 1;
      }
    if(Array.isArray(d.roads))
      for(const k of d.roads){
        const p = String(k).split(',');
        const x = +p[0], y = +p[1];
        if(x >= 0 && y >= 0 && x < MAP_W && y < MAP_H) roads[y*MAP_W+x] = 1;
      }
    /* 玩家 / 背包 / 时间 / 天气 */
    if(d.player){ player.x = d.player.x; player.y = d.player.y; }
    if(typeof d.gold === 'number') gold = d.gold;
    if(typeof d.staminaMax === 'number') staminaMax = clamp(d.staminaMax, 1, CONFIG.STAMINA.MAX);
    if(typeof d.stamina === 'number') stamina = clamp(d.stamina, 0, staminaMax);
    if(typeof d.canLevel === 'number') canLevel = clamp(d.canLevel|0, 0, CONFIG.SHOP.CAN_MAX_LEVEL);
    if(typeof d.canWater === 'number') canWater = clamp(d.canWater, 0, canCapacity());
    if(typeof d.hotSel === 'number') hotSel = clamp(d.hotSel, 0, CONFIG.INVENTORY.HOTBAR - 1);
    if(Array.isArray(d.inv)){
      inv = new Array(CONFIG.INVENTORY.SLOTS).fill(null);
      for(const e of d.inv){
        if(!e || !CONFIG.ITEMS[e.id]) continue;
        const i = (typeof e.slot === 'number') ? e.slot : inv.findIndex(s=>!s);
        if(i < 0 || i >= inv.length) continue;
        inv[i] = {id:e.id, n:e.n|0};
      }
    }
    if(d.time){
      clock.day = Math.max(1, d.time.day|0);
      clock.min = Math.max(0, d.time.min|0);
      clock.hold = Math.max(0, d.time.hold|0);
    }
    if(d.weather) weather = CONFIG.WEATHER.find(w=>w.id===d.weather) || weather;
    /* 新手引导进度（老存档没这个字段 → 回到第 1 步重来） */
    if(d.tut && typeof d.tut === 'object'){
      tut.step   = clamp(d.tut.step|0, 0, TUT_STEPS.length);
      tut.moved  = Math.max(0, d.tut.moved|0);
      tut.tilled = Math.max(0, d.tut.tilled|0);
      tut.sown   = Math.max(0, d.tut.sown|0);
      tut.slept  = !!d.tut.slept;
    }else{
      tut.step = 0; tut.moved = 0; tut.tilled = 0; tut.sown = 0; tut.slept = false;
    }
    /* 静音状态（老存档没这个字段 → 保持当前设置） */
    if(typeof d.snd === 'number') setMuted(d.snd ? true : false, true);
    /* 居民状态（老存档没这个字段 → 当作"刚认识"，其余进度不受影响） */
    npcDeserialize(d.npc);
    /* 图鉴（老存档没这个字段 → 图鉴为空；超出的位按 0 截断） */
    dexResetState();
    if(d.dex && typeof d.dex === 'object'){
      const fMax = (1 << CONFIG.FISHING.LIST.length) - 1;
      const gMax = (1 << CONFIG.GATHER.TYPES.length) - 1;
      dexState.f = ((d.dex.f | 0) & fMax) >>> 0;
      dexState.g = ((d.dex.g | 0) & gMax) >>> 0;
    }
    held = null;
    cancelFishing(true);                       /* 读档时先收竿，不从旧状态接着钓 */
    refreshDexGrid();
    /* 老存档（v2 及以前）地图上没有采集物：如果今天是刷新日，补一批（不弹提示） */
    if(!map.some(isGatherTile)){
      const sd = ((clock.day - 1) % CONFIG.DAYS_PER_SEASON) + 1;
      if(sd % Math.max(1, CONFIG.GATHER.EVERY_DAYS) === 1) spawnGather(true);
    }
    /* 收尾：摄像机贴人、天色跟着时间、天气粒子重来一遍 */
    cam.x = clamp(player.x - VIEW_W/2, 0, MAP_W*TILE - VIEW_W);
    cam.y = clamp(player.y - VIEW_H/2, 0, MAP_H*TILE - VIEW_H);
    const sky0 = skyAt(skyHour());
    sky.cur = {r:sky0.r, g:sky0.g, b:sky0.b, a:sky0.a, v:sky0.v};
    spawnParticles();
    refreshPackGrid();
    updateStats();
    updateTut();
    return true;
  }catch(e){
    console.warn('[save] 读档失败：', e);
    return false;
  }
}

/* --- localStorage 读写（隐私模式 / 禁用存储时会抛错，全部包 try） --- */
function readSave(){
  try{
    const raw = window.localStorage.getItem(CONFIG.SAVE.KEY);
    if(!raw) return null;
    const d = JSON.parse(raw);
    return (d && typeof d === 'object') ? d : null;
  }catch(e){
    console.warn('[save] 存档读取失败：', e);
    return null;
  }
}
function writeSave(d){
  try{
    window.localStorage.setItem(CONFIG.SAVE.KEY, JSON.stringify(d));
    return true;
  }catch(e){
    console.warn('[save] 存档写入失败：', e);
    return false;
  }
}
function deleteSave(){
  try{ window.localStorage.removeItem(CONFIG.SAVE.KEY); }catch(e){}
}
/* 有没有存档 */
function hasSave(){ return !!readSave(); }
/* 存档版本对不对得上：旧版本会先 migrate() 升级，所以 ≤ 当前版本都算 OK；只有"更新版本"才不兼容 */
function saveVersionOK(d){ return !!d && (d.v|0) <= CONFIG.SAVE.VERSION; }
/* 存档里存的是第几天 */
function saveDay(d){ return (d && d.time) ? (d.time.day|0) : 1; }

/* 存档（手动 / 自动都走这里） */
function saveGame(reason){
  const data = serializeState();
  const raw = JSON.stringify(data);
  lastSaveBytes = raw.length;
  if(writeSave(data)){
    console.log('[save] 已保存：第 ' + data.time.day + ' 天 · ' + (lastSaveBytes/1024).toFixed(1) + ' KB');
    if(reason) toast('已保存（' + reason + '）');
    return true;
  }
  toast('保存失败：浏览器可能禁用了本地存储');
  return false;
}
/* 读档 */
function loadGame(){
  const raw = readSave();
  if(!raw){ toast('没有存档'); return false; }
  const r = migrateSave(raw);           /* 旧版本先迁移；迁移失败只降级，不清空进度 */
  const ok = deserializeState(r.save);
  if(r.degraded) toast('存档升级失败，已按旧版本读取（居民数据可能缺失）');
  else toast(ok ? '已读取存档（第 ' + clock.day + ' 天）' : '存档读取失败');
  return ok;
}
/* 删档 */
function wipeSave(){
  deleteSave();
  toast('存档已删除');
}
/* 全新一局：删掉旧档、从头开始 */
function newGame(){
  deleteSave();
  genMap(CONFIG.SEED);

/* === 8.主循环 === */
const FIXED_DT = 1 / CONFIG.TARGET_FPS;
let accumulator = 0;
let lastTime = performance.now();
let firstRenderDone = false;
const renderLog = {ground:false, objects:false, player:false, ui:false};
let animTime = 0, fps = 0, frameCount = 0, fpsTimer = 0, frameNo = 0, visibleCount = 0;
let renderMs = 0;                  /* 最近一帧的渲染耗时（毫秒，滑动平均） */

function update(dt){
  if(npcOpen) updateNpcDialog(dt);   /* 打字机属于 UI：对话打开时字照常一个个蹦出来 */
  if(sleepFx.phase !== 'none'){ updateSleepFx(dt); return; }  /* 睡觉/昏睡：接管整个更新 */
  if(startMenuOpen) return;           /* 标题界面：整个游戏冻结 */
  if(sysOpen) return;                 /* 系统菜单：整个游戏冻结 */
  if(paused) return;                 /* 暂停：时间/天气/角色/摄像机全部冻结 */
  if(npcOpen) return;                 /* NPC 对话：整个游戏冻结（时间停住） */
  if(packOpen) return;               /* 背包打开：同样整体冻结（时间停住） */
  if(shopOpen) return;               /* 商店打开：同样整体冻结（时间停住） */
  if(chestOpen) return;              /* 木箱打开：同样整体冻结（时间停住） */
  animTime += dt;
  updateClock(dt);                   /* 时间推进 */
  updateWeather(dt);                 /* 天气粒子 + 雨声 */
  if(fishingActive()){
    /* 钓鱼：人站定不动，只推进抛竿/咬钩/拉杆的状态机（面板打开时上面的分支已经提前返回 → 冻结） */
    updateFishing(dt);
    updateCamera(dt);
    updateSky(dt);
    updateDropFx(dt);
    return;
  }
  updatePlayer(dt);
  updateCamera(dt);
  updateSky(dt);                     /* 昼夜色平滑过渡 */
  updateDropFx(dt);                  /* 洒水器水滴 */
}
function render(){
  const _t0 = performance.now();
  ctx.imageSmoothingEnabled = false;
  /* 视锥裁剪：只绘制可见范围内的瓦片 */
  const x0 = Math.max(0, Math.floor(cam.x / TILE));
  const x1 = Math.min(MAP_W-1, Math.floor((cam.x + VIEW_W - 1) / TILE));
  const y0 = Math.max(0, Math.floor(cam.y / TILE));
  const y1 = Math.min(MAP_H-1, Math.floor((cam.y + VIEW_H - 1) / TILE));
  visibleCount = (x1-x0+1) * (y1-y0+1);

  if(!renderLog.ground){ renderLog.ground = true; console.log('[render] 1/4 drawGround'); }
  if(!renderLog.objects){ renderLog.objects = true; console.log('[render] 2/4 drawObjects'); }
  if(!renderLog.player){ renderLog.player = true; console.log('[render] 3/4 drawPlayer'); }
  if(!renderLog.ui){ renderLog.ui = true; console.log('[render] 4/4 drawUI'); }

  drawGround(ctx, x0, y0, x1, y1);
  drawRoads(ctx, x0, y0, x1, y1);          /* 石板路（叠加层，在地面之上、季节染色之下） */
  drawSeasonOverlay(ctx, x0, y0, x1, y1);
  drawGathers(ctx, x0, y0, x1, y1);        /* 野花 / 蘑菇 / 浆果（第 14 轮，长在草地上） */
  if(!CONFIG.PERF.Y_SORT){                 /* 关掉 Y 排序时走老路子：作物 / 物件各自一层 */
    drawCrops(ctx, x0, y0, x1, y1);
    drawObjects(ctx, x0, y0, x1, y1);
  }
  drawBuildPreview(ctx);                   /* 建造预览（半透明幽灵） */
  drawEntities(ctx, x0, y0, x1, y1);       /* 按 Y 排序：小屋 / 商店 / 作物 / 物件 / 建造物 / 玩家 */
  drawDropFx(ctx);                         /* 洒水器的小水滴 */
  drawWeather(ctx);
  drawAtmosphere(ctx);
  drawUI(ctx);
  drawFishing(ctx);              /* 钓鱼气泡 / 咬钩提示 / 拉杆横条（第 14 轮） */

  /* 网格线叠加 */
  if(CONFIG.GRID_OVERLAY){
    ctx.fillStyle = CONFIG.GRID_COLOR;
    for(let tx=x0;tx<=x1+1;tx++) ctx.fillRect(Math.round(tx*TILE - cam.x), 0, 1, VIEW_H);
    for(let ty=y0;ty<=y1+1;ty++) ctx.fillRect(0, Math.round(ty*TILE - cam.y), VIEW_W, 1);
  }
  if(!firstRenderDone){
    firstRenderDone = true;
    console.log('[render] 顺序确认: drawGround -> drawObjects -> drawPlayer -> drawUI');
  }
  drawSleepFx(ctx);              /* 睡觉淡入淡出（盖住网格线） */
  /* 渲染耗时（滑动平均，看优化效果） */
  renderMs = renderMs * 0.9 + (performance.now() - _t0) * 0.1;
}
function loop(now){
  let frameTime = (now - lastTime) / 1000;
  lastTime = now;
  if(frameTime < 0) frameTime = 0;
  if(frameTime > CONFIG.MAX_FRAME_TIME) frameTime = CONFIG.MAX_FRAME_TIME;

  accumulator += frameTime;
  let steps = 0;
  while(accumulator >= FIXED_DT && steps < CONFIG.MAX_STEPS){
    update(FIXED_DT);
    accumulator -= FIXED_DT;
    steps++;
  }
  if(steps === CONFIG.MAX_STEPS) accumulator = 0;

  render();

  frameCount++; frameNo++;
  fpsTimer += frameTime;
  if(fpsTimer >= CONFIG.FPS_INTERVAL){
    fps = frameCount / fpsTimer;
    frameCount = 0; fpsTimer = 0;
    updateStats();
  }
  if(CONFIG.LOG_EVERY > 0 && frameNo % CONFIG.LOG_EVERY === 0){
    console.log('[map] tiles drawn ' + visibleCount + ' / ' + (MAP_W*MAP_H) +
      ' (' + (visibleCount/(MAP_W*MAP_H)*100).toFixed(1) + '%)  player(' +
      player.x.toFixed(0) + ',' + player.y.toFixed(0) + ')  seed ' + CONFIG.SEED);
  }
  requestAnimationFrame(loop);
}

/* === 9.NPC系统 === */
/* 小镇上有三位居民：白天按各自的时刻表出现在固定点（到点就换地方，夜里回家消失）。
 * 走近 1.5 格按 E 说话：打字机逐字显示，E / 空格推进（没打完就整句显示，打完了就下一句）。
 * 好感度 0~100 分 4 档，升到「朋友」档立刻解锁各自的小福利；每人每天最多送一次礼。
 * 本轮新增的存档字段 npc（紧凑结构）；存档版本 v1 → v2 由 migrate() 负责无损升级。 */

/* --- 运行时状态（会被写进存档） --- */
const npcState = {
  aff:    {},   /* id → 好感度 0~100 */
  gift:   {},   /* id → 上次送礼时的天数（跨天自动失效 → 实现"每天一次"） */
  unlock: {},   /* id → 1 = 已经发过「朋友」档的解锁福利 */
  bonusDay: -1, /* 老板娘加购计数所属的天 */
  bonusUsed: 0  /* 老板娘当天已加购的件数 */
};
/* 把 NPC 状态复位（新游戏 / 读档前） */
function npcResetState(){
  npcState.aff = {}; npcState.gift = {}; npcState.unlock = {};
  npcState.bonusDay = -1; npcState.bonusUsed = 0;
  for(const d of CONFIG.NPC.LIST){
    npcState.aff[d.id] = 0;
    npcState.gift[d.id] = -1;
    npcState.unlock[d.id] = 0;
  }
}
npcResetState();

/* --- DOM（对话面板复用 .panel 样式） --- */
const npcEl      = document.getElementById('npc');
const npcMask    = document.getElementById('npcMask');
const npcIcon    = document.getElementById('npcIcon');
const npcName    = document.getElementById('npcName');
const npcTierEl  = document.getElementById('npcTier');
const npcAffEl   = document.getElementById('npcAff');
const npcBdayEl  = document.getElementById('npcBirthday');
const npcBarFill = document.getElementById('npcBarFill');
const npcTextEl  = document.getElementById('npcText');
const npcNextBtn = document.getElementById('npcNext');
const npcGiftBtn = document.getElementById('npcGift');
const npcByeBtn  = document.getElementById('npcBye');
const npcFootEl  = document.getElementById('npcFoot');
let npcOpen = false;              /* 对话是否打开（打开时世界时间冻结） */
let packMode = 'normal';          /* 背包模式：normal 正常 / gift 送礼选择 */
let giftTarget = null;            /* 送礼模式的目标 NPC id */
const npcDlg = {id:null, lines:[], idx:0, shown:0, typing:false};
let npcLastText = '';             /* 打字机：上一次写进 DOM 的文本（避免每帧重写） */

/* --- 基础查询 --- */
function npcDef(id){ for(const d of CONFIG.NPC.LIST) if(d.id === id) return d; return null; }
function npcAff(id){ return clamp(npcState.aff[id] | 0, 0, CONFIG.NPC.AFF_MAX); }
function npcTierOf(aff){
  let t = CONFIG.NPC.TIERS[0];
  for(const x of CONFIG.NPC.TIERS) if(aff >= x.min) t = x;
  return t;
}
function npcTierIdx(aff){ return CONFIG.NPC.TIERS.indexOf(npcTierOf(aff)); }
function npcTierName(id){ return npcTierOf(npcAff(id)).name; }
function npcUnlockTierIdx(){
  const i = CONFIG.NPC.TIERS.findIndex(t => t.key === CONFIG.NPC.UNLOCK_TIER);
  return i < 0 ? CONFIG.NPC.TIERS.length - 1 : i;
}
/* 时刻表：当前这个点在哪儿（null = 回家了，今天不见） */
function npcSpot(d){
  const h = skyHour();
  for(const s of d.sched) if(h >= s.from && h < s.to) return s;
  return null;
}
function npcPos(d){
  const s = npcSpot(d);
  if(!s) return null;
  return {x:(s.x + 0.5)*TILE, y:(s.y + 0.5)*TILE, tx:s.x, ty:s.y};
}
/* 玩家与 NPC 的距离（格） */
function npcDist(d){
  const p = npcPos(d);
  if(!p) return Infinity;
  return Math.hypot(p.x - player.x, p.y - player.y) / TILE;
}
/* 现在站在旁边的那个 NPC（没有就 null） */
function npcNear(){
  let best = null, bd = CONFIG.NPC.RANGE;
  for(const d of CONFIG.NPC.LIST){
    const dist = npcDist(d);
    if(dist <= bd){ bd = dist; best = d; }
  }
  return best;
}
/* 生日：每季一次（season + 季内第几天 → 一年里的第几天） */
function npcBdayAbs(d){
  const si = Math.max(0, CONFIG.SEASONS.indexOf(d.bday.season));
  return si * CONFIG.DAYS_PER_SEASON + (d.bday.day | 0);
}
function npcIsBirthday(d){
  const yearLen = CONFIG.SEASONS.length * CONFIG.DAYS_PER_SEASON;
  const dayInYear = ((clock.day - 1) % yearLen) + 1;
  return dayInYear === npcBdayAbs(d);
}
/* 今天是谁的生日（没有就 null） */
function npcBirthdayToday(){
  for(const d of CONFIG.NPC.LIST) if(npcIsBirthday(d)) return d;
  return null;
}
/* 每天的送礼上限：记录的是"送出去那天是第几天"，跨天自然失效 */
function npcGiftedToday(id){ return (npcState.gift[id] | 0) === clock.day; }

/* --- 对话 --- */
/* 按当前好感档位随机挑 2~3 句（不重复） */
function npcPickLines(d){
  const tier = npcTierOf(npcAff(d.id));
  const pool = (d.lines && d.lines[tier.key]) || (d.lines && d.lines.stranger) || ['……'];
  const n = Math.min(pool.length, 2 + ((Math.random()*2) | 0));
  const out = [], used = [];
  for(let i=0;i<n;i++){
    let k = (Math.random()*pool.length) | 0, guard = 0;
    while(used.indexOf(k) >= 0 && guard++ < 8) k = (Math.random()*pool.length) | 0;
    used.push(k);
    out.push(pool[k]);
  }
  return out;
}
function npcOpenDialog(d){
  if(!d || npcOpen) return false;
  /* 上次跨档时背包满了、福利没发出去的，再见面时补发（尤其是邻家女孩的稀有种子） */

function npcCloseDialog(){

/* E / 空格：没打完 → 整句显示；打完了 → 下一句；说完了 → 结束对话 */
function npcAdvance(){
  if(!npcOpen) return false;
  const t = npcDlg.lines[npcDlg.idx] || '';
  if(npcDlg.typing){
    npcDlg.shown = t.length; npcDlg.typing = false;
    renderNpcDialog();

  }
  if(npcDlg.idx < npcDlg.lines.length - 1){
    npcDlg.idx++; npcDlg.shown = 0; npcDlg.typing = true;
    renderNpcDialog();
    return true;
  }

  return true;
}
/* 打字机推进（UI 动画：对话打开时世界时间冻结，但字还在一个个蹦出来） */
function updateNpcDialog(dt){
  if(!npcOpen || !npcDlg.typing) return;
  const t = npcDlg.lines[npcDlg.idx] || '';
  npcDlg.shown += dt * 1000 / Math.max(1, CONFIG.NPC.TYPE_MS);
  if(npcDlg.shown >= t.length){
    npcDlg.shown = t.length;
    npcDlg.typing = false;
    renderNpcDialog();
  }else{
    npcUpdateText();
  }
}
/* 只更新正文（打字过程中每帧调用，避免整块 DOM 重刷） */
function npcUpdateText(){
  if(!npcTextEl) return;

/* --- 解锁特权：老木匠的建造折扣 --- */
function npcBuildDiscount(){ return npcState.unlock['carpenter'] ? CONFIG.NPC.CARPENTER_DISCOUNT : 1; }
/* 当前生效的建造材料价（老木匠打折后） */
function buildCost(r){
  const k = npcBuildDiscount();
  if(!r || k >= 1) return (r ? r.cost : {});
  const out = {};
  for(const id in r.cost) out[id] = Math.max(1, Math.floor(r.cost[id] * k));
  return out;
}

/* --- 存档（紧凑结构） --- */
function npcSerialize(){
  const aff = {}, gift = {}, unl = {};
  for(const d of CONFIG.NPC.LIST){
    aff[d.id]  = npcAff(d.id);
    gift[d.id] = (npcState.gift[d.id] | 0);
    unl[d.id]  = npcState.unlock[d.id] ? 1 : 0;
  }
  return {aff:aff, gift:gift, unl:unl, bd:npcState.bonusDay, bu:npcState.bonusUsed};
}
function npcDeserialize(o){
  npcResetState();
  if(!o || typeof o !== 'object') return false;
  for(const d of CONFIG.NPC.LIST){
    const a = o.aff ? o.aff[d.id] : undefined;
    if(typeof a === 'number') npcState.aff[d.id] = clamp(a | 0, 0, CONFIG.NPC.AFF_MAX);
    const g = o.gift ? o.gift[d.id] : undefined;
    if(typeof g === 'number') npcState.gift[d.id] = Math.max(0, g | 0);
    const u = o.unl ? o.unl[d.id] : undefined;
    if(u) npcState.unlock[d.id] = 1;
  }
  if(typeof o.bd === 'number') npcState.bonusDay = o.bd | 0;
  if(typeof o.bu === 'number') npcState.bonusUsed = Math.max(0, o.bu | 0);
  npcSyncUnlocks();
  return true;
}

/* --- 存档迁移：v1 → v2（第 13 轮新增 npc 字段） --- */
function migrate(oldSave){
  if(!oldSave || typeof oldSave !== 'object') return null;
  try{
    const d = JSON.parse(JSON.stringify(oldSave));   /* 复制一份，不动原对象 */
    const v = (typeof d.v === 'number') ? d.v : 1;
    if(v < 2){
      /* v1 → v2：补上 npc 字段（没有就当作"刚认识"，其余进度全部保留） */
      if(!d.npc || typeof d.npc !== 'object') d.npc = {aff:{}, gift:{}, unl:{}, bd:-1, bu:0};
    }
    if(v < 3){
      /* v2 → v3：补上图鉴字段（没有就当作"还没钓到过 / 采到过"） */
      if(!d.dex || typeof d.dex !== 'object') d.dex = {f:0, g:0};
    }
    d.v = CONFIG.SAVE.VERSION;
    return d;
  }catch(e){
    console.warn('[save] 存档迁移失败：', e);
    return null;
  }
}
/* 迁移 + 兜底：迁移失败不退化成"新游戏"，只降级成"仅保留核心数据" */
function migrateSave(raw){
  const d = migrate(raw);
  if(d) return {save:d, degraded:false};
  return {save:raw, degraded:true};
}

/* === 10.图鉴（第 14 轮） === */
/* 图鉴只存两个位掩码：fish 8 位、gather 3 位（紧凑、不会随游玩时长膨胀）。
 *   bit = 1 → 已经钓到 / 采到过；未解锁的格子画成剪影。 */
const dexState = {f:0, g:0};
function dexTotal(){ return CONFIG.FISHING.LIST.length + CONFIG.GATHER.TYPES.length; }
function dexPopcount(n){
  n = n | 0; let c = 0;
  while(n){ n &= n - 1; c++; }
  return c;
}
function dexCollected(){ return dexPopcount(dexState.f) + dexPopcount(dexState.g); }
function dexResetState(){ dexState.f = 0; dexState.g = 0; }
function dexAllEntries(){
  const out = [];
  for(let i=0;i<CONFIG.FISHING.LIST.length;i++){
    const f = CONFIG.FISHING.LIST[i];
    out.push({kind:'fish', idx:i, id:f.id, name:f.name, icon:f.icon});
  }
  for(let i=0;i<CONFIG.GATHER.TYPES.length;i++){
    const t = CONFIG.GATHER.TYPES[i], d = itemDef(t.item);
    out.push({kind:'gather', idx:i, id:t.item, name:d ? d.name : t.item, icon:d ? d.icon : '？'});
  }
  return out;
}
function dexHas(kind, idx){
  if(idx < 0 || idx > 31) return false;
  const bit = 1 << idx;
  return kind === 'fish' ? !!(dexState.f & bit) : !!(dexState.g & bit);
}
function dexUnlock(kind, idx){
  if(idx < 0 || idx > 31) return false;
  const bit = 1 << idx;
  if(kind === 'fish'){
    if(dexState.f & bit) return false;
    dexState.f = (dexState.f | bit) >>> 0;
  }else if(kind === 'gather'){
    if(dexState.g & bit) return false;
    dexState.g = (dexState.g | bit) >>> 0;
  }else return false;
  const e = dexAllEntries().find(x => x.kind === kind && x.idx === idx);
  toast('📖 图鉴新增：' + (e ? e.name : '？'));
  playSfx(1174, 'triangle', 0.12, CONFIG.AUDIO.VOLUME);
  return true;
}

/* === 11.钓鱼（第 14 轮） === */
/* 状态机：idle → wait（抛竿 1~4s）→ bite（0.8s 窗口）→ reel（拉杆）→ idle
 * 世界时间在钓鱼时照常走；打开背包/商店/对话时 update() 提前返回，钓鱼计时同步冻结。 */
const fishing = {
  state: 'idle',   /* idle / wait / bite / reel */
  t: 0,            /* 当前状态已经过的毫秒 */
  need: 0,         /* 本次抛竿要等多久（毫秒） */
  fish: null,      /* 咬钩的鱼定义（CONFIG.FISHING.LIST 元素） */
  zone: 0.5,       /* 绿区中心（0~1） */
  zoneW: 0.3,      /* 绿区宽度（0~1） */
  pointer: 0,      /* 指针位置（0~1） */
  dir: 1           /* 指针方向：1 向右 / -1 向左 */
};
function fishingActive(){ return fishing.state !== 'idle'; }
function fishDef(id){ return CONFIG.FISHING.LIST.find(f => f.id === id) || null; }
/* 站在水边（抛竿距离内有没有水格） */
function waterNearFishing(){
  const px = Math.floor(player.x/TILE), py = Math.floor(player.y/TILE);
  const R = Math.ceil(CONFIG.FISHING.WATER_RANGE);
  for(let ty=py-R; ty<=py+R; ty++) for(let tx=px-R; tx<=px+R; tx++){
    if(tx<0 || ty<0 || tx>=MAP_W || ty>=MAP_H) continue;
    if(map[ty*MAP_W+tx] !== T.WATER) continue;
    if(tileCenterDist(tx,ty) <= CONFIG.FISHING.WATER_RANGE) return true;
  }
  return false;
}
/* 24 小时制时段判定：from > to 表示跨午夜（18 → 2） */
function fishHourOK(f, h){
  return (f.from <= f.to) ? (h >= f.from && h < f.to) : (h >= f.from || h < f.to);
}
/* 当前季节 / 天气 / 时段下这条鱼咬不咬钩 */
function fishEligible(f){
  return f.seasons.indexOf(seasonName()) >= 0 &&
         f.weather.indexOf(weather.id) >= 0 &&
         fishHourOK(f, skyHour());
}
function fishCandidates(){ return CONFIG.FISHING.LIST.filter(fishEligible); }
/* 按稀有度加权：稀有度越高越难咬钩（TYPE_CHANCE^(rarity-1)） */
function fishPickWeighted(list){
  let total = 0;
  for(const f of list) total += Math.pow(CONFIG.FISHING.TYPE_CHANCE, f.rarity - 1);
  let r = Math.random() * total;
  for(const f of list){
    r -= Math.pow(CONFIG.FISHING.TYPE_CHANCE, f.rarity - 1);
    if(r <= 0) return f;
  }
  return list[list.length - 1];
}
/* 抛竿 */
function startFishing(){
  if(fishingActive()) return false;
  const slot = selectedSlot();
  if(!slot || slot.id !== CONFIG.FISHING.ROD_ID){ toast('先选中鱼竿再抛竿'); return false; }
  if(!waterNearFishing()){
    toast('要站在水边才能抛竿');
    playSfx(120, 'sawtooth', 0.10, CONFIG.AUDIO.VOLUME * 0.6);
    return false;
  }
  if(!CONFIG.FISHING.LIST.some(f => canFit(f.id, 1))){
    toast('背包满了，装不下鱼');
    playSfx(120, 'sawtooth', 0.10, CONFIG.AUDIO.VOLUME * 0.6);
    return false;
  }
  fishing.state = 'wait'; fishing.t = 0; fishing.fish = null;
  const F = CONFIG.FISHING;
  fishing.need = F.WAIT_MIN_MS + Math.random() * Math.max(0, F.WAIT_MAX_MS - F.WAIT_MIN_MS);
  toast('抛竿了，等鱼儿上钩…');
  playSfx(440, 'sine', 0.12, CONFIG.AUDIO.VOLUME);
  return true;
}
/* 收竿（silent=true 不弹提示，用于睡觉 / 读档等被动打断） */
function cancelFishing(silent){
  if(!fishingActive()) return false;
  fishing.state = 'idle'; fishing.fish = null; fishing.t = 0;
  if(!silent) toast('收竿了');
  return true;
}
/* 跑鱼：扣 1 体力（体力为 0 时不会变负） */
function fishingEscape(reason){
  const cost = Math.max(0, CONFIG.FISHING.FAIL_STAMINA_COST | 0);
  const lost = Math.min(cost, Math.max(0, stamina));
  if(lost > 0) stamina -= lost;
  fishing.state = 'idle'; fishing.fish = null; fishing.t = 0;
  toast(reason + (lost > 0 ? '（体力 -' + lost + '）' : ''));
  playSfx(140, 'sawtooth', 0.12, CONFIG.AUDIO.VOLUME * 0.7);
  return false;
}
/* 咬钩窗口内按下 → 进入拉杆 */
function fishingStartReel(){
  const f = fishing.fish;
  if(!f) return false;
  const R = CONFIG.FISHING.REEL;
  fishing.zoneW = Math.max(R.ZONE_MIN, R.ZONE_BASE - (f.rarity - 1) * R.ZONE_STEP);
  const half = fishing.zoneW / 2;
  fishing.zone = half + Math.random() * Math.max(0, 1 - fishing.zoneW);
  fishing.pointer = Math.random() < 0.5 ? 0 : 1;
  fishing.dir = fishing.pointer <= 0 ? 1 : -1;
  fishing.state = 'reel'; fishing.t = 0;
  toast('拉杆！左键 / 空格 让指针停在绿区');
  playSfx(659, 'square', 0.08, CONFIG.AUDIO.VOLUME);
  return true;
}
/* 拉杆判定：指针落在绿区 → 得鱼 */
function fishingResolveReel(){
  const f = fishing.fish;
  if(!f) { fishing.state = 'idle'; return false; }
  const ok = Math.abs(fishing.pointer - fishing.zone) <= fishing.zoneW / 2;
  if(!ok) return fishingEscape('鱼挣脱了，跑掉了');
  if(!canFit(f.id, 1)){
    fishing.state = 'idle'; fishing.fish = null;
    toast('背包满了，鱼滑回了水里');
    return false;
  }
  addItem(f.id, 1);
  const idx = CONFIG.FISHING.LIST.indexOf(f);
  dexUnlock('fish', idx);
  toast('🎣 钓到了 ' + f.name + '！（稀有度 ' + f.rarity + '）');
  playSfx(1046, 'triangle', 0.16, CONFIG.AUDIO.VOLUME);
  fishing.state = 'idle'; fishing.fish = null; fishing.t = 0;
  return true;
}
/* 钓鱼中按左键 / 空格 */
function fishingPress(){
  if(fishing.state === 'wait'){ return cancelFishing(false); }
  if(fishing.state === 'bite'){ return fishingStartReel(); }
  if(fishing.state === 'reel'){ return fishingResolveReel(); }
  return false;
}
/* 每帧推进（只在没有面板/睡觉/暂停时调用 → 面板打开时自动冻结） */
function updateFishing(dt){
  if(fishing.state === 'wait'){
    fishing.t += dt * 1000;
    if(fishing.t >= fishing.need){
      const list = fishCandidates();
      if(!list.length){
        fishing.state = 'idle'; fishing.t = 0;
        toast('水面很安静，这个时节没有鱼咬钩');
        return;
      }
      fishing.fish = fishPickWeighted(list);
      fishing.state = 'bite'; fishing.t = 0;
      toast('咬钩了！左键收杆');
      playSfx(988, 'square', 0.10, CONFIG.AUDIO.VOLUME);
      setTimeout(()=>playSfx(1319, 'square', 0.10, CONFIG.AUDIO.VOLUME), 90);
    }
  }else if(fishing.state === 'bite'){
    fishing.t += dt * 1000;
    if(fishing.t >= CONFIG.FISHING.BITE_WINDOW_MS) fishingEscape('没来得及收杆，鱼跑掉了');
  }else if(fishing.state === 'reel'){
    const sp = CONFIG.FISHING.REEL.SPEED;
    fishing.pointer += fishing.dir * sp * dt;
    if(fishing.pointer >= 1){ fishing.pointer = 2 - fishing.pointer; fishing.dir = -1; }
    else if(fishing.pointer <= 0){ fishing.pointer = -fishing.pointer; fishing.dir = 1; }
  }
}
/* 钓鱼 UI：等待气泡 / 咬钩提示 / 拉杆横条 */
function drawFishing(g){
  if(!fishingActive()) return;
  const px = Math.round(player.x - cam.x), py = Math.round(player.y - cam.y);
  if(fishing.state === 'wait' || fishing.state === 'bite'){
    const isBite = fishing.state === 'bite';
    const text = isBite ? '❗ 咬钩了！左键收杆' : '🎣 等待咬钩…';
    g.font = '13px ' + FONT_CJK;
    const w = g.measureText(text).width;
    const bx = Math.round(px - w/2 - 8), by = py - 58;
    g.fillStyle = isBite ? 'rgba(60,12,12,.90)' : 'rgba(8,10,16,.82)';
    g.fillRect(bx, by, w + 16, 22);
    g.strokeStyle = isBite ? '#ff9a6a' : CONFIG.COLORS.hudBorder;
    g.strokeRect(bx + 0.5, by + 0.5, w + 15, 21);
    g.fillStyle = isBite ? '#ffd76a' : CONFIG.COLORS.hudText;
    g.textAlign = 'left'; g.textBaseline = 'top';
    g.fillText(text, bx + 8, by + 4);
    if(isBite){
      /* 剩余窗口条：越短越紧 */
      const k = clamp(1 - fishing.t / CONFIG.FISHING.BITE_WINDOW_MS, 0, 1);
      g.fillStyle = '#3a1a12'; g.fillRect(bx, by + 24, w + 16, 4);
      g.fillStyle = '#ff6a4a'; g.fillRect(bx, by + 24, (w + 16) * k, 4);
    }
    return;
  }
  if(fishing.state !== 'reel') return;
  const R = CONFIG.FISHING.REEL;
  const W = R.BAR_W, H = R.BAR_H;
  const x = Math.round((VIEW_W - W) / 2), y = Math.round(VIEW_H * 0.60);
  /* 横条：深色底 + 绿色区 + 指针 */
  g.fillStyle = 'rgba(8,10,16,.90)';
  g.fillRect(x - 4, y - 4, W + 8, H + 8);
  g.fillStyle = '#1a2130'; g.fillRect(x, y, W, H);
  const zx = x + (fishing.zone - fishing.zoneW / 2) * W;
  g.fillStyle = 'rgba(80,190,90,.85)';
  g.fillRect(Math.round(zx), y + 1, Math.round(fishing.zoneW * W), H - 2);
  g.fillStyle = '#7fe08a';
  g.fillRect(Math.round(zx), y + 1, Math.round(fishing.zoneW * W), 2);
  const pxp = Math.round(x + fishing.pointer * W);
  g.fillStyle = '#ffd76a';
  g.fillRect(pxp - 2, y - 3, 4, H + 6);
  g.fillStyle = '#fff2c0';
  g.fillRect(pxp - 1, y - 3, 2, H + 6);
  g.strokeStyle = CONFIG.COLORS.hudBorder;
  g.strokeRect(x - 4.5, y - 4.5, W + 9, H + 9);
  /* 文案：鱼名 / 稀有度 / 操作 */
  const f = fishing.fish;
  g.textAlign = 'center'; g.textBaseline = 'top';
  g.font = '14px ' + FONT_CJK;
  g.fillStyle = '#ffd76a';
  g.fillText((f ? f.icon + ' ' + f.name : '') + '　稀有度 ' + (f ? f.rarity : '?'), VIEW_W/2, y - 30);
  g.font = '12px ' + FONT_CJK;
  g.fillStyle = CONFIG.COLORS.hudText;
  g.fillText('左键 / 空格：让指针停在绿色区间内', VIEW_W/2, y + H + 10);
  g.textAlign = 'left';
}

/* === 12.野外采集（第 14 轮） === */
/* 采集物是地图上的新地块类型（11/12/13）：长在草地上、不挡路，按 E 采走。
 * 刷新写进 map diff，存档后仍然存在；每季第 1/4/7/10 天清掉旧的、重新刷 6 株。 */
const GATHER_ITEM_BY_TILE = {};
for(const t of CONFIG.GATHER.TYPES) GATHER_ITEM_BY_TILE[t.tile] = t.item;
function isGatherTile(t){ return !!GATHER_ITEM_BY_TILE[t]; }
/* 近处可采集的那一株（取最近） */
function gatherNear(){
  const px = Math.floor(player.x/TILE), py = Math.floor(player.y/TILE);
  const R = Math.ceil(CONFIG.GATHER.RANGE);
  let best = null, bd = CONFIG.GATHER.RANGE;
  for(let ty=py-R; ty<=py+R; ty++) for(let tx=px-R; tx<=px+R; tx++){
    if(tx<0 || ty<0 || tx>=MAP_W || ty>=MAP_H) continue;
    const item = GATHER_ITEM_BY_TILE[map[ty*MAP_W+tx]];
    if(!item) continue;
    const d = tileCenterDist(tx,ty);
    if(d <= bd){ bd = d; best = {tx:tx, ty:ty, item:item, def:itemDef(item)}; }
  }
  return best;
}
/* 采一株：进背包 + 点图鉴 + 地块恢复成草地 */
function pickGather(tx, ty){
  if(tx<0 || ty<0 || tx>=MAP_W || ty>=MAP_H) return false;
  const i = ty*MAP_W + tx;
  const item = GATHER_ITEM_BY_TILE[map[i]];
  if(!item) return false;
  if(tileCenterDist(tx,ty) > CONFIG.GATHER.RANGE){ toast('走近一点再采'); return false; }
  const d = itemDef(item);
  if(!canFit(item, 1)){ toast('背包满了，装不下' + (d ? d.name : '采集物')); return false; }
  addItem(item, 1);
  setTile(i, T.GRASS);
  const idx = CONFIG.GATHER.TYPES.findIndex(t => t.item === item);
  dexUnlock('gather', idx);
  toast('采到了 ' + (d ? d.name : item) + ' ×1');
  playSfx(659, 'triangle', 0.12, CONFIG.AUDIO.VOLUME);
  return true;
}
/* 清掉地图上旧的采集物（恢复成草地；如果原本就是草地，diff 会自动消失） */
function clearGatherTiles(){
  let n = 0;
  for(let i=0;i<map.length;i++){
    if(isGatherTile(map[i])){ setTile(i, T.GRASS); n++; }
  }
  return n;
}
/* 在农田周围半径内找干净草地刷采集物；避开作物 / 建造物 / 石板路 / 玩家 / 建筑与 NPC */
function spawnGather(quiet){
  if(!CONFIG.GATHER.ENABLED) return 0;
  const season = seasonName();
  const types = CONFIG.GATHER.TYPES.filter(t => t.seasons.indexOf(season) >= 0);
  if(!types.length){ clearGatherTiles(); return 0; }
  clearGatherTiles();
  const G = CONFIG.GATHER;
  const cx = FARM.x + FARM.w / 2, cy = FARM.y + FARM.h / 2;
  let placed = 0;
  for(let attempt=0; attempt<900 && placed<G.COUNT; attempt++){
    const tx = Math.round(cx + (Math.random()*2 - 1) * G.RADIUS);
    const ty = Math.round(cy + (Math.random()*2 - 1) * G.RADIUS);
    if(tx < 1 || ty < 1 || tx >= MAP_W-1 || ty >= MAP_H-1) continue;
    const i = ty*MAP_W + tx;
    if(map[i] !== T.GRASS) continue;                 /* 只长在草地上 */
    if(crops[i]) continue;                           /* 不和作物冲突 */
    if(buildIndex[i] >= 0 || roads[i]) continue;     /* 不和建造物 / 石板路冲突 */
    if(tileCenterDist(tx,ty) < 3) continue;          /* 不要刷在玩家脚下 */
    /* 避开小屋 / 商店 / 各个 NPC 的定点，免得 E 键互相打架 */
    const inRect = (r, x, y) => x >= r.x-1 && x <= r.x+r.w && y >= r.y-1 && y <= r.y+r.h;
    let blocked = inRect(HOUSE_POS, tx, ty) || inRect(SHOP_POS, tx, ty);
    if(!blocked){
      for(const d of CONFIG.NPC.LIST){
        for(const s of d.sched){
          if(Math.abs(s.x - tx) <= 2 && Math.abs(s.y - ty) <= 2){ blocked = true; break; }
        }
        if(blocked) break;
      }
    }
    if(blocked) continue;
    const tp = types[(Math.random() * types.length) | 0];
    setTile(i, tp.tile);
    placed++;
  }
  if(placed && sessionActive && !quiet) toast('草地上长出了新的采集物');
  return placed;
}
/* 新的一天：季内第 1/4/7/10 天刷新一次 */
function gatherDayStart(){
  const seasonDay = ((clock.day - 1) % CONFIG.DAYS_PER_SEASON) + 1;
  if(seasonDay % Math.max(1, CONFIG.GATHER.EVERY_DAYS) === 1) return spawnGather();
  return 0;
}
/* 采集物绘制（不参与 Y 排序，画在实体之前） */
function drawGathers(g, x0, y0, x1, y1){
  g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  for(let ty=y0; ty<=y1; ty++){
    for(let tx=x0; tx<=x1; tx++){
      const item = GATHER_ITEM_BY_TILE[map[ty*MAP_W+tx]];
      if(!item) continue;
      const d = itemDef(item);
      const x = tx*TILE - cam.x, y = ty*TILE - cam.y;
      g.fillStyle = 'rgba(0,0,0,.18)';
      g.fillRect(x + 10, y + 24, 12, 3);
      g.font = '17px ' + FONT_EMOJI;
      g.fillStyle = '#fff';
      g.fillText(d ? d.icon : '？', x + TILE/2, y + 24);
    }
  }
  g.textAlign = 'left'; g.textBaseline = 'top';
}
