/* --- 4.玩家 --- */
/* 站立帧（正面朝下）；第 18~22 行是腿部，走路帧替换为 LEGS_* */
const SPRITE_BASE = [
  '.....hhhhhh.....','....hhhhhhhh....','...hhhhhhhhhh...',
  '...hh......hh...','...hh......hh...','...ssssssssss...',
  '...ssssssssss...','...ss.ee..ee.ss.','...ssssssssss...',
  '....ssssssss....','.....ssssss.....','....bbbbbbbb....',
  '...bbbbbbbbbb...','..bbbbbbbbbbbb..','..bbbbbbbbbbbb..',
  '..sbbbbbbbbbbs..','..sbbbbbbbbbbs..','...bbbbbbbbbb...',
  '....pppppppp....','....pp....pp....','....pp....pp....',
  '....ss....ss....','....ss....ss....','................'
];
/* 正面走路：一腿迈出 */
const LEGS_FRONT = [
  '....pppppppp....','...ppp.....pp...','...pp...........',
  '...ss...........','................'
];
/* 侧面走路：一腿在前、一腿在后 */
const LEGS_SIDE = [
  '....pppppppp....','..ppp......pp...','..pp........pp..',
  '..ss........ss..','................'
];
const SPRITE_PALETTE = {
  h:CONFIG.COLORS.hair, s:CONFIG.COLORS.skin, e:CONFIG.COLORS.eye,
  b:CONFIG.COLORS.shirt, p:CONFIG.COLORS.pants, d:CONFIG.COLORS.shoe
};
/* 朝向：0=下 1=左 2=右 3=上 */
const DIR_NAMES = ['下','左','右','上'];
function eyeRow(dir){
  const r = new Array(CONFIG.PLAYER.BODY_W).fill('.');
  for(let c=3;c<=12;c++) r[c] = 's';
  if(dir === 0){ r[6]='e'; r[7]='e'; r[10]='e'; r[11]='e'; }
  else if(dir === 1){ r[5]='e'; r[6]='e'; }
  else if(dir === 2){ r[9]='e'; r[10]='e'; }
  return r;
}
/* 程序化生成 4 方向 × 2 帧 */
function buildFrames(){
  const frames = [];
  for(let dir=0; dir<4; dir++){
    frames[dir] = [];
    for(let step=0; step<2; step++){
      const rows = SPRITE_BASE.map(r=>r.split(''));
      if(step === 1){
        const legs = (dir===1 || dir===2) ? LEGS_SIDE : LEGS_FRONT;
        for(let i=0;i<legs.length;i++) rows[18+i] = legs[i].split('');
      }
      if(dir === 3){                       /* 背面：后脑勺，无五官 */
        rows[5] = '...hhhhhhhhhh...'.split('');
        rows[6] = '...hhhhhhhhhh...'.split('');
        rows[7] = '...hhhhhhhhhh...'.split('');
        rows[8] = '...hhhhhhhhhh...'.split('');
      } else {
        rows[7] = eyeRow(dir);
      }
      frames[dir][step] = rows;
    }
  }
  return frames;
}
const FRAMES = buildFrames();

const player = {
  x: SPAWN.x*TILE + TILE/2, y: SPAWN.y*TILE + TILE/2,   /* 精灵中心（浮点） */
  vx: 0, vy: 0,                                          /* 速度 */
  dir: 0,                                                /* 朝向 0=下 1=左 2=右 3=上 */
  animT: 0, frame: 0,                                    /* 动画：帧号 + 计时 */
  moving: false
};
function drawPlayer(g){
  const s = CONFIG.PLAYER.BODY_W, h = CONFIG.PLAYER.BODY_H;
  const rows = FRAMES[player.dir][player.frame];
  const ox = Math.round(player.x - cam.x - s/2);
  const oy = Math.round(player.y - cam.y - h/2);
  /* 影子 */
  g.fillStyle = CONFIG.COLORS.shadow;
  g.fillRect(ox + 2, oy + h - 2, s - 4, 2);
  /* 逐行合并同色段后 fillRect */
  for(let r=0;r<h;r++){
    const row = rows[r] || [];
    let c = 0;
    while(c < s){
      const ch = row[c];
      if(!ch || ch === '.'){ c++; continue; }
      let run = 1;
      while(c + run < s && row[c+run] === ch) run++;
      g.fillStyle = SPRITE_PALETTE[ch] || CONFIG.COLORS.skin;
      g.fillRect(ox + c, oy + r, run, 1);
      c += run;
    }
  }
}

/* === 4.背包系统 === */
/* 背包 24 格：inv[i] = null 或 {id, n}
 *   id = CONFIG.ITEMS 的键，n = 数量
 * 快捷栏 = 背包前 CONFIG.INVENTORY.HOTBAR 格（联动方案，不另开数组）
 *   → 快捷栏第 i 格永远就是背包第 i 格，拖动物品会立刻反映到快捷栏
 * 金币（currency）单独存数字 gold，不占格
 * 三个核心 API：addItem / removeItem / countItem（+ canFit 预判能否放下） */
let inv = new Array(CONFIG.INVENTORY.SLOTS).fill(null);
let gold = CONFIG.INIT_GOLD;
let hotSel = 0;                       /* 快捷栏当前选中格（0~7） */
let canLevel = 0;                     /* 水壶扩容等级：容量 = 20 + 等级×10 */
let goldPulseAt = 0;                  /* 金币跳动动画起点（performance.now()） */
let goldDelta = 0;                    /* 最近一次金币变动（用于飘字） */

/* 当前水壶容量（商店扩容后变大） */
function canCapacity(){
  return Math.min(CONFIG.WATER_CAN.MAX_CAPACITY,
                  CONFIG.WATER_CAN.CAPACITY + canLevel * CONFIG.WATER_CAN.UPGRADE_STEP);
}

function itemDef(id){ return CONFIG.ITEMS[id] || null; }
function stackLimit(id){
  const d = itemDef(id);
  return d ? (d.max || CONFIG.INVENTORY.STACK_MAX) : 1;
}
function invUsed(){ let n = 0; for(const s of inv) if(s) n++; return n; }
function invFree(){ return CONFIG.INVENTORY.SLOTS - invUsed(); }

/* 统计背包里某物品的数量（金币走数字） */
function countItem(id){
  if(id === 'gold') return gold;
  let n = 0;
  for(const s of inv) if(s && s.id === id) n += s.n;
  return n;
}
/* 背包里某物品占了几格 */
function countSlots(id){
  let n = 0;
  for(const s of inv) if(s && s.id === id) n++;
  return n;
}
/* 能不能放下 n 个（只判断，不改动背包） */
function canFit(id, n){
  if(n <= 0) return true;
  if(id === 'gold') return true;              /* 金币不占格 */
  const d = itemDef(id);
  if(!d) return false;
  if(!d.stack) return invFree() >= n;         /* 不可堆叠 → 每件独占一格 */
  const lim = stackLimit(id);
  let room = 0;
  for(const s of inv){
    if(!s) room += lim;                       /* 空格子 */
    else if(s.id === id) room += Math.max(0, lim - s.n);   /* 还能往这堆里塞多少 */
  }
  return room >= n;
}
/* 放入 n 个：先并进已有的堆，再填空位；返回实际放入的数量 */
function addItem(id, n){
  if(n <= 0) return 0;
  if(id === 'gold'){ gold += n; return n; }
  const d = itemDef(id);
  if(!d) return 0;
  const lim = stackLimit(id);
  let left = n;
  if(d.stack){
    for(let i=0;i<inv.length && left>0;i++){
      const s = inv[i];
      if(s && s.id === id && s.n < lim){
        const take = Math.min(lim - s.n, left);
        s.n += take; left -= take;
      }
    }
  }
  for(let i=0;i<inv.length && left>0;i++){
    if(inv[i]) continue;
    const take = d.stack ? Math.min(lim, left) : 1;
    inv[i] = {id:id, n:take};
    left -= take;
  }
  return n - left;
}
/* 取出 n 个：数量不够就一个都不动（返回 false） */
function removeItem(id, n){
  if(n <= 0) return true;
  if(id === 'gold'){ if(gold < n) return false; gold -= n; return true; }
  if(countItem(id) < n) return false;
  let left = n;
  for(let i=0;i<inv.length && left>0;i++){
    const s = inv[i];
    if(!s || s.id !== id) continue;
    const take = Math.min(s.n, left);
    s.n -= take; left -= take;
    if(s.n <= 0) inv[i] = null;
  }
  return true;
}
/* 金币：单独存数字 */
function addGold(n){ gold += n; return gold; }
function spendGold(n){ if(gold < n) return false; gold -= n; return true; }

/* --- 快捷栏（= 背包前 8 格） --- */
function selectHot(i){
  if(i >= 0 && i < CONFIG.INVENTORY.HOTBAR){ hotSel = i; return true; }
  return false;
}
function selectedSlot(){ return inv[hotSel] || null; }
function selectedItem(){ const s = selectedSlot(); return s ? itemDef(s.id) : null; }

/* 初始物品 */
function initInventory(){
  inv = new Array(CONFIG.INVENTORY.SLOTS).fill(null);
  gold = CONFIG.INIT_GOLD;
  hotSel = 0;
  canLevel = 0;
  for(const e of CONFIG.INVENTORY.START_LOADOUT) addItem(e.id, e.n);
}
/* 商店给的东西：可堆叠的先并堆；工具（不可堆叠）优先塞进快捷栏的空位并自动选中，买完就能用 */
function giveItem(id, n){
  const d = itemDef(id);
  if(d && d.stack) return addItem(id, n);
  for(let i=0;i<CONFIG.INVENTORY.HOTBAR;i++){
    if(!inv[i]){ inv[i] = {id:id, n:1}; hotSel = i; refreshPackGrid(); return 1; }
  }
  return addItem(id, n);
}

/* === 5.系统 === */
/* --- 建造系统：栅栏 / 木箱 / 石板路 / 洒水器 ---
 * 建造物有两种存法：
 *   叠加层（石板路）→ roads[格] = 1，不动 map，下面的耕地照旧能用
 *   实体（栅栏/木箱/洒水器）→ buildings 数组 + buildIndex 索引（格 → 下标）
 * 建造模式：B 进入；Q/E 或滚轮换配方；左键放置（扣材料）；右键拆除（返还 50%） */
let buildings = [];                                    /* {type, tx, ty, slots?} */
let buildIndex = new Int32Array(MAP_W*MAP_H).fill(-1); /* 格 → buildings 下标（-1 = 没有） */
let roads = new Uint8Array(MAP_W*MAP_H);              /* 石板路叠加层 */
let buildMode = false;                                 /* 建造模式开关 */
let buildSel  = 0;                                     /* 当前选中的配方下标 */
let dropFx = [];                                       /* 洒水器水滴粒子（世界坐标） */

/* 配方 */
function buildRecipes(){ return CONFIG.BUILD.RECIPES; }
function buildRecipe(id){ return CONFIG.BUILD.RECIPES.find(r => r.id === id) || null; }
function curRecipe(){ return CONFIG.BUILD.RECIPES[buildSel] || CONFIG.BUILD.RECIPES[0]; }
/* 材料够不够 */
function canAfford(r){
  if(!r) return false;
  for(const id in r.cost) if(countItem(id) < r.cost[id]) return false;
  return true;
}
/* 第一个缺的材料 id（够则 null） */
function missingMat(r){
  if(!r) return null;
  for(const id in r.cost) if(countItem(id) < r.cost[id]) return id;
  return null;
}
/* 这个格子能不能放这个建造物（返回空串 = 可以） */
function buildGroundOK(tx,ty,r){
  if(tx < 0 || ty < 0 || tx >= MAP_W || ty >= MAP_H) return '超出地图';
  const i = ty*MAP_W + tx, t = map[i];
  if(t === T.WATER) return '水里不能建';
  if(t === T.TREE || t === T.ROCK || t === T.HOUSE || t === T.SHOP) return '这里已经有东西了';
  if(r.overlay) return '';            /* 石板路是叠加层：耕地 / 作物上都铺 */
  if(t === T.TILLED || t === T.WATERED) return '耕地不能建';
  if(crops[i]) return '这里种着东西';
  if(buildIndex[i] >= 0) return '这里已经有东西了';
  return '';
}
/* 够不够得着（建造距离） */
function buildRangeOK(tx,ty){ return tileCenterDist(tx,ty) <= CONFIG.BUILD.RANGE; }
/* 预览：能不能放（ok=false 时 reason 说明原因） */
function buildPreview(tx,ty,r){
  r = r || curRecipe();
  if(!r) return {ok:false, reason:'没有可建造的东西'};
  if(!buildRangeOK(tx,ty)) return {ok:false, reason:'太远了，走近一点'};
  const g = buildGroundOK(tx,ty,r);
  if(g) return {ok:false, reason:g};
  const miss = missingMat(r);
  if(miss) return {ok:false, reason:'材料不足（还差' + itemDef(miss).name + '）'};
  return {ok:true, reason:''};
}
/* 放置 */
function placeBuilding(tx,ty){
  const r = curRecipe();
  const p = buildPreview(tx,ty,r);
  if(!p.ok){
    toast(p.reason);
    playSfx(120, 'sawtooth', 0.10, CONFIG.AUDIO.VOLUME * 0.6);
    return false;
  }
  for(const id in r.cost) removeItem(id, r.cost[id]);
  if(r.overlay){
    roads[ty*MAP_W+tx] = 1;
  }else{
    const b = {type:r.id, tx:tx, ty:ty};
    if(r.id === 'chest') b.slots = new Array(CONFIG.BUILD.CHEST_SLOTS).fill(null);
    buildings.push(b);
    buildIndex[ty*MAP_W+tx] = buildings.length - 1;
  }
  toast('造好了' + r.name);
  playSfx(660, 'square', 0.12, CONFIG.AUDIO.VOLUME);
  return true;
}
/* 拆除（返还 50% 材料） */
function demolishAt(tx,ty){
  if(tx < 0 || ty < 0 || tx >= MAP_W || ty >= MAP_H) return false;
  const i = ty*MAP_W + tx;
  /* 石板路是叠加层，单独拆 */
  if(roads[i]){
    roads[i] = 0;
    const back = Math.floor(buildRecipe('path').cost.stone * CONFIG.BUILD.REFUND);
    if(back > 0) addItem('stone', back);
    toast('拆掉了石板路（返还石材×' + back + '）');
    playSfx(220, 'sawtooth', 0.10, CONFIG.AUDIO.VOLUME * 0.6);
    return true;
  }
  const bi = buildIndex[i];
  if(bi < 0){
    toast('这里没有可以拆的东西');
    playSfx(120, 'sawtooth', 0.10, CONFIG.AUDIO.VOLUME * 0.6);
    return false;
  }
  const b = buildings[bi], r = buildRecipe(b.type);
  if(b.type === 'chest' && b.slots && b.slots.some(s => s)){
    toast('木箱里有东西，先清空再拆');
    playSfx(120, 'sawtooth', 0.10, CONFIG.AUDIO.VOLUME * 0.6);
    return false;
  }
  let back = '';
  for(const id in r.cost){
    const n = Math.floor(r.cost[id] * CONFIG.BUILD.REFUND);
    if(n > 0){ addItem(id, n); back += itemDef(id).name + '×' + n + ' '; }
  }
  buildings.splice(bi, 1);
  buildIndex.fill(-1);                     /* 重建索引（下标会整体前移） */
  for(let k=0; k<buildings.length; k++) buildIndex[buildings[k].ty*MAP_W + buildings[k].tx] = k;
  toast('拆掉了' + r.name + (back ? '（返还 ' + back.trim() + '）' : ''));
  playSfx(220, 'sawtooth', 0.10, CONFIG.AUDIO.VOLUME * 0.6);
  return true;
}
/* 这一格上有什么建造物 */
function buildingAt(tx,ty){
  if(tx < 0 || ty < 0 || tx >= MAP_W || ty >= MAP_H) return null;
  const bi = buildIndex[ty*MAP_W+tx];
  return bi >= 0 ? buildings[bi] : null;
}
/* 进入 / 退出建造模式 */
function toggleBuild(on){
  const want = (on === undefined) ? !buildMode : !!on;
  if(want === buildMode) return;
  buildMode = want;
  if(buildMode){
    if(packOpen) togglePack(false);
    if(shopOpen) toggleShop(false);
    if(chestOpen) toggleChest(false);
    toast('建造模式：Q/E 换配方 · 左键放置 · 右键拆除 · B 退出');
  }
  playSfx(520, 'square', 0.08, CONFIG.AUDIO.VOLUME);
}
/* 换配方（dir = +1 下一个 / -1 上一个） */
function cycleBuild(dir){
  const n = CONFIG.BUILD.RECIPES.length;
  if(!n) return;
  buildSel = (buildSel + (dir >= 0 ? 1 : -1) + n) % n;
  const r = curRecipe();
  toast('选中：' + r.name + '（' + costText(r) + '）');
}
/* 配方的材料文字：木材×3 石材×5 */
function costText(r){
  let s = '';
  for(const id in r.cost) s += itemDef(id).name + '×' + r.cost[id] + ' ';
  return s.trim();
}
/* 石板路：脚下那一格是不是路 */
function roadUnderPlayer(){
  const tx = Math.floor(player.x / TILE);
  const ty = Math.floor((player.y + BOX_OFF_Y + CONFIG.PLAYER.BOX_H/2) / TILE);
  if(tx < 0 || ty < 0 || tx >= MAP_W || ty >= MAP_H) return false;
  return roads[ty*MAP_W+tx] === 1;
}

/* --- 体力：干活消耗，睡觉恢复；为 0 时干不了活 --- */
let stamina = CONFIG.STAMINA.MAX;      /* 当前体力（可为小数：奔跑按秒扣） */
let staminaMax = CONFIG.STAMINA.MAX;   /* 当前体力上限（昏睡后会被扣 20%） */
/* 某个动作消耗多少体力 */
function staminaCost(id){ return CONFIG.STAMINA.TOOL_COST[id] || 0; }
/* 扣体力：体力为 0 时任何消耗体力的动作都做不了 */
function payStamina(cost){
  if(cost <= 0) return true;
  if(stamina <= 0){
    toast('体力不足');
    playSfx(120, 'sawtooth', 0.10, CONFIG.AUDIO.VOLUME * 0.6);
    return false;
  }
  stamina = Math.max(0, stamina - cost);
  return true;
}
/* 体力耗尽时的视觉暗角强度（0~1，画暗角用） */
function exhaustedGlow(){
  if(stamina > 0) return 0;
  const t = performance.now() / 1000;
  return 0.55 + 0.45 * Math.sin(t * 3.2);      /* 缓慢呼吸感的红晕 */
}

/* --- 碰撞 --- */
function isSolid(tx,ty){
  if(tx<0 || ty<0 || tx>=MAP_W || ty>=MAP_H) return true;   /* 地图外 = 实心 */
  const i = ty*MAP_W+tx;
  const t = map[i];
  if(t===T.TREE || t===T.ROCK || t===T.WATER || t===T.HOUSE || t===T.SHOP) return true;
  /* 建造物：栅栏和木箱挡路，洒水器可以踩过去 */
  const bi = buildIndex[i];
  if(bi >= 0){
    const r = buildRecipe(buildings[bi].type);
    if(r && r.solid) return true;
  }
  return false;
}
/* 碰撞盒（脚部）：相对精灵中心下移 (BODY_H - BOX_H)/2 */
const BOX_OFF_Y = (CONFIG.PLAYER.BODY_H - CONFIG.PLAYER.BOX_H) / 2;
function boxHitsSolid(cx, cy){
  const hw = CONFIG.PLAYER.BOX_W/2, hh = CONFIG.PLAYER.BOX_H/2;
  const x0 = Math.floor((cx - hw) / TILE);
  const x1 = Math.floor((cx + hw - 0.001) / TILE);
  const y0 = Math.floor((cy - hh) / TILE);
  const y1 = Math.floor((cy + hh - 0.001) / TILE);
  for(let ty=y0;ty<=y1;ty++)
    for(let tx=x0;tx<=x1;tx++)
      if(isSolid(tx,ty)) return true;
  return false;
}
/* 分轴移动：先 X 再 Y；某轴被挡则该轴位移作废 → 天然沿墙滑动 */
function movePlayer(dx, dy){
  const by = player.y + BOX_OFF_Y;
  if(!boxHitsSolid(player.x + dx, by)) player.x += dx;
  if(!boxHitsSolid(player.x, by + dy)) player.y += dy;
}
/* 脱困：若当前位置与实心格重叠（例如存档落在障碍里）则向 8 个方向逐像素找最近的空位 */
function unstickPlayer(){
  const by = player.y + BOX_OFF_Y;
  for(let r=1;r<=TILE;r++){
    const offs=[[-r,0],[r,0],[0,-r],[0,r],[-r,-r],[r,-r],[-r,r],[r,r]];
    for(let i=0;i<offs.length;i++){
      if(!boxHitsSolid(player.x + offs[i][0], by + offs[i][1])){
        player.x += offs[i][0]; player.y += offs[i][1];
        return true;
      }
    }
  }
  return false;
}
function updatePlayer(dt){
  /* 兜底：位置与实心格重叠时先脱困（静止时也要处理，否则会被永久卡住） */
  if(boxHitsSolid(player.x, player.y + BOX_OFF_Y)) unstickPlayer();

  let ix = 0, iy = 0;
  if(keys['a'] || keys['arrowleft'])  ix -= 1;
  if(keys['d'] || keys['arrowright']) ix += 1;
  if(keys['w'] || keys['arrowup'])    iy -= 1;
  if(keys['s'] || keys['arrowdown'])  iy += 1;

  const moving = (ix !== 0 || iy !== 0);
  player.moving = moving;
  if(moving){
    /* 对角线归一化：斜向速度与直线一致，不加速 */
    const len = Math.hypot(ix, iy) || 1;
    ix /= len; iy /= len;
    /* 体力为 0 时跑不动（自动禁用奔跑） */
    const running = !!keys['shift'] && stamina > 0;
    if(running) stamina = Math.max(0, stamina - CONFIG.STAMINA.RUN_PER_SEC * dt);
    /* 石板路：踩上去速度 ×1.3 */
    const road = roadUnderPlayer();
    const sp = CONFIG.PLAYER.SPEED * (road ? CONFIG.BUILD.ROAD_MULT : 1) *
               (running ? CONFIG.PLAYER.RUN_MULT : 1);
    player.vx = ix * sp; player.vy = iy * sp;
    /* 朝向：两轴同按时以最后按下的轴为准 */
    if(ix !== 0 && iy !== 0) player.dir = lastAxis === 'x' ? (ix<0?1:2) : (iy<0?3:0);
    else if(ix !== 0) player.dir = ix<0 ? 1 : 2;
    else player.dir = iy<0 ? 3 : 0;
    movePlayer(player.vx * dt, player.vy * dt);
    /* 摆腿动画：时间驱动帧切换 */
    player.animT += dt;
    const interval = 1 / CONFIG.PLAYER.ANIM_FPS;
    if(player.animT >= interval){ player.animT -= interval; player.frame ^= 1; }
  } else {
    player.vx = 0; player.vy = 0;
    player.frame = 0;         /* 静止回到站立帧 */
    player.animT = 0;
  }
}

/* --- 摄像机：跟随玩家（轻微缓动）+ 边界钳制 --- */
const cam = {x:0, y:0};
function updateCamera(dt){
  const tx = player.x - VIEW_W/2, ty = player.y - VIEW_H/2;
  const k = 1 - Math.exp(-CONFIG.CAMERA.SMOOTH * dt);
  cam.x += (tx - cam.x) * k;
  cam.y += (ty - cam.y) * k;
  const maxX = MAP_W*TILE - VIEW_W, maxY = MAP_H*TILE - VIEW_H;
  cam.x = clamp(cam.x, 0, maxX);
  cam.y = clamp(cam.y, 0, maxY);
}

/* --- 音效：Web Audio 实时合成（浏览器要求先有用户交互才允许播放） --- */
let actx = null;
function ensureAudio(){
  try{
    if(!actx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      actx = new AC();
    }
    if(actx.state === 'suspended') actx.resume();
    return actx;
  }catch(err){ return null; }
}
function playSfx(freq, type, dur, vol){
  const ac = ensureAudio();
  if(!ac) return false;
  const t0 = ac.currentTime;
  const osc = ac.createOscillator(), gain = ac.createGain();
  osc.type = type || CONFIG.AUDIO.TYPE;
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain); gain.connect(ac.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
  return true;
}

/* --- 提示条：屏幕底部，1.5 秒淡出，多条向上排 --- */
const toastBox = document.getElementById('toasts');
/* 把提示条锚定到画布下沿（而不是视口底部，避免掉进黑边） */
function layoutToasts(){
  if(!toastBox) return;
  const r = canvas.getBoundingClientRect();
  toastBox.style.left = (r.left + r.width / 2) + 'px';
  toastBox.style.bottom = Math.max(12, window.innerHeight - (r.top + r.height) + 16) + 'px';
}
function toast(msg){
  if(!toastBox) return;
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  el.style.animationDuration = CONFIG.INTERACT.TOAST_TIME + 's';
  toastBox.appendChild(el);                       /* 新的一条排在最下面，旧的被顶上去 */
  while(toastBox.children.length > CONFIG.INTERACT.TOAST_MAX)
    toastBox.removeChild(toastBox.firstChild);
  setTimeout(()=>{ if(el.parentNode) el.parentNode.removeChild(el); },
             CONFIG.INTERACT.TOAST_TIME * 1000);
}

/* --- 工具使用：距离判定 → 适用性判定 → 改地块 + 产出 + 音效 + 提示 --- */
function tileCenterDist(tx,ty){
  const dx = (tx+0.5)*TILE - player.x, dy = (ty+0.5)*TILE - player.y;
  return Math.hypot(dx, dy) / TILE;               /* 单位：格 */
}

/* --- 作物系统：播种 → 浇水 → 生长 → 收获 --- */
let canWater = CONFIG.WATER_CAN.CAPACITY;          /* 水壶剩余容量 */
function cropDef(type){ return CONFIG.CROPS.find(c => c.id === type); }
function cropAt(tx,ty){ return crops[ty*MAP_W+tx]; }
/* 视觉阶段 = 已生长的天数（封顶 3），每次浇水+1 */
function cropStage(c){ return Math.min(3, c.grown); }
/* 成熟度 0~1：长周期作物在结果期逐渐变红 */
function ripeness(c){
  const def = cropDef(c.type);
  if(c.mature) return 1;
  const start = Math.max(0, def.days - 3);
  return clamp((c.grown - start) / Math.max(1, def.days - start), 0, 1);
}
function sowCrop(tx,ty,type,seedId){
  const def = cropDef(type);
  const sid = seedId || ('seed_' + type);
  const season = seasonName();
  if(season === '冬'){ toast('土地休眠了'); playSfx(120,'sawtooth',0.10,CONFIG.AUDIO.VOLUME*0.6); return false; }
  if(def.season !== season){ toast(def.name + '只能在' + def.season + '季种'); playSfx(120,'sawtooth',0.10,CONFIG.AUDIO.VOLUME*0.6); return false; }
  const i = ty*MAP_W+tx;
  if(map[i] !== T.TILLED){ toast('先用锄头把这块地开垦了'); playSfx(120,'sawtooth',0.10,CONFIG.AUDIO.VOLUME*0.6); return false; }
  /* 种子来自背包：播下要扣 1 颗，没种子就不能播 */
  const slot = selectedSlot();
  const have = (slot && slot.id === sid && slot.n > 0) ? true : (countItem(sid) > 0);
  if(!have){ toast('没有' + def.name + '种子了'); playSfx(120,'sawtooth',0.10,CONFIG.AUDIO.VOLUME*0.6); return false; }
  crops[i] = {type:type, stage:0, grown:0, watered:false, mature:false, dead:false};
  if(slot && slot.id === sid && slot.n > 0){        /* 优先扣当前选中的那一格 */
    slot.n--;
    if(slot.n <= 0) inv[hotSel] = null;
  }else{
    removeItem(sid, 1);
  }
  toast('播下了' + def.name);
  const seedTool = CONFIG.TOOLS.find(t => t.crop === type);
  playSfx(seedTool ? seedTool.sfx : 523, CONFIG.AUDIO.TYPE, CONFIG.AUDIO.DUR, CONFIG.AUDIO.VOLUME);
  return true;
}
function waterTile(tx,ty){
  const i = ty*MAP_W+tx;
  if(canWater <= 0){ toast('水壶空了，去水边右键补水'); playSfx(120,'sawtooth',0.10,CONFIG.AUDIO.VOLUME*0.6); return false; }
  if(map[i] === T.WATERED){ toast('今天已经浇过水了'); playSfx(120,'sawtooth',0.10,CONFIG.AUDIO.VOLUME*0.6); return false; }
  if(map[i] !== T.TILLED){ toast('这里不能浇水'); playSfx(120,'sawtooth',0.10,CONFIG.AUDIO.VOLUME*0.6); return false; }
  if(!payStamina(staminaCost('can'))) return false;   /* 浇水消耗 1 点体力 */
  canWater--;
  map[i] = T.WATERED;                       /* 视觉变深色 */
  const c = crops[i];
  if(c) c.watered = true;
  toast('浇好了水（壶里还剩 ' + canWater + '）');
  playSfx(784, CONFIG.AUDIO.TYPE, CONFIG.AUDIO.DUR, CONFIG.AUDIO.VOLUME);
  return true;
}
function harvestCrop(tx,ty){
  const i = ty*MAP_W+tx;
  const c = crops[i];
  const def = cropDef(c.type);
  /* 背包放不下就不收：宁可留在地里，也不能让作物凭空消失 */
  if(!canFit(c.type, 1)){
    toast('背包满了，装不下' + def.name);
    playSfx(120,'sawtooth',0.10,CONFIG.AUDIO.VOLUME*0.6);
    return false;
  }
  if(!payStamina(staminaCost('harvest'))) return false;   /* 收获消耗 1 点体力 */
  addItem(c.type, 1);
  if(def.regrow > 0){                      /* 番茄：收获后回到阶段 3，继续结果 */
    c.grown = def.days - def.regrow;
    c.stage = 3; c.mature = false; c.watered = false;
    toast('收获 ' + def.name + ' ×1（还能再结）');
  }else{
    crops[i] = null;
    if(map[i] === T.WATERED) map[i] = T.TILLED;   /* 收获后地块变回耕地 */
    toast('收获 ' + def.name + ' ×1');
  }
  playSfx(1046, 'triangle', 0.16, CONFIG.AUDIO.VOLUME);
  return true;
}
function clearDeadCrop(tx,ty){
  const i = ty*MAP_W+tx;
  const def = cropDef(crops[i].type);
  if(!payStamina(staminaCost('sickle'))) return false;
  crops[i] = null;
  if(map[i] === T.WATERED) map[i] = T.TILLED;
  toast('清理了枯萎的' + def.name);
  playSfx(988, CONFIG.AUDIO.TYPE, CONFIG.AUDIO.DUR, CONFIG.AUDIO.VOLUME);
  return true;
}
/* 附近有没有水（站在水边右键补水） */
function findWaterNear(){
  const px = Math.floor(player.x/TILE), py = Math.floor(player.y/TILE);
  const R = Math.ceil(CONFIG.WATER_CAN.REFILL_RANGE);
  for(let ty=py-R; ty<=py+R; ty++) for(let tx=px-R; tx<=px+R; tx++){
    if(tx<0 || ty<0 || tx>=MAP_W || ty>=MAP_H) continue;
    if(map[ty*MAP_W+tx] !== T.WATER) continue;
    if(tileCenterDist(tx,ty) <= CONFIG.WATER_CAN.REFILL_RANGE) return {tx:tx, ty:ty};
  }
  return null;
}
function refillCan(){
  if(countItem('can') <= 0){ toast('你没有水壶'); playSfx(140,'sawtooth',0.09,CONFIG.AUDIO.VOLUME*0.6); return false; }
  if(canWater >= canCapacity()){ toast('水壶是满的'); return false; }
  if(!findWaterNear()){ toast('附近没有水源'); playSfx(140,'sawtooth',0.09,CONFIG.AUDIO.VOLUME*0.6); return false; }
  canWater = canCapacity();
  toast('水壶补满了（' + canWater + '）');
  playSfx(880, 'sine', 0.12, CONFIG.AUDIO.VOLUME);
  return true;
}
/* 每天 6:00 结算：浇过水才生长；换季时非当季作物枯萎；浇水状态重置 */
function settleDay(){
  const newSeason = seasonName();          /* 此刻 clock.day 已经是新的一天 */
  let grew = 0, matured = 0, withered = 0, wateredTiles = 0;
  for(let i=0;i<crops.length;i++){
    const c = crops[i];
    if(!c || c.dead) continue;
    const def = cropDef(c.type);
    if(def.season !== newSeason){          /* 换季 → 非当季作物枯萎 */
      c.dead = true; c.stage = 0; withered++;
      continue;
    }
    if(map[i] === T.WATERED){              /* 当天浇过水 → 生长一天 */
      c.grown++;
      if(c.grown >= def.days) c.mature = true;
      grew++;
    }
    c.stage = cropStage(c);
    if(c.mature) matured++;
  }
  for(let i=0;i<map.length;i++){           /* 浇水状态每天重置 */
    if(map[i] === T.WATERED){ map[i] = T.TILLED; wateredTiles++; }
  }
  for(let i=0;i<crops.length;i++){ if(crops[i]) crops[i].watered = false; }
  /* 洒水器：重置之后自动浇周围 3×3（今天浇 → 明天长） */
  const sprinkled = applySprinklers();
  if(withered) toast('换季了，' + withered + ' 株作物枯萎了');
  if(matured)  toast('有 ' + matured + ' 株作物成熟了');
  console.log('[settle] 第 ' + clock.day + ' 天结算：生长 ' + grew + ' 株，成熟 ' + matured +
              ' 株，枯萎 ' + withered + ' 株，重置浇水 ' + wateredTiles + ' 格' +
              (sprinkled ? '，洒水器浇了 ' + sprinkled + ' 格' : ''));
  return {grew:grew, matured:matured, withered:withered, sprinkled:sprinkled};
}

/* --- 洒水器：每天早上自动浇周围 3×3 --- */
function applySprinklers(){
  let n = 0;
  const R = CONFIG.BUILD.SPRINKLER_RANGE;
  for(const b of buildings){
    if(b.type !== 'sprinkler') continue;
    for(let dy=-R; dy<=R; dy++){
      for(let dx=-R; dx<=R; dx++){
        const tx = b.tx+dx, ty = b.ty+dy;
        if(tx < 0 || ty < 0 || tx >= MAP_W || ty >= MAP_H) continue;
        const i = ty*MAP_W+tx;
        if(map[i] !== T.TILLED && map[i] !== T.WATERED) continue;
        map[i] = T.WATERED;
        if(crops[i]) crops[i].watered = true;
        spawnDrops(tx,ty);
        n++;
      }
    }
  }
  if(n) toast('洒水器浇了 ' + n + ' 格地');
  return n;
}
/* 洒水器的小水滴（世界坐标，往下掉） */
function spawnDrops(tx,ty){
  for(let k=0; k<3; k++){
    dropFx.push({
      x:(tx + 0.5)*TILE + (Math.random() - 0.5)*18,
      y:(ty + 0.25)*TILE + Math.random()*10,
      vy: 16 + Math.random()*26,
      life: 0.9, max: 0.9
    });
  }
}
function updateDropFx(dt){
  for(let i=dropFx.length-1; i>=0; i--){
    const p = dropFx[i];
    p.y += p.vy * dt;
    p.life -= dt;
    if(p.life <= 0) dropFx.splice(i,1);
  }
}
function drawDropFx(g){
  const C = CONFIG.TILE_COLORS;
  for(const p of dropFx){
    const a = clamp(p.life / p.max, 0, 1);
    g.fillStyle = C.dropWater;
    g.globalAlpha = a;
    g.fillRect((p.x - cam.x) | 0, (p.y - cam.y) | 0, 2, 3);
    g.fillStyle = C.dropWaterLight;
    g.fillRect((p.x - cam.x) | 0, (p.y - cam.y) | 0, 1, 1);
    g.globalAlpha = 1;
  }
}

/* --- 工具使用：当前选中物品 → 工具行为 → 适用性判定 → 改地块 + 产出 + 音效 + 提示 --- */
function useTool(tx,ty){
  if(tx < 0 || ty < 0 || tx >= MAP_W || ty >= MAP_H) return false;
  if(tileCenterDist(tx,ty) > CONFIG.INTERACT.RANGE_TILES){
    toast('太远了，走近一点再试试');
    playSfx(110, 'sawtooth', 0.10, CONFIG.AUDIO.VOLUME * 0.6);
    return false;
  }
  const i = ty*MAP_W + tx, t = map[i];
  const crop = crops[i];
  const slot = selectedSlot();
  const item = slot ? itemDef(slot.id) : null;
  const tool = item ? CONFIG.TOOLS.find(x => x.id === item.id) : null;

  /* 1. 地里有作物：成熟的点一下就收（跟手上拿什么无关）；枯萎的要用镰刀 */
  if(crop){
    if(crop.dead){
      if(tool && tool.id === 'sickle') return clearDeadCrop(tx,ty);
      toast('作物已经枯萎了，用镰刀清理');
      playSfx(120, 'sawtooth', 0.10, CONFIG.AUDIO.VOLUME * 0.6);
      return false;
    }
    if(crop.mature) return harvestCrop(tx,ty);
    if(!tool){ toast('这块地里还有没熟的作物'); playSfx(120,'sawtooth',0.10,CONFIG.AUDIO.VOLUME*0.6); return false; }
    if(tool.id === 'can') return waterTile(tx,ty);             /* 没熟：照常浇水 */
    if(item.kind === 'seed'){ toast('这里已经种了东西'); playSfx(120,'sawtooth',0.10,CONFIG.AUDIO.VOLUME*0.6); return false; }
    if(tool.id === 'sickle'){ toast('还没长好，再等几天'); playSfx(120,'sawtooth',0.10,CONFIG.AUDIO.VOLUME*0.6); return false; }
    toast('这块地里还有没熟的作物');
    playSfx(120, 'sawtooth', 0.10, CONFIG.AUDIO.VOLUME * 0.6);
    return false;
  }

  /* 2. 空地：必须有能用的物品 */
  if(!item){ toast('这个格子是空的，先选个东西'); playSfx(110,'sawtooth',0.10,CONFIG.AUDIO.VOLUME*0.6); return false; }
  if(item.kind === 'currency'){ toast('金币不能拿去用'); return false; }
  if(!tool){ toast(item.name + '用不了'); playSfx(110,'sawtooth',0.10,CONFIG.AUDIO.VOLUME*0.6); return false; }

  /* 3. 种子：只能种在耕地上（扣背包里的种子） */
  if(item.kind === 'seed') return sowCrop(tx,ty,tool.crop,item.id);

  /* 4. 水壶 */
  if(tool.id === 'can') return waterTile(tx,ty);

  /* 5. 普通工具：按地块类型处理 */
  if(tool.accepts.indexOf(t) < 0){
    toast(item.name + '不能用在' + TILE_NAMES[t] + '上');
    playSfx(110, 'sawtooth', 0.10, CONFIG.AUDIO.VOLUME * 0.6);
    return false;
  }
  /* 背包放不下产出物 → 不动地块，物品不产生（树不会被白砍） */
  if(tool.out && !canFit(tool.out.item, tool.out.n)){
    toast('背包满了，装不下' + itemDef(tool.out.item).name);
    playSfx(110, 'sawtooth', 0.10, CONFIG.AUDIO.VOLUME * 0.6);
    return false;
  }
  /* 体力不够就别动这块地（不消耗体力、不改地块） */
  if(!payStamina(staminaCost(tool.id))) return false;
  map[i] = tool.to;
  if(tool.out){
    addItem(tool.out.item, tool.out.n);
    toast('获得 ' + itemDef(tool.out.item).name + ' ×' + tool.out.n);
  }else{
    toast(tool.msg);
  }
  playSfx(tool.sfx, CONFIG.AUDIO.TYPE, CONFIG.AUDIO.DUR, CONFIG.AUDIO.VOLUME);
  return true;
}

/* --- 商店系统：价格 / 买卖 / 水壶扩容 ---
 * 价格 = 基础价 × 季节系数 × (1 ± PRICE_FLUCT)
 *   基础价：种子/工具查 CONFIG.SHOP.BUY；作物查 CONFIG.CROPS.sell；材料查 CONFIG.ITEMS.price
 *   季节系数：春 1.00 / 夏 1.05 / 秋 1.10 / 冬 0.90
 *   浮动量：由「物品 id + 天数」哈希出来 → 同一天同一物品价格固定，隔天才变
 * 卖出与买入共用同一个 priceOf()，面板上用 ↑ ↓ 标出当前价相对「基础价 × 季节系数」的涨跌 */
function strHash(s){
  let h = 2166136261 >>> 0;
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  /* 雪崩混淆：不然短字符串（只差一天）会挤在一堆，价格浮动就成不了「每天不同」 */
  h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b) >>> 0;
  h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35) >>> 0;
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;                 /* 0~1 */
}
/* 当前季节的价格系数 */
function seasonCoef(){ return CONFIG.SHOP.SEASON_COEF[seasonName()] || 1; }
/* 基础价（不含季节系数与浮动） */
function basePrice(id){
  const buy = CONFIG.SHOP.BUY.find(b => b.id === id);
  if(buy) return buy.price;
  const d = itemDef(id);
  if(!d) return 0;
  if(d.kind === 'crop'){ const c = cropDef(d.crop); return c ? c.sell : 0; }
  if(d.kind === 'material') return d.price || 0;
  return 0;
}
/* 当前价格（含季节系数与 ±15% 浮动） */
function priceOf(id){
  const b = basePrice(id);
  if(b <= 0) return 0;
  const f = (strHash(id + '@' + clock.day) * 2 - 1) * CONFIG.SHOP.PRICE_FLUCT;
  return Math.max(1, Math.round(b * seasonCoef() * (1 + f)));
}
/* 浮动标记：当前价 vs 基础价 × 季节系数 */
function priceTrend(id){
  const b = basePrice(id);
  if(b <= 0) return '=';
  const mid = b * seasonCoef();
  const p = priceOf(id);
  if(p > mid) return '↑';
  if(p < mid) return '↓';
  return '=';
}
/* 能不能卖：只有收获的作物与材料能卖（种子/工具不回收） */
function isSellable(id){
  const d = itemDef(id);
  if(!d) return false;
  return d.kind === 'crop' || d.kind === 'material';
}
/* 工具是否已经拥有（一次性商品） */
function toolOwned(id){
  const d = itemDef(id);
  if(!d || d.kind !== 'tool') return false;
  return countItem(id) > 0;
}
/* 金币变动 + 跳动动画（动画用 performance.now()，商店打开、时间冻结时照样跳） */
function changeGold(v){
  gold += v;
  goldDelta = v;
  goldPulseAt = performance.now();
  pulseShopGold();
  return gold;
}
/* 买：扣钱 → 给东西（工具优先进快捷栏空位，买完就能用） */
function buyItem(id){
  if(id === 'can_upgrade') return upgradeCan();
  const d = itemDef(id);
  if(!d){ toast('商店不卖这个'); return false; }
  if(toolOwned(id)){ toast('已经有' + d.name + '了'); return false; }
  const price = priceOf(id);
  if(gold < price){ toast('金币不够（还差 ' + (price - gold) + '）'); playSfx(120,'sawtooth',0.10,CONFIG.AUDIO.VOLUME*0.6); return false; }
  if(!canFit(id, 1)){ toast('背包满了，装不下' + d.name); return false; }
  changeGold(-price);
  giveItem(id, 1);
  const inHot = inv.findIndex(s => s && s.id === id) < CONFIG.INVENTORY.HOTBAR;
  toast('买下了' + d.name + '（-' + price + ' 💰）' +
        (inHot ? '' : '　快捷栏满了，放在背包里，拖到快捷栏就能用'));
  playSfx(880, 'triangle', 0.12, CONFIG.AUDIO.VOLUME);
  refreshPackGrid();
  renderShop();
  return true;
}
/* 卖 n 个：先确认数量够，再从背包扣掉 → 加钱 */
function sellItem(id, n){
  const d = itemDef(id);
  if(!d || !isSellable(id)){ toast('这个不能卖'); return false; }
  if(n <= 0) return false;
  if(countItem(id) < n){ toast('数量不够'); return false; }
  const unit = priceOf(id), total = unit * n;
  removeItem(id, n);
  changeGold(total);
  toast('卖出 ' + d.name + ' ×' + n + '（+' + total + ' 💰）');
  playSfx(1046, 'triangle', 0.12, CONFIG.AUDIO.VOLUME);
  refreshPackGrid();
  renderShop();
  return true;
}
/* 水壶扩容：20 → 30 → 40 */
function upgradeCan(){
  if(canLevel >= CONFIG.SHOP.CAN_MAX_LEVEL){ toast('水壶已经是最大容量了'); return false; }
  const price = priceOf('can_upgrade');
  if(gold < price){ toast('金币不够（还差 ' + (price - gold) + '）'); playSfx(120,'sawtooth',0.10,CONFIG.AUDIO.VOLUME*0.6); return false; }
  changeGold(-price);
  canLevel++;
  canWater = canCapacity();
  toast('水壶升级了！容量 ' + canCapacity());
  playSfx(1174, 'triangle', 0.16, CONFIG.AUDIO.VOLUME);
  refreshPackGrid();
  renderShop();
  return true;
}
/* 玩家到商店摊的最近距离（格） */
function shopDist(){
  let best = Infinity;
  for(let ty=SHOP_POS.y; ty<SHOP_POS.y + SHOP_POS.h; ty++)
    for(let tx=SHOP_POS.x; tx<SHOP_POS.x + SHOP_POS.w; tx++){
      const dx = (tx + 0.5)*TILE - player.x, dy = (ty + 0.5)*TILE - player.y;
      best = Math.min(best, Math.hypot(dx, dy) / TILE);
    }
  return best;
}
/* 是否站在商店摊的交互范围内 */
function nearShop(){ return shopDist() <= CONFIG.SHOP.RANGE; }

/* --- 时间系统：每 tick 推进；6:00 天亮 → 20:00 入夜 → 2:00 强制结束一天 --- */
const clock = {day:1, min:0, hold:0};          /* min = 从 6:00 起经过的游戏分钟 */
const DAY_SPAN_MIN = (24 - CONFIG.DAY_START_HOUR + CONFIG.DAY_END_HOUR) * 60;  /* 6:00→次日2:00 = 1200 分 */
const GAME_MIN_PER_SEC = DAY_SPAN_MIN / (CONFIG.DAY_MINUTES * 60);             /* 每现实秒推进多少游戏分钟 */
function clockHM(){
  const total = CONFIG.DAY_START_HOUR * 60 + clock.min;
  const h = Math.floor(total / 60) % 24, m = Math.floor(total % 60);
  return {h:h, m:m, s:String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0')};
}
function skyHour(){ return (CONFIG.DAY_START_HOUR + clock.min / 60) % 24; }
function seasonName(){
  const i = Math.floor((clock.day - 1) / CONFIG.DAYS_PER_SEASON) % CONFIG.SEASONS.length;
  return CONFIG.SEASONS[i];
}
function updateClock(dt){
  if(clock.hold > 0){                          /* 停在 2:00，等 hold 结束再翻到次日 6:00 */
    clock.hold -= dt;
    if(clock.hold <= 0){
      clock.hold = 0;
      if(!dayRolled) rollToNextMorning(sleepFx.faint);
      console.log('[time] 第 ' + clock.day + ' 天 ' + clockHM().s + ' · ' + seasonName() + ' · ' + weather.name);
    }
    return;
  }
  clock.min += dt * GAME_MIN_PER_SEC;
  if(clock.min >= DAY_SPAN_MIN){
    clock.min = DAY_SPAN_MIN;                  /* 停在 02:00 */
    clock.hold = CONFIG.DAY_END_HOLD;
    dayRolled = false;
    triggerFaint();                            /* 2:00 还没睡 → 强制昏睡 */
    console.log('[time] 第 ' + clock.day + ' 天结束（' + clockHM().s + '）→ 昏睡');
  }
}

/* --- 睡觉 / 昏睡：淡出 → 推进一天 → 淡入 → 「第 N 天」 --- */
const sleepFx = {phase:'none', t:0, faint:false, day:0};
/* 这一次 2:00 有没有已经翻过天（时钟自己翻 / 睡觉流程翻，二选一，别翻两次） */
let dayRolled = false;

/* 到小屋的距离（格） */
function houseDist(){
  let best = Infinity;
  for(let ty=HOUSE_POS.y; ty<HOUSE_POS.y + HOUSE_POS.h; ty++)
    for(let tx=HOUSE_POS.x; tx<HOUSE_POS.x + HOUSE_POS.w; tx++){
      const dx = (tx + 0.5)*TILE - player.x, dy = (ty + 0.5)*TILE - player.y;
      best = Math.min(best, Math.hypot(dx, dy) / TILE);
    }
  return best;
}
function nearHouse(){ return houseDist() <= CONFIG.SLEEP.RANGE; }

/* 开始睡觉（faint = true 是强制昏睡） */
function startSleep(faint){
  if(sleepFx.phase !== 'none') return false;
  sleepFx.phase = 'out'; sleepFx.t = 0; sleepFx.faint = !!faint;
  dayRolled = false;                 /* 本次睡觉要自己翻天（上一轮的标记不能继承） */
  toast(faint ? '你撑不住了，眼前一黑…' : '晚安…');
  return true;
}
/* 2:00 强制昏睡 */
function triggerFaint(){
  if(sleepFx.phase !== 'none') return;
  startSleep(true);
}
/* 翻到第二天早上：结算作物生长 → 重置浇水 → 恢复体力 */
function rollToNextMorning(faint){
  clock.day++; clock.min = 0; clock.hold = 0;
  settleDay();                 /* 每天 6:00 结算：生长 / 枯萎 / 浇水状态重置 */
  rollWeather();
  if(faint){
    /* 惩罚方式选「体力」：次日体力上限扣 20%（不扣金币，避免误伤玩家资产） */
    staminaMax = Math.round(CONFIG.STAMINA.MAX * (1 - CONFIG.SLEEP.FAINT_PENALTY));
    toast('你昏睡过去了…… 次日体力上限 ' + staminaMax + '（-' +
          Math.round(CONFIG.SLEEP.FAINT_PENALTY * 100) + '%）');
  }else{
    staminaMax = CONFIG.STAMINA.MAX;
  }
  stamina = staminaMax;
  dayRolled = true;
  sleepFx.day = clock.day;
  console.log('[sleep] 第 ' + clock.day + ' 天 06:00 · 体力 ' + stamina + '/' + staminaMax +
              (faint ? '（强制昏睡）' : '（正常睡觉）'));
  /* 新的一天开始 → 自动存档（玩家睡着时保存最安全） */
  if(CONFIG.SAVE.AUTO_NEW_DAY && sessionActive) saveGame('新的一天');
}
/* 睡觉流程推进（接管整个 update） */
function updateSleepFx(dt){
  const S = CONFIG.SLEEP;
  sleepFx.t += dt;
  if(sleepFx.phase === 'out'){
    if(sleepFx.t >= S.FADE_OUT){ sleepFx.phase = 'hold'; sleepFx.t = 0; }
  }else if(sleepFx.phase === 'hold'){
    if(!dayRolled) rollToNextMorning(sleepFx.faint);   /* 全黑时翻到次日 6:00 */
    if(sleepFx.t >= S.HOLD){ sleepFx.phase = 'in'; sleepFx.t = 0; }
  }else if(sleepFx.phase === 'in'){
    if(sleepFx.t >= S.FADE_IN){ sleepFx.phase = 'title'; sleepFx.t = 0; }
  }else if(sleepFx.phase === 'title'){
    if(sleepFx.t >= S.TITLE){ sleepFx.phase = 'none'; sleepFx.t = 0; }
  }
}
/* 睡觉时的全黑程度（0~1） */
function sleepAlpha(){
  const S = CONFIG.SLEEP;
  if(sleepFx.phase === 'out')  return Math.min(1, sleepFx.t / S.FADE_OUT);
  if(sleepFx.phase === 'hold') return 1;
  if(sleepFx.phase === 'in')   return Math.max(0, 1 - sleepFx.t / S.FADE_IN);
  return 0;
}

/* --- 天气：每天早晨随机（带权重） --- */
let weather = CONFIG.WEATHER[0];
function rollWeather(){
  let total = 0;
  for(const w of CONFIG.WEATHER) total += w.w;
  let r = Math.random() * total;
  let picked = CONFIG.WEATHER[CONFIG.WEATHER.length-1];
  for(const w of CONFIG.WEATHER){ r -= w.w; if(r < 0){ picked = w; break; } }
  weather = picked;
  spawnParticles();
  console.log('[weather] 第 ' + clock.day + ' 天天气：' + weather.name);
}

/* --- 天气粒子（画在画布坐标系里，随画布缩放自动对齐） --- */
let fxParticles = [];
let rainTimer = 0;
function newParticle(init){
  const rain = weather.id === 'rain';
  return {
    x: Math.random() * VIEW_W,
    y: init ? Math.random() * VIEW_H : -8 - Math.random() * (VIEW_H * 0.4),
    vx: rain ? -CONFIG.WEATHER_FX.RAIN_SPEED * 0.30 : (Math.random() * 26 - 13),
    vy: rain ? CONFIG.WEATHER_FX.RAIN_SPEED : CONFIG.WEATHER_FX.SNOW_SPEED * (0.6 + Math.random() * 0.8),
    len: rain ? 9 + Math.random() * 8 : 0,
    r: 1 + Math.random() * 1.7,
    a: 0.45 + Math.random() * 0.5
  };
}
function spawnParticles(){
  fxParticles = [];
  const n = weather.id === 'rain'  ? CONFIG.WEATHER_FX.RAIN_COUNT
          : weather.id === 'snow'  ? CONFIG.WEATHER_FX.SNOW_COUNT : 0;
  for(let i=0;i<n;i++) fxParticles.push(newParticle(true));
}
function updateWeather(dt){
  if(weather.id === 'rain'){                   /* 滴答声 */
    rainTimer -= dt;
    if(rainTimer <= 0){
      rainTimer = CONFIG.RAIN_TICK_MIN + Math.random() * (CONFIG.RAIN_TICK_MAX - CONFIG.RAIN_TICK_MIN);
      playSfx(2200 + Math.random() * 1500, 'square', 0.035, CONFIG.AUDIO.VOLUME * 0.30);
    }
  }
  for(const p of fxParticles){
    p.x += p.vx * dt; p.y += p.vy * dt;
    if(p.y > VIEW_H + 12){ p.y = -12; p.x = Math.random() * VIEW_W; }
    if(p.x < -14) p.x = VIEW_W + 12;
    if(p.x > VIEW_W + 14) p.x = -12;
  }
}
function drawWeather(g){
  if(!fxParticles.length) return;
  if(weather.id === 'rain'){
    g.strokeStyle = 'rgba(175,210,255,0.55)';
    g.lineWidth = 1;
    for(const p of fxParticles){
      g.beginPath();
      g.moveTo(p.x, p.y);
      g.lineTo(p.x + p.vx * 0.024, p.y + p.len);
      g.stroke();
    }
  }else if(weather.id === 'snow'){
    for(const p of fxParticles){
      g.fillStyle = 'rgba(255,255,255,' + p.a.toFixed(2) + ')';
      g.fillRect(p.x | 0, p.y | 0, (p.r * 2) | 0, (p.r * 2) | 0);
    }
  }
}

/* --- 昼夜染色 + 夜间暗角 --- */
function hexToRgb(h){
  let s = String(h).replace('#','');
  if(s.length === 3) s = s[0]+s[0]+s[1]+s[1]+s[2]+s[2];
  const n = parseInt(s, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function skyAt(h){
  const K = CONFIG.SKY;
  let i = 0;
  while(i < K.length - 2 && K[i+1].h <= h) i++;
  const a = K[i], b = K[i+1];
  const t = Math.min(1, Math.max(0, (h - a.h) / Math.max(1e-6, b.h - a.h)));
  const ca = hexToRgb(a.c), cb = hexToRgb(b.c);
  return {
    r: ca[0] + (cb[0]-ca[0])*t,  g: ca[1] + (cb[1]-ca[1])*t,  b: ca[2] + (cb[2]-ca[2])*t,
    a: a.a + (b.a - a.a) * t,   v: a.v + (b.v - a.v) * t
  };
}
const sky = {cur:{r:8,g:20,b:50,a:0.55,v:1}};
function updateSky(dt){
  const t = skyAt(skyHour());
  const k = 1 - Math.exp(-CONFIG.SKY_SMOOTH * dt);   /* 平滑过渡，杜绝闪变 */
  const c = sky.cur;
  c.r += (t.r - c.r) * k; c.g += (t.g - c.g) * k; c.b += (t.b - c.b) * k;
  c.a += (t.a - c.a) * k; c.v += (t.v - c.v) * k;
}
function drawAtmosphere(g){
  const c = sky.cur;
  if(c.a > 0.002){                                /* 整体染色 */
    g.fillStyle = 'rgb(' + (c.r|0) + ',' + (c.g|0) + ',' + (c.b|0) + ')';
    g.globalAlpha = c.a;
    g.fillRect(0, 0, VIEW_W, VIEW_H);
    g.globalAlpha = 1;
  }
  if(c.v > 0.002){                                /* 夜间暗角：以玩家为中心 */
    const px = player.x - cam.x, py = player.y - cam.y;
    const R = CONFIG.VIGNETTE.DAY_R + (CONFIG.VIGNETTE.NIGHT_R - CONFIG.VIGNETTE.DAY_R) * c.v;
    const A = CONFIG.VIGNETTE.NIGHT_A * c.v;
    const grd = g.createRadialGradient(px, py, R * 0.32, px, py, R);
    grd.addColorStop(0, 'rgba(0,0,0,0)');
    grd.addColorStop(1, 'rgba(0,0,0,' + A.toFixed(3) + ')');
    g.fillStyle = grd;
    g.fillRect(0, 0, VIEW_W, VIEW_H);
  }
  /* 体力耗尽：再加一层淡红暗角（画在 UI 之前，不会盖住体力条） */
  const eg = exhaustedGlow();
  if(eg > 0){
    const px = player.x - cam.x, py = player.y - cam.y;
    const R = 520;
    const grd = g.createRadialGradient(px, py, R * 0.34, px, py, R);
    grd.addColorStop(0, 'rgba(0,0,0,0)');
    grd.addColorStop(1, 'rgba(40,0,0,' + (0.16 + 0.22 * eg).toFixed(3) + ')');
    g.fillStyle = grd;
    g.fillRect(0, 0, VIEW_W, VIEW_H);
  }
}

/* --- 暂停：所有系统（时间/天气/角色/摄像机）一起冻结 --- */
let paused = false;
function setPaused(v){ paused = !!v; }

/* --- 输入 --- */
const keys = {};
let lastAxis = 'x';
window.addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  if(['arrowleft','arrowright','arrowup','arrowdown',' ','tab'].includes(k)) e.preventDefault();
  keys[k] = true;
  if(k==='a'||k==='arrowleft'||k==='d'||k==='arrowright') lastAxis = 'x';
  else if(k==='w'||k==='arrowup'||k==='s'||k==='arrowdown') lastAxis = 'y';
  /* 背包：Tab / I 打开，Esc 关闭 */
  if(k === 'tab' || k === 'i'){ if(!e.repeat) togglePack(); ensureAudio(); return; }
  if(k === 'escape'){
    if(chestOpen){ toggleChest(false); return; }
    if(shopOpen){ toggleShop(false); return; }
    if(packOpen){ togglePack(false); return; }
    if(sysOpen){ toggleSys(false); return; }
    if(startMenuOpen) return;                 /* 标题界面必须选一个才能进游戏 */
    if(buildMode){ toggleBuild(false); return; }
    toggleSys(true);                          /* 其它情况：打开系统菜单（保存/读档） */
    return;
  }
  if(shopOpen) return;              /* 商店打开时其它按键一律忽略 */
  if(packOpen) return;              /* 背包打开时其它按键一律忽略 */
  if(chestOpen) return;             /* 木箱打开时其它按键一律忽略 */
  if(sleepFx.phase !== 'none') return;   /* 睡觉/昏睡中：其它按键一律忽略 */
  /* B：进出建造模式 */
  if(k === 'b'){ if(!e.repeat) toggleBuild(); ensureAudio(); return; }
  /* 建造模式：E / Q 换配方（E 优先级最高，会顶掉「按 E 睡觉/交易」） */
  if(buildMode && (k === 'e' || k === 'q')){
    if(!e.repeat) cycleBuild(k === 'e' ? 1 : -1);
    ensureAudio(); return;
  }
  /* E：上下文交互 —— 小屋旁睡觉，木箱旁开箱，商店摊旁交易 */
  if(k === 'e'){
    if(!e.repeat){
      const c = chestNear();
      if(nearHouse()) startSleep(false);
      else if(c){ openChest = c; toggleChest(true); }
      else if(nearShop()) toggleShop();
      else{
        /* 都不是 → 提示靠近最近的那个（小屋 / 商店） */
        const dh = houseDist(), ds = shopDist();
        toast(dh <= ds ? '走近小屋才能睡觉' : '走近商店摊才能交易');
      }
    }
    ensureAudio(); return;
  }
  /* 数字键 1~8 选中快捷栏（= 背包前 8 格） */
  if(k >= '1' && k <= String(CONFIG.INVENTORY.HOTBAR)){
    selectHot(Number(k) - 1);
    ensureAudio();                   /* 键盘也算一次用户交互，解锁音频 */
  }
  if(k === CONFIG.PAUSE_KEY) setPaused(!paused);   /* 暂停/恢复 */
});
window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = false; });
window.addEventListener('blur', ()=>{ for(const k in keys) keys[k] = false; });

/* --- 鼠标 → 指向的瓦片（换算与 CSS 缩放无关） --- */
const mouse = {x:0, y:0, inside:false};
const hover = {tx:-1, ty:-1};
function toLogical(e){
  const r = canvas.getBoundingClientRect();
  return {x:(e.clientX - r.left) * (VIEW_W / r.width),
          y:(e.clientY - r.top)  * (VIEW_H / r.height)};
}
canvas.addEventListener('mousemove', e=>{
  const p = toLogical(e);
  mouse.x = p.x; mouse.y = p.y; mouse.inside = true;
  hover.tx = Math.floor((cam.x + p.x) / TILE);
  hover.ty = Math.floor((cam.y + p.y) / TILE);
});
canvas.addEventListener('mouseleave', ()=>{ mouse.inside = false; hover.tx = -1; hover.ty = -1; });
/* 左键 = 使用当前选中物品（这次点击同时作为音频解锁的用户交互）；右键 = 站在水边给水壶补水 */
canvas.addEventListener('mousedown', e=>{
  if(packOpen || shopOpen || chestOpen) return;
  const p = toLogical(e);
  const tx = Math.floor((cam.x + p.x) / TILE);
  const ty = Math.floor((cam.y + p.y) / TILE);
  /* 建造模式：左键放置 / 右键拆除 */
  if(buildMode){
    ensureAudio();
    if(e.button === 2){ demolishAt(tx,ty); return; }
    if(e.button !== 0) return;
    placeBuilding(tx,ty);
    return;
  }
  if(e.button === 2){ ensureAudio(); refillCan(); return; }
  if(e.button !== 0) return;
  ensureAudio();
  /* 点在快捷栏上 → 选中那一格，不算使用工具 */
  const hb = hotbarRect();
  if(p.x >= hb.x - 6 && p.x <= hb.x + hb.w + 5 && p.y >= hb.y - 6 && p.y <= hb.y + hb.h + 5){
    const idx = Math.floor((p.x - hb.x) / (hb.cell + hb.gap));
    if(idx >= 0 && idx < CONFIG.INVENTORY.HOTBAR) selectHot(idx);
    return;
  }
  useTool(tx, ty);
});
canvas.addEventListener('contextmenu', e=> e.preventDefault());
/* 建造模式：滚轮换配方 */
canvas.addEventListener('wheel', e=>{
  if(!buildMode) return;
  e.preventDefault();
  cycleBuild(e.deltaY > 0 ? 1 : -1);
}, {passive:false});

/* === 6.UI === */
/* --- 背包面板（DOM 覆盖层；打开时游戏时间冻结） --- */
const packEl   = document.getElementById('pack');
const packMask = document.getElementById('packMask');
const packGrid = document.getElementById('packGrid');
const packTip  = document.getElementById('packTip');
const packHeld = document.getElementById('packHeld');
const packInfo = document.getElementById('packInfo');
let packOpen = false;          /* 背包是否打开（打开时 update() 整体冻结 → 时间停住） */
let held = null;               /* 手上拿着的物品：{id, n, from}（from = 拿起时的格号） */

/* 建 24 个格子（前 8 格 = 快捷栏，标 1~8） */
function buildPackGrid(){
  if(!packGrid || !packGrid.appendChild) return;
  packGrid.innerHTML = '';
  for(let i=0;i<CONFIG.INVENTORY.SLOTS;i++){
    const cell = document.createElement('div');
    cell.className = 'cell' + (i < CONFIG.INVENTORY.HOTBAR ? ' hot' : '');
    cell.slotIndex = i;
    cell.innerHTML = '<span class="k">' + (i < CONFIG.INVENTORY.HOTBAR ? (i+1) : '') + '</span>' +
                     '<span class="ic"></span><span class="n"></span>';
    cell.addEventListener('mousedown', e=>{ e.preventDefault(); packClick(i); });
    cell.addEventListener('mouseenter', e=>{ showPackTip(i, e); });
    cell.addEventListener('mousemove', e=>{ movePackTip(e); });
    cell.addEventListener('mouseleave', ()=>{ hidePackTip(); });
    packGrid.appendChild(cell);
  }
}
/* 把背包状态刷到格子上 */
function refreshPackGrid(){
  if(packInfo) packInfo.textContent = '已用 ' + invUsed() + '/' + CONFIG.INVENTORY.SLOTS +
                                     ' 格　💰 ' + gold;
  if(!packGrid || !packGrid.children) return;
  const cells = packGrid.children;
  for(let i=0;i<cells.length;i++){
    const c = cells[i];
    if(!c || typeof c.querySelector !== 'function') continue;
    const s = inv[i], d = s ? itemDef(s.id) : null;
    const ic = c.querySelector('.ic'), n = c.querySelector('.n');
    if(ic) ic.textContent = d ? d.icon : '';
    if(n)  n.textContent  = (s && s.n > 1) ? String(s.n) : '';
  }
}
/* 把一件东西塞进背包：先并进同 id 的堆，再找空位；放不下返回 false（不吞） */
function storeItem(entry){
  const d = itemDef(entry.id);
  if(!d) return false;
  const lim = stackLimit(entry.id);
  let left = entry.n;
  if(d.stack){
    for(let i=0;i<inv.length && left>0;i++){
      const s = inv[i];
      if(s && s.id === entry.id && s.n < lim){
        const take = Math.min(lim - s.n, left);
        s.n += take; left -= take;
      }
    }
  }
  for(let i=0;i<inv.length && left>0;i++){
    if(inv[i]) continue;
    const take = d.stack ? Math.min(lim, left) : 1;
    inv[i] = {id:entry.id, n:take};
    left -= take;
  }
  return left <= 0;
}
/* 点格子：空手 → 拾起；手里有东西 → 放下（目标格有东西就交换） */
function packClick(i){
  const s = inv[i];
  if(held){
    const back = s ? {id:s.id, n:s.n} : null;   /* 目标格原来那件，先存着 */
    const from = held.from;
    inv[i] = {id:held.id, n:held.n};             /* 手里的东西落到目标格 */
    held = null;
    if(back){
      if(from !== i && !inv[from]){
        inv[from] = back;                       /* 交换：原格放回原来那件 */
      }else if(!storeItem(back)){
        held = {id:back.id, n:back.n, from:i};  /* 实在没地方放 → 拿回手里，绝不丢 */
      }
    }
  }else{
    if(!s) return;
    held = {id:s.id, n:s.n, from:i};
    inv[i] = null;
  }
  refreshPackGrid();
  updatePackHeld();
}
/* 面板外松手 / 关面板：手里的东西放回背包（绝不凭空消失） */
function packDropHeld(){
  if(!held) return;
  if(!inv[held.from]){
    inv[held.from] = {id:held.id, n:held.n};   /* 放回拿起时的原格 */
    held = null;
  }else if(storeItem({id:held.id, n:held.n})){
    held = null;                               /* 原格被占 → 并到别的堆/空位 */
  }
  /* 实在没地方放 → 继续拿在手里（不丢） */
  refreshPackGrid();
  updatePackHeld();
}
/* 物品名提示 */
function showPackTip(i, e){
  const s = inv[i];
  const d = s ? itemDef(s.id) : null;
  if(!d){ hidePackTip(); return; }
  let extra = '';
  if(d.kind === 'seed'){ const cd = cropDef(d.crop); extra = ' · ' + cd.season + '季 · ' + cd.days + '天'; }
  else if(d.kind === 'crop'){ extra = ' · 售价 ' + priceOf(d.id) + ' 💰'; }
  else if(d.kind === 'material') extra = ' · 售价 ' + priceOf(d.id) + ' 💰';
  else if(d.kind === 'tool')     extra = ' · 工具';
  else if(d.kind === 'currency') extra = ' · 金币';
  if(packTip){
    packTip.textContent = d.name + ' ×' + s.n + extra;
    packTip.style.display = 'block';
    movePackTip(e);
  }
}
function movePackTip(e){
  if(!packTip || !packTip.style || packTip.style.display === 'none') return;
  packTip.style.left = (e.clientX + 14) + 'px';
  packTip.style.top  = (e.clientY + 16) + 'px';
}
function hidePackTip(){ if(packTip) packTip.style.display = 'none'; }
/* 手上的物品跟随鼠标 */
function updatePackHeld(){
  if(!packHeld) return;
  if(!held){ packHeld.style.display = 'none'; packHeld.textContent = ''; return; }
  const d = itemDef(held.id);
  packHeld.textContent = d ? d.icon + (held.n > 1 ? '×' + held.n : '') : '';
  packHeld.style.display = 'block';
}
/* 开关背包 */
function togglePack(open){
  const want = (open === undefined) ? !packOpen : !!open;
  if(want === packOpen) return;
  packOpen = want;
  if(packOpen){
    if(shopOpen) toggleShop(false);            /* 背包与商店互斥 */
    refreshPackGrid();
    if(packEl) packEl.classList.add('open');
  }else{
    if(packEl) packEl.classList.remove('open');
    packDropHeld();                 /* 关面板时手上的东西放回背包 */
    hidePackTip();
  }
}
if(packMask) packMask.addEventListener('mousedown', e=>{ e.preventDefault(); packDropHeld(); });
document.addEventListener('mousemove', e=>{
  if(!held || !packHeld) return;
  packHeld.style.left = e.clientX + 'px';
  packHeld.style.top  = e.clientY + 'px';
});

/* --- 木箱面板（复用背包格子样式；打开时游戏时间冻结） --- */
const chestEl   = document.getElementById('chest');
const chestMask = document.getElementById('chestMask');
const chestGrid = document.getElementById('chestGrid');
const chestInv  = document.getElementById('chestInv');
const chestInfo = document.getElementById('chestInfo');
let chestOpen = false;          /* 木箱面板是否打开 */
let openChest = null;           /* 当前打开的木箱（buildings 里的那一条） */
/* 造木箱格子 + 背包格子 */
function buildChestGrid(){
  if(chestGrid && chestGrid.appendChild){
    chestGrid.innerHTML = '';
    for(let i=0; i<CONFIG.BUILD.CHEST_SLOTS; i++){
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.innerHTML = '<span class="k"></span><span class="ic"></span><span class="n"></span>';
      cell.addEventListener('mousedown', e=>{ e.preventDefault(); chestClick(i); });
      chestGrid.appendChild(cell);
    }
  }
  if(chestInv && chestInv.appendChild){
    chestInv.innerHTML = '';
    for(let i=0; i<CONFIG.INVENTORY.SLOTS; i++){
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.innerHTML = '<span class="k"></span><span class="ic"></span><span class="n"></span>';
      cell.addEventListener('mousedown', e=>{ e.preventDefault(); chestInvClick(i); });
      chestInv.appendChild(cell);
    }
  }
}
/* 把木箱和背包的内容刷到格子上 */
function refreshChestGrid(){
  if(chestInfo) chestInfo.textContent = openChest
    ? ('已用 ' + chestUsed() + '/' + CONFIG.BUILD.CHEST_SLOTS + ' 格')
    : '';
  const fill = (grid, arr) => {
    if(!grid || !grid.children) return;
    const cells = grid.children;
    for(let i=0; i<cells.length; i++){
      const c = cells[i];
      if(!c || typeof c.querySelector !== 'function') continue;
      const s = arr ? arr[i] : null;
      const d = s ? itemDef(s.id) : null;
      const ic = c.querySelector('.ic'), n = c.querySelector('.n');
      if(ic) ic.textContent = d ? d.icon : '';
      if(n)  n.textContent  = (s && s.n > 1) ? String(s.n) : '';
    }
  };
  fill(chestGrid, openChest ? openChest.slots : null);
  fill(chestInv, inv);
}
function chestUsed(){
  if(!openChest || !openChest.slots) return 0;
  return openChest.slots.filter(s => s).length;
}
/* 附近最近的那个木箱 */
function chestNear(){
  let best = null, bd = Infinity;
  for(const b of buildings){
    if(b.type !== 'chest') continue;
    const d = tileCenterDist(b.tx, b.ty);
    if(d < bd){ bd = d; best = b; }
  }
  if(best && bd <= CONFIG.INTERACT.RANGE_TILES) return best;
  return null;
}
/* 开关木箱面板 */
function toggleChest(open){
  const want = (open === undefined) ? !chestOpen : !!open;
  if(want === chestOpen) return;
  chestOpen = want;
  if(chestOpen){
    if(packOpen) togglePack(false);
    if(shopOpen) toggleShop(false);
    refreshChestGrid();
    if(chestEl) chestEl.classList.add('open');
  }else{
    openChest = null;
    if(chestEl) chestEl.classList.remove('open');
  }
}
/* 点木箱格：把这堆东西取回背包（背包放不下就放不进去，东西不会消失） */
function chestClick(i){
  if(!openChest || !openChest.slots) return;
  const s = openChest.slots[i];
  if(!s) return;
  if(!canFit(s.id, s.n)){ toast('背包放不下' + itemDef(s.id).name); return; }
  addItem(s.id, s.n);
  openChest.slots[i] = null;
  refreshChestGrid();
  updateStats();
}
/* 点背包格：把这堆东西存进木箱（木箱满了就只存一部分，剩下的留在背包，东西不会消失） */
function chestInvClick(i){
  if(!openChest || !openChest.slots) return;
  const s = inv[i];
  if(!s) return;
  const d = itemDef(s.id);
  const lim = stackLimit(s.id);
  let left = s.n;
  /* 先并进已有的同类堆 */
  for(let k=0; k<openChest.slots.length && left>0; k++){
    const c = openChest.slots[k];
    if(c && c.id === s.id && c.n < lim){
      const take = Math.min(lim - c.n, left);
      c.n += take; left -= take;
    }
  }
  /* 再放进空格 */
  for(let k=0; k<openChest.slots.length && left>0; k++){
    if(openChest.slots[k]) continue;
    const take = d && d.stack ? Math.min(lim, left) : 1;
    openChest.slots[k] = {id:s.id, n:take};
    left -= take;
  }
  if(left <= 0) inv[i] = null;         /* 全部存进去了 */
  else s.n = left;                      /* 木箱装不下，剩下的留在背包 */
  refreshChestGrid();
  updateStats();
}

/* --- 商店面板（DOM 覆盖层；打开时游戏时间冻结） --- */
const shopEl   = document.getElementById('shop');
const shopMask = document.getElementById('shopMask');
const shopTabs = document.getElementById('shopTabs');
const shopBody = document.getElementById('shopBody');
const shopGold = document.getElementById('shopGold');
const shopSeason = document.getElementById('shopSeason');
let shopOpen = false;          /* 商店是否打开（打开时 update() 整体冻结 → 时间停住） */
let shopTab  = 'buy';          /* 当前页签：'buy' 购买 / 'sell' 出售 */

/* 金币跳动：商店面板里的金币数字也弹一下 */
function pulseShopGold(){
  if(!shopGold || !shopGold.style) return;
  shopGold.style.animation = 'none';
  setTimeout(()=>{ if(shopGold && shopGold.style) shopGold.style.animation = ''; }, 20);
  shopGold.style.animation = 'goldBump ' + CONFIG.SHOP.GOLD_PULSE_MS + 'ms ease-out';
}
/* 画一条商品行 */
function shopRow(icon, name, sub, priceHtml, buttons){
  const row = document.createElement('div');
  row.className = 'srow';
  const ic = document.createElement('span'); ic.className = 'ic'; ic.textContent = icon;
  const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = name;
  if(sub){
    const em = document.createElement('em'); em.textContent = sub; nm.appendChild(em);
  }
  const pr = document.createElement('span'); pr.className = 'pr'; pr.innerHTML = priceHtml;
  row.appendChild(ic); row.appendChild(nm); row.appendChild(pr);
  for(const b of buttons){
    const btn = document.createElement('button');
    btn.className = 'btn' + (b.off ? ' off' : '');
    btn.textContent = b.label;
    btn.addEventListener('click', e=>{ e.preventDefault(); b.fn(); });
    row.appendChild(btn);
  }
  return row;
}
/* 价格文字 + 浮动标记 */
function priceHtml(id){
  const t = priceTrend(id);
  const cls = (t === '↑') ? 'up' : (t === '↓' ? 'dn' : '');
  return priceOf(id) + ' 💰<span class="' + cls + '">' + t + '</span>';
}
/* 购买页签 */
function renderShopBuy(){
  if(!shopBody) return;
  for(const entry of CONFIG.SHOP.BUY){
    const id = entry.id;
    const up = (id === 'can_upgrade');
    const d = up ? null : itemDef(id);
    if(!up && !d) continue;
    const price = priceOf(id);
    let name, sub, off = false, label = '购买', fn;
    if(up){
      const maxed = canLevel >= CONFIG.SHOP.CAN_MAX_LEVEL;
      const next = Math.min(CONFIG.WATER_CAN.MAX_CAPACITY, canCapacity() + CONFIG.WATER_CAN.UPGRADE_STEP);
      name = '水壶扩容 Lv' + canLevel + ' → Lv' + (canLevel + 1);
      sub  = maxed ? '已满级' : ('容量 ' + canCapacity() + ' → ' + next);
      off = maxed || (gold < price);
      label = maxed ? '已满级' : (gold < price ? '金币不够' : '升级');
      fn = ()=>{ shopBuyClick(id); };
    }else{
      const owned = toolOwned(id);
      name = d.name;
      if(d.kind === 'tool')      sub = '工具 · 一次性';
      else if(d.kind === 'seed'){ const cd = cropDef(d.crop); sub = cd.season + '季 · ' + cd.days + '天'; }
      else sub = '';
      off = owned || (gold < price);
      label = owned ? '已拥有' : (gold < price ? '金币不够' : '购买');
      fn = ()=>{ shopBuyClick(id); };
    }
    shopBody.appendChild(shopRow(d ? d.icon : '💧', name, sub, priceHtml(id),
      [{label:label, off:off, fn:fn}]));
  }
}
/* 出售页签：列出背包里所有可卖的物品 */
function renderShopSell(){
  if(!shopBody) return;
  const ids = Object.keys(CONFIG.ITEMS).filter(id => isSellable(id) && countItem(id) > 0);
  if(!ids.length){
    const e = document.createElement('div');
    e.className = 'sempty';
    e.textContent = '背包里没有可以卖的东西（作物和材料才能卖）';
    shopBody.appendChild(e);
    return;
  }
  for(const id of ids){
    const d = itemDef(id);
    const n = countItem(id), unit = priceOf(id);
    const total = unit * n;
    const row = shopRow(d.icon, d.name + ' ×' + n, '', priceHtml(id) + '　共 ' + total + ' 💰', [
      {label:'卖 1', off:false, fn:()=>{ sellItem(id, 1); }},
      {label:'全卖', off:false, fn:()=>{ sellItem(id, n); }}
    ]);
    shopBody.appendChild(row);
  }
}
/* 刷新商店面板 */
function renderShop(){
  if(shopGold) shopGold.textContent = '💰 ' + gold + ' 金币';
  if(shopSeason) shopSeason.textContent = seasonName() + '季 价格 ×' + seasonCoef().toFixed(2) + '　';
  if(shopTabs && shopTabs.children){
    for(const t of shopTabs.children){
      const on = (t.getAttribute && t.getAttribute('data-tab') === shopTab);
      t.className = 'tab' + (on ? ' on' : '');
    }
  }
  if(!shopBody) return;
  shopBody.innerHTML = '';
  if(shopTab === 'buy') renderShopBuy();
  else renderShopSell();
}
/* 点「购买」按钮：先挡掉买不了的情况（按钮虽然置灰，点一下也给提示） */
function shopBuyClick(id){
  if(id === 'can_upgrade'){
    if(canLevel >= CONFIG.SHOP.CAN_MAX_LEVEL){ toast('水壶已经是最大容量了'); return false; }
    const p = priceOf(id);
    if(gold < p){ toast('金币不够（还差 ' + (p - gold) + '）'); return false; }
    return upgradeCan();
  }
  const d = itemDef(id);
  if(!d) return false;
  if(toolOwned(id)){ toast('已经有' + d.name + '了'); return false; }
  const p = priceOf(id);
  if(gold < p){ toast('金币不够（还差 ' + (p - gold) + '）'); return false; }
  if(!canFit(id, 1)){ toast('背包满了，装不下' + d.name); return false; }
  return buyItem(id);
}
/* 开关商店 */
function toggleShop(open){
  const want = (open === undefined) ? !shopOpen : !!open;
  if(want === shopOpen) return false;
  if(want && !nearShop()){ toast('走近商店摊才能交易'); return false; }
  shopOpen = want;
  if(shopOpen){
    if(packOpen) togglePack(false);            /* 背包与商店互斥 */
    renderShop();
    if(shopEl) shopEl.classList.add('open');
  }else{
    if(shopEl) shopEl.classList.remove('open');
  }
  return true;
}
if(shopMask) shopMask.addEventListener('mousedown', e=>{ e.preventDefault(); toggleShop(false); });
if(shopTabs) shopTabs.addEventListener('click', e=>{
  const t = e.target;
  if(!t || !t.getAttribute) return;
  const tab = t.getAttribute('data-tab');
  if(!tab || tab === shopTab) return;
  shopTab = tab;
  renderShop();
});

/* 3×5 点阵字库（像素风 HUD 文字，缩放后依然锐利） */
const FONT = {
  '0':['111','101','101','101','111'],'1':['010','110','010','010','111'],
  '2':['111','001','111','100','111'],'3':['111','001','111','001','111'],
  '4':['101','101','111','001','001'],'5':['111','100','111','001','111'],
  '6':['111','100','111','101','111'],'7':['111','001','010','010','010'],
  '8':['111','101','111','101','111'],'9':['111','101','111','001','111'],
  'F':['111','100','111','100','100'],'P':['110','101','110','100','100'],
  'S':['111','100','111','001','111'],'V':['101','101','101','101','010'],
  'v':['101','101','101','101','010'],
  'H':['101','101','111','101','101'],
  'Z':['111','001','010','100','111'],'.':['000','000','000','000','010'],
  '-':['000','000','111','000','000'],' ':['000','000','000','000','000']
};
const GLYPH_W = 3, GLYPH_H = 5;
/* HUD 用到的系统字体（emoji / 中文；不引入任何外部字体文件） */
const FONT_EMOJI = '"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
const FONT_CJK   = '"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif';
function drawText(g, text, x, y, scale, color){
  g.fillStyle = color;
  let cx = x;
  for(const raw of String(text)){
    const glyph = FONT[raw.toUpperCase()] || FONT[raw] || FONT[' '];
    for(let r=0;r<GLYPH_H;r++){
      const row = glyph[r];
      for(let c=0;c<GLYPH_W;c++)
        if(row[c] === '1') g.fillRect(cx + c*scale, y + r*scale, scale, scale);
    }
    cx += (GLYPH_W + 1) * scale;
  }
  return cx;
}
function drawUI(g){
  /* 鼠标指向的瓦片高亮（半透明白框） */
  if(hover.tx >= 0 && hover.ty >= 0 && hover.tx < MAP_W && hover.ty < MAP_H){
    const hx = hover.tx*TILE - cam.x, hy = hover.ty*TILE - cam.y;
    g.strokeStyle = 'rgba(255,255,255,0.55)';
    g.lineWidth = 2;
    g.strokeRect(hx + 1, hy + 1, TILE - 2, TILE - 2);
  }
  /* FPS + 版本 */
  const scale = 2, pad = 6;
  const l1 = 'FPS ' + String(Math.round(fps)).padStart(2,' ');
  const l2 = CONFIG.VERSION + ' ' + CONFIG.TARGET_FPS + 'HZ';
  const charW = (GLYPH_W + 1) * scale;                 /* 每个字形占位（含 1px 字距） */
  const lineW = Math.max(l1.length, l2.length) * charW;
  const boxW = lineW + pad*2, boxH = GLYPH_H*scale*2 + pad*2 + 4;
  g.fillStyle = CONFIG.COLORS.hudBg; g.fillRect(8, 8, boxW, boxH);
  g.fillStyle = CONFIG.COLORS.hudBorder;
  g.fillRect(8, 8, boxW, 1); g.fillRect(8, 8+boxH-1, boxW, 1);
  g.fillRect(8, 8, 1, boxH);   g.fillRect(8+boxW-1, 8, 1, boxH);
  drawText(g, l1, 8+pad, 8+pad, scale, CONFIG.COLORS.hudAccent);
  drawText(g, l2, 8+pad, 8+pad + GLYPH_H*scale + 4, scale, CONFIG.COLORS.hudText);

  /* 左上角：金币 + 背包提示（资源计数已全部移入背包） */
  g.textBaseline = 'top'; g.textAlign = 'left';
  g.font = '15px ' + FONT_EMOJI;  const goldIconW = g.measureText('💰').width;
  /* 金币跳动：买卖后数字弹一下，并飘出 ±N（用 performance.now()，商店打开时照样动） */
  const gp = performance.now() - goldPulseAt;
  const pulse = (gp >= 0 && gp < CONFIG.SHOP.GOLD_PULSE_MS) ? gp / CONFIG.SHOP.GOLD_PULSE_MS : -1;
  const goldPre = '金币 ', goldPost = '　[Tab] 背包 ' + invUsed() + '/' + CONFIG.INVENTORY.SLOTS;
  const DELTA_W = 34;                       /* 右侧预留飘字位 */
  g.font = '13px ' + FONT_CJK;
  const preW = g.measureText(goldPre).width;
  const numW = g.measureText(String(gold)).width;
  const postW = g.measureText(goldPost).width;
  const goldTxtW = preW + numW + postW + DELTA_W;
  const rowW = Math.ceil(goldIconW + 4 + goldTxtW) + 16, rowH = 24, rowY = 8 + boxH + 6;
  g.fillStyle = CONFIG.COLORS.hudBg; g.fillRect(8, rowY, rowW, rowH);
  g.fillStyle = CONFIG.COLORS.hudBorder;
  g.fillRect(8, rowY, rowW, 1); g.fillRect(8, rowY+rowH-1, rowW, 1);
  g.fillRect(8, rowY, 1, rowH); g.fillRect(8+rowW-1, rowY, 1, rowH);
  g.font = '15px ' + FONT_EMOJI; g.fillStyle = CONFIG.COLORS.hudAccent;
  g.fillText('💰', 16, rowY + 4);
  const goldNumX = 16 + goldIconW + 4 + preW;
  g.font = '13px ' + FONT_CJK; g.fillStyle = CONFIG.COLORS.hudText;
  g.fillText(goldPre, 16 + goldIconW + 4, rowY + 5);
  /* 数字本体：跳动时放大并变色 */
  g.save();
  g.translate(goldNumX, rowY + 5);
  if(pulse >= 0){
    const s = 1 + 0.45 * Math.sin(Math.PI * pulse);
    g.scale(s, s);
    g.fillStyle = goldDelta >= 0 ? '#7ee08a' : '#ff9a8a';
  }
  g.fillText(String(gold), 0, 0);
  g.restore();
  g.fillStyle = CONFIG.COLORS.hudText;
  g.fillText(goldPost, goldNumX + numW, rowY + 5);
  /* 飘字：+N / -N 在右侧往上飘 */
  if(pulse >= 0){
    g.font = '12px ' + FONT_CJK;
    g.globalAlpha = Math.max(0, 1 - pulse * 0.8);
    g.fillStyle = goldDelta >= 0 ? '#7ee08a' : '#ff9a8a';
    g.textAlign = 'right';
    g.fillText((goldDelta >= 0 ? '+' : '') + goldDelta, 8 + rowW - 8, rowY + 5 - 10 * pulse);
    g.globalAlpha = 1;
    g.textAlign = 'left';
  }

  /* 左上角：季节 · 第几天 · 时刻 · 天气 */
  const dA = seasonName() + ' · 第 ' + clock.day + ' 天 · ' + clockHM().s + ' · ';
  const dB = ' ' + weather.name;
  g.font = '13px ' + FONT_CJK;   const wA = g.measureText(dA).width;
  g.font = '15px ' + FONT_EMOJI; const wI = g.measureText(weather.icon).width;
  g.font = '13px ' + FONT_CJK;   const wB = g.measureText(dB).width;
  const dW = Math.ceil(wA + wI + wB) + 16, dH = 24, dY = rowY + rowH + 6;
  g.fillStyle = CONFIG.COLORS.hudBg; g.fillRect(8, dY, dW, dH);
  g.fillStyle = CONFIG.COLORS.hudBorder;
  g.fillRect(8, dY, dW, 1); g.fillRect(8, dY+dH-1, dW, 1);
  g.fillRect(8, dY, 1, dH); g.fillRect(8+dW-1, dY, 1, dH);
  g.textBaseline = 'top';
  g.font = '13px ' + FONT_CJK; g.fillStyle = CONFIG.COLORS.hudText;
  g.fillText(dA, 16, dY + 5);
  g.font = '15px ' + FONT_EMOJI; g.fillStyle = CONFIG.COLORS.hudAccent;
  g.fillText(weather.icon, 16 + wA, dY + 4);
  g.font = '13px ' + FONT_CJK; g.fillStyle = CONFIG.COLORS.hudText;
  g.fillText(dB, 16 + wA + wI, dY + 5);

  /* 建造模式：左侧配方面板 */
  if(buildMode) drawBuildPanel(g, dY + dH + 6);

  /* 底部中央：快捷栏 8 格（= 背包前 8 格），选中格高亮描边 */
  const hb = hotbarRect();
  g.fillStyle = CONFIG.COLORS.hudBg; g.fillRect(hb.x - 6, hb.y - 6, hb.w + 12, hb.h + 12);
  g.fillStyle = CONFIG.COLORS.hudBorder;
  g.fillRect(hb.x - 6, hb.y - 6, hb.w + 12, 1); g.fillRect(hb.x - 6, hb.y + hb.h + 5, hb.w + 12, 1);
  g.fillRect(hb.x - 6, hb.y - 6, 1, hb.h + 12); g.fillRect(hb.x + hb.w + 5, hb.y - 6, 1, hb.h + 12);
  for(let i=0;i<CONFIG.INVENTORY.HOTBAR;i++){
    const x = hb.x + i*(hb.cell + hb.gap);
    const on = (i === hotSel);
    const s = inv[i];
    g.fillStyle = on ? 'rgba(255,215,106,0.18)' : 'rgba(12,16,24,0.85)';
    g.fillRect(x, hb.y, hb.cell, hb.h);
    g.fillStyle = on ? CONFIG.COLORS.hudAccent : CONFIG.COLORS.hudBorder;
    g.fillRect(x, hb.y, hb.cell, 1); g.fillRect(x, hb.y + hb.h - 1, hb.cell, 1);
    g.fillRect(x, hb.y, 1, hb.h); g.fillRect(x + hb.cell - 1, hb.y, 1, hb.h);
    /* 快捷键编号 */
    drawText(g, String(i + 1), x + 3, hb.y + 3, 1, on ? CONFIG.COLORS.hudAccent : '#63758f');
    if(s){
      const d = itemDef(s.id);
      g.textBaseline = 'middle'; g.textAlign = 'center';
      g.font = '24px ' + FONT_EMOJI;
      g.fillText(d ? d.icon : '', x + hb.cell/2, hb.y + hb.h/2 - 1);
      g.textBaseline = 'top'; g.textAlign = 'left';
      if(d && d.id === 'can'){                    /* 水壶显示余量 */
        g.font = '11px ' + FONT_EMOJI;
        g.fillStyle = canWater > 0 ? CONFIG.COLORS.hudText : '#ff8a7a';
        g.fillText(canWater + '/' + canCapacity(), x + 3, hb.y + hb.h - 14);
      }else if(s.n > 1){                          /* 数量 */
        drawText(g, String(s.n), x + hb.cell - 6 - String(s.n).length*(GLYPH_W+1)*2, hb.y + hb.h - 13, 2, CONFIG.COLORS.hudAccent);
      }
    }
  }
  /* 快捷栏上方：当前选中物品 */
  const selItem = selectedItem();
  if(selItem){
    let cap = selItem.name;
    if(selItem.kind === 'seed'){ const cd = cropDef(selItem.crop); cap += '（' + cd.season + '季 · ' + cd.days + '天）'; }
    g.font = '13px ' + FONT_CJK; g.textAlign = 'center'; g.textBaseline = 'top';
    g.fillStyle = CONFIG.COLORS.hudText;
    g.fillText(cap, VIEW_W/2, hb.y - 22);
    g.textAlign = 'left';
  }

  /* 走到小屋附近 → 提示按 E 睡觉 */
  if(!shopOpen && sleepFx.phase === 'none' && nearHouse()){
    const hx = HOUSE_POS.x*TILE - cam.x, hy = HOUSE_POS.y*TILE - cam.y;
    const hint = '按 E 睡觉';
    g.font = '13px ' + FONT_CJK;
    const hw = g.measureText(hint).width;
    const px2 = hx + HOUSE_POS.w*TILE/2 - hw/2, py2 = hy + HOUSE_POS.h*TILE + 6;
    g.fillStyle = 'rgba(8,10,16,0.80)'; g.fillRect(px2 - 6, py2 - 3, hw + 12, 20);
    g.strokeStyle = CONFIG.COLORS.hudBorder;
    g.strokeRect(px2 - 6, py2 - 3, hw + 12, 20);
    g.fillStyle = CONFIG.COLORS.hudAccent; g.textAlign = 'left';
    g.fillText(hint, px2, py2);
  }
  /* 走到商店摊附近 → 提示按 E 交易 */
  if(!shopOpen && nearShop()){
    const sx = SHOP_POS.x*TILE - cam.x, sy = SHOP_POS.y*TILE - cam.y;
    const sw = SHOP_POS.w*TILE;
    const hint = '按 E 交易';
    g.font = '13px ' + FONT_CJK;
    const hw = g.measureText(hint).width;
    const hx = sx + sw/2 - hw/2, hy = sy + SHOP_POS.h*TILE + 6;
    g.fillStyle = 'rgba(8,10,16,0.80)'; g.fillRect(hx - 6, hy - 3, hw + 12, 20);
    g.strokeStyle = CONFIG.COLORS.hudBorder;
    g.strokeRect(hx - 6, hy - 3, hw + 12, 20);
    g.fillStyle = CONFIG.COLORS.hudAccent; g.textAlign = 'left';
    g.fillText(hint, hx, hy);
  }

  /* 左下角：体力条（低于 20 变红闪烁） */
  const sbW = 116, sbH = 11, sbX = 14, sbY = VIEW_H - 26;
  const low = stamina < CONFIG.STAMINA.LOW;
  const blink = low ? (0.45 + 0.55 * Math.abs(Math.sin(performance.now() / 130))) : 1;
  g.fillStyle = CONFIG.COLORS.hudBg; g.fillRect(sbX - 6, sbY - 19, sbW + 62, sbH + 25);
  g.fillStyle = CONFIG.COLORS.hudBorder;
  g.fillRect(sbX - 6, sbY - 19, sbW + 62, 1); g.fillRect(sbX - 6, sbY + sbH + 5, sbW + 62, 1);
  g.fillRect(sbX - 6, sbY - 19, 1, sbH + 25); g.fillRect(sbX + sbW + 55, sbY - 19, 1, sbH + 25);
  g.font = '13px ' + FONT_CJK; g.textAlign = 'left'; g.textBaseline = 'top';
  g.fillStyle = low ? 'rgba(255,120,100,' + blink.toFixed(2) + ')' : CONFIG.COLORS.hudText;
  g.fillText('体力', sbX, sbY - 16);
  g.fillStyle = 'rgba(8,11,18,0.90)'; g.fillRect(sbX, sbY, sbW, sbH);
  const ratio = staminaMax > 0 ? clamp(stamina / staminaMax, 0, 1) : 0;
  g.fillStyle = low ? 'rgba(255,86,70,' + blink.toFixed(2) + ')' : '#7ee08a';
  g.fillRect(sbX, sbY, Math.round(sbW * ratio), sbH);
  g.fillStyle = CONFIG.COLORS.hudBorder;
  g.fillRect(sbX, sbY, sbW, 1); g.fillRect(sbX, sbY + sbH - 1, sbW, 1);
  g.fillRect(sbX, sbY, 1, sbH); g.fillRect(sbX + sbW - 1, sbY, 1, sbH);
  g.fillStyle = low ? 'rgba(255,120,100,' + blink.toFixed(2) + ')' : CONFIG.COLORS.hudText;
  g.fillText(Math.ceil(stamina) + '/' + staminaMax, sbX + sbW + 6, sbY - 1);

  /* 体力耗尽：顶部提示该回家了 */
  if(stamina <= 0){
    const a = 0.55 + 0.45 * Math.sin(performance.now() / 220);
    const hint = '体力耗尽 · 回小屋按 E 睡觉';
    g.font = '14px ' + FONT_CJK;
    const hw = g.measureText(hint).width;
    g.fillStyle = 'rgba(8,10,16,0.75)';
    g.fillRect(VIEW_W/2 - hw/2 - 8, 12, hw + 16, 24);
    g.strokeStyle = 'rgba(255,110,90,0.8)';
    g.strokeRect(VIEW_W/2 - hw/2 - 8, 12, hw + 16, 24);
    g.textAlign = 'center'; g.textBaseline = 'top';
    g.fillStyle = 'rgba(255,130,110,' + clamp(a, 0.25, 1).toFixed(2) + ')';
    g.fillText(hint, VIEW_W/2, 16);
    g.textAlign = 'left';
  }
}

/* 睡觉淡入淡出 + 「第 N 天」标题（画在最上层，连网格线一起盖住） */
function drawSleepFx(g){
  const a = sleepAlpha();

    g.fillStyle = 'rgba(0,0,0,' + a.toFixed(3) + ')';
    g.fillRect(0, 0, VIEW_W, VIEW_H);
  }
  if(sleepFx.phase === 'title'){
    const S = CONFIG.SLEEP;
    const k = Math.min(sleepFx.t / (S.TITLE * 0.30), (S.TITLE - sleepFx.t) / (S.TITLE * 0.35), 1);

    g.textAlign = 'center'; g.textBaseline = 'top';
    g.font = '30px ' + FONT_CJK;
