<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b0d12}
  body{display:flex;align-items:center;justify-content:center;
       font-family:"Courier New",Consolas,monospace}
  /* 整数倍缩放 + 最近邻采样 = 像素永不糊、比例永不变形 */
  #game{
    display:block;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    background:#141922;
    box-shadow:0 0 0 2px #000,0 0 40px rgba(0,0,0,.6);
  }
  /* 右上角信息面板（不随画布缩放，保持文字清晰） */
  #stats{
    position:fixed;right:10px;top:10px;z-index:10;
    font:12px/1.7 Consolas,"Courier New",monospace;color:#cfe3ff;
    background:rgba(8,10,16,.74);border:2px solid #3d4a63;padding:6px 10px;
    white-space:pre;pointer-events:none;
  }
  #stats b{color:#ffd76a}
  /* 屏幕底部提示条：多条同时出现时向上排（容器底边固定，新增的一条排在最下） */
  #toasts{
    position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:20;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    pointer-events:none;
  }
  .toast{
    background:rgba(8,10,16,.88);border:2px solid #3d4a63;color:#e8f0ff;
    font:13px/1.4 Consolas,"Microsoft YaHei","PingFang SC",monospace;
    padding:5px 14px;box-shadow:0 3px 0 rgba(0,0,0,.45);
    white-space:nowrap;animation:toastFade 1.5s ease-out forwards;
  }
  @keyframes toastFade{
    0%  {opacity:1;transform:translateY(0)}
    70% {opacity:1;transform:translateY(0)}
    100%{opacity:0;transform:translateY(-6px)}
  }
</style>
</head>

/* === 2.世界 === */
const TILE_NAMES = ['草地','泥土','水','树','岩石','野花','小屋','商店','耕地','已浇水','空地'];

const MAP_W = CONFIG.MAP_W, MAP_H = CONFIG.MAP_H, TILE = CONFIG.TILE;
const VIEW_W = CONFIG.VIEW_W, VIEW_H = CONFIG.VIEW_H;
let map = new Uint8Array(MAP_W * MAP_H);
/* 作物层：每格最多一株作物；null = 空地
 * 记录字段：type 作物 id / stage 视觉阶段 0~3 / grown 累计生长天数（浇过水的天数）
 *           watered 当天是否浇过水 / mature 是否成熟 / dead 是否枯萎 */
let crops = new Array(MAP_W * MAP_H).fill(null);

/* 中央空地 + 建筑位置（全部由 CONFIG 推导） */
const FARM = {
  x: Math.floor((MAP_W - CONFIG.GEN.FARM_W) / 2),
  y: Math.floor((MAP_H - CONFIG.GEN.FARM_H) / 2),
  w: CONFIG.GEN.FARM_W, h: CONFIG.GEN.FARM_H
};
const HOUSE_POS = {x:FARM.x + 1, y:FARM.y, w:CONFIG.GEN.HOUSE_W, h:CONFIG.GEN.HOUSE_H};
const SHOP_POS  = {x:FARM.x + FARM.w - 1 - CONFIG.GEN.SHOP_W, y:FARM.y, w:CONFIG.GEN.SHOP_W, h:CONFIG.GEN.SHOP_H};
const SPAWN = {x:FARM.x + Math.floor(FARM.w/2), y:FARM.y + Math.floor(FARM.h/2) + 2};

const inFarm = (x,y)=> x>=FARM.x && x<FARM.x+FARM.w && y>=FARM.y && y<FARM.y+FARM.h;
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=> a+(b-a)*t;

/* --- 带种子的伪随机 --- */
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashSeed(x,y,s){
  let n = Math.imul(x|0, 374761393) + Math.imul(y|0, 668265263) + Math.imul(s|0, 1442695041);
  n = Math.imul(n ^ (n>>>13), 1274126177);
  return ((n ^ (n>>>16)) >>>0) / 4294967296;
}
function hash2(x,y){ return hashSeed(x,y,0); }

/* --- 平滑值噪声（用于成片的水塘） --- */
function valueNoise(x,y,freq,seed){
  const fx = x*freq, fy = y*freq;
  const x0 = Math.floor(fx), y0 = Math.floor(fy);
  const tx = fx-x0, ty = fy-y0;
  const sx = tx*tx*(3-2*tx), sy = ty*ty*(3-2*ty);
  const a = lerp(hashSeed(x0,y0,seed),   hashSeed(x0+1,y0,seed),   sx);
  const b = lerp(hashSeed(x0,y0+1,seed), hashSeed(x0+1,y0+1,seed), sx);
  return lerp(a,b,sy);
}
function fbm(x,y,seed){
  return valueNoise(x,y,CONFIG.GEN.NOISE_FREQ,  seed)  * 0.65 +
         valueNoise(x,y,CONFIG.GEN.NOISE_FREQ2, seed+1) * 0.35;
}

/* --- 地图生成 --- */
function genMap(seed){
  const rnd = mulberry32(seed);
  map.fill(T.GRASS);
  crops.fill(null);

  /* 1) 外围一圈水：天然边界 */
  for(let x=0;x<MAP_W;x++){ map[x] = T.WATER; map[(MAP_H-1)*MAP_W+x] = T.WATER; }
  for(let y=0;y<MAP_H;y++){ map[y*MAP_W] = T.WATER; map[y*MAP_W+MAP_W-1] = T.WATER; }

  /* 2) 噪声水塘（成片分布），中央空地除外 */
  for(let y=1;y<MAP_H-1;y++) for(let x=1;x<MAP_W-1;x++){
    if(inFarm(x,y)) continue;
    if(fbm(x,y,seed) > CONFIG.GEN.WATER_LEVEL) map[y*MAP_W+x] = T.WATER;
  }

  /* 3) 泥土斑块 */
  for(let k=0;k<CONFIG.GEN.DIRT_PATCHES;k++){
    const w = 2 + ((rnd()*3)|0), h = 2 + ((rnd()*2)|0);
    const px = 2 + ((rnd()*(MAP_W-w-4))|0), py = 2 + ((rnd()*(MAP_H-h-4))|0);
    for(let y=py;y<py+h;y++) for(let x=px;x<px+w;x++){
      if(inFarm(x,y)) continue;
      if(map[y*MAP_W+x] === T.GRASS) map[y*MAP_W+x] = T.DIRT;
    }
  }

  /* 4) 中央 12×12 强制空地（纯草地，无任何随机物件） */
  for(let y=FARM.y;y<FARM.y+FARM.h;y++)
    for(let x=FARM.x;x<FARM.x+FARM.w;x++) map[y*MAP_W+x] = T.GRASS;

  /* 5) 树 / 岩石 / 野花（只在草地上，且避开空地） */
  for(let y=1;y<MAP_H-1;y++) for(let x=1;x<MAP_W-1;x++){
    if(inFarm(x,y)) continue;
    const i = y*MAP_W+x;
    if(map[i] !== T.GRASS) continue;
    const r = rnd();
    if(r < CONFIG.GEN.TREE_CHANCE) map[i] = T.TREE;
    else if(r < CONFIG.GEN.TREE_CHANCE + CONFIG.GEN.ROCK_CHANCE) map[i] = T.ROCK;
    else if(r < CONFIG.GEN.TREE_CHANCE + CONFIG.GEN.ROCK_CHANCE + CONFIG.GEN.FLOWER_CHANCE) map[i] = T.FLOWER;
  }

  /* 6) 建筑（小屋 1 间 + 商店摊 1 个，放在空地内上缘） */
  for(let y=HOUSE_POS.y;y<HOUSE_POS.y+HOUSE_POS.h;y++)
    for(let x=HOUSE_POS.x;x<HOUSE_POS.x+HOUSE_POS.w;x++) map[y*MAP_W+x] = T.HOUSE;
  for(let y=SHOP_POS.y;y<SHOP_POS.y+SHOP_POS.h;y++)
    for(let x=SHOP_POS.x;x<SHOP_POS.x+SHOP_POS.w;x++) map[y*MAP_W+x] = T.SHOP;

  const cnt = [0,0,0,0,0,0,0,0];
  for(let i=0;i<map.length;i++) cnt[map[i]]++;
  let farmWild = 0;
  for(let y=FARM.y;y<FARM.y+FARM.h;y++) for(let x=FARM.x;x<FARM.x+FARM.w;x++){
    const t = map[y*MAP_W+x];
    if(t===T.TREE||t===T.ROCK||t===T.FLOWER) farmWild++;
  }
  console.log('[map] seed=' + seed + ' | grass=' + cnt[T.GRASS] + ' dirt=' + cnt[T.DIRT] +
    ' water=' + cnt[T.WATER] + ' tree=' + cnt[T.TREE] + ' rock=' + cnt[T.ROCK] +
    ' flower=' + cnt[T.FLOWER] + ' house=' + cnt[T.HOUSE] + ' shop=' + cnt[T.SHOP] +
    ' | farm ' + FARM.w + 'x' + FARM.h + ' wild-in-farm=' + farmWild);
  return cnt;
}

/* 等比缩放并居中：整数倍优先（像素锐利），窗口再小也不会变形/溢出 */
function fitCanvas(){
  const scale = Math.min(window.innerWidth / VIEW_W, window.innerHeight / VIEW_H);
  const s = CONFIG.INTEGER_SCALE && scale >= 1 ? Math.floor(scale) : scale;
  const finalScale = Math.max(CONFIG.MIN_SCALE, s);
  canvas.style.width  = Math.round(VIEW_W * finalScale) + 'px';
  canvas.style.height = Math.round(VIEW_H * finalScale) + 'px';
}

function drawGround(g,x0,y0,x1,y1){
  const C = CONFIG.TILE_COLORS;
  for(let ty=y0;ty<=y1;ty++){
    for(let tx=x0;tx<=x1;tx++){
      const x = tx*TILE - cam.x, y = ty*TILE - cam.y;
      const t = map[ty*MAP_W+tx];
      if(t === T.DIRT){
        g.fillStyle = C.dirt; g.fillRect(x,y,TILE,TILE);
        g.fillStyle = C.dirtLine;
        g.fillRect(x+1, y+5,  TILE-2, 4);
        g.fillRect(x+1, y+15, TILE-2, 4);
        g.fillRect(x+1, y+25, TILE-2, 4);
        g.fillStyle = C.dirtLine2; g.fillRect(x+1, y+2, TILE-2, 2);
      } else if(t === T.TILLED){                       /* 耕地：横向犁沟 */
        g.fillStyle = C.tilled; g.fillRect(x,y,TILE,TILE);
        g.fillStyle = C.tilledRidge;
        g.fillRect(x+1, y+4,  TILE-2, 3);
        g.fillRect(x+1, y+13, TILE-2, 3);
        g.fillRect(x+1, y+22, TILE-2, 3);
        g.fillStyle = C.tilledLine;
        g.fillRect(x+1, y+8,  TILE-2, 2);
        g.fillRect(x+1, y+17, TILE-2, 2);
        g.fillRect(x+1, y+26, TILE-2, 2);
      } else if(t === T.WATERED){                     /* 已浇水：湿土 + 反光 */
        g.fillStyle = C.watered; g.fillRect(x,y,TILE,TILE);
        g.fillStyle = C.tilledRidge;
        g.fillRect(x+1, y+4,  TILE-2, 3);
        g.fillRect(x+1, y+13, TILE-2, 3);
        g.fillRect(x+1, y+22, TILE-2, 3);
        g.fillStyle = C.wateredSheen;
        g.fillRect(x + 4 + ((hash2(tx,ty)*8)|0), y+9,  7, 2);
        g.fillRect(x + 18 - ((hash2(ty,tx)*7)|0), y+24, 6, 2);
      } else if(t === T.BARE){                         /* 空地：浅色裸土 */
        g.fillStyle = C.bare; g.fillRect(x,y,TILE,TILE);
        g.fillStyle = C.bareDot;
        g.fillRect(x + ((hash2(tx,ty)*26)|0), y + ((hash2(ty,tx)*26)|0), 3, 2);
        g.fillRect(x + ((hash2(tx*3+1,ty)*24)|0), y + ((hash2(tx,ty*5+2)*24)|0), 2, 2);
        g.fillStyle = C.bareStone;
        g.fillRect(x + 6 + ((hash2(tx*7,ty*3)*18)|0), y + 20, 3, 3);
      } else if(t === T.WATER){
        g.fillStyle = C.water; g.fillRect(x,y,TILE,TILE);
        const ph = ((animTime*3)|0) + tx*3 + ty*5;
        g.fillStyle = C.waterLight;

        g.fillStyle = C.grass; g.fillRect(x,y,TILE,TILE);
        const h1 = hash2(tx,ty), h2 = hash2(ty*7+3, tx*11+5), h3 = hash2(tx*13+1, ty*17+2);

/* --- 作物层：4 个视觉阶段（株高/叶片递增）+ 结果期果实 + 枯萎形态 --- */
function mixHex(a,b,t){
  const A = hexToRgb(a), B = hexToRgb(b);
  const c = [0,1,2].map(i => Math.round(A[i] + (B[i]-A[i]) * t));
  return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
}
function drawCrop(g,x,y,crop){
  const A = CONFIG.CROP_ART, def = cropDef(crop.type);
  const baseY = y + TILE - 7;                       /* 地表基线 */
  const cx = x + TILE/2;
  if(crop.dead){                                   /* 枯萎：褐茎 + 下垂黄叶 */
    g.fillStyle = A.DEAD_STEM; g.fillRect(cx-1, baseY-6, 3, 6);
    g.fillStyle = A.DEAD_LEAF;
    g.fillRect(cx-6, baseY-5, 6, 3);
    g.fillRect(cx+1, baseY-2, 5, 3);
    g.fillStyle = '#6b5730'; g.fillRect(cx-3, baseY-1, 6, 2);
    return;
  }
  const stage = crop.stage;
  const h = A.STAGE_H[stage], lw = A.LEAF_W[stage];
  g.fillStyle = def.leaf;                          /* 茎 */
  g.fillRect(cx-1, baseY-h, 3, h);
  g.fillStyle = def.leaf;                          /* 叶 */
  g.fillRect(cx-lw, baseY-h+1, lw, 3);
  g.fillRect(cx+1, baseY-h+Math.max(2, h>>1), lw, 3);
  if(stage >= 2){                                  /* 嫩叶高光 */
    g.fillStyle = mixHex(def.leaf, '#d8e86a', 0.35);
    g.fillRect(cx-lw+1, baseY-h+2, Math.max(1, lw-2), 2);
  }
  if(stage >= 3){                                  /* 结果期：果实 */
    const ripe = ripeness(crop);
    const col = mixHex(def.unripe, def.ripe, ripe);
    if(crop.type === 'radish'){                    /* 根菜：露出土面的红萝卜 */
      const r = 3 + Math.round(3*ripe);
      g.fillStyle = col; g.fillRect(cx-r, baseY-r+1, r*2, r+2);
      g.fillStyle = mixHex(col, '#ffffff', 0.35);
      g.fillRect(cx-r+1, baseY-r+2, 2, 2);
    }else if(crop.type === 'potato'){              /* 土豆：土里的褐色块 */
      const r = 4 + Math.round(2*ripe);
      g.fillStyle = col; g.fillRect(cx-r, baseY-r, r*2, r+1);
      g.fillStyle = mixHex(col, '#000000', 0.25);
      g.fillRect(cx-r+2, baseY-1, 3, 2);
    }else if(crop.type === 'tomato'){              /* 番茄：挂在茎上的红果 */
      const r = 3 + Math.round(3*ripe);
      const fx = cx + (ripe > 0.5 ? 5 : -5), fy = baseY - h + 6;
      g.fillStyle = col;
      g.beginPath(); g.arc(fx, fy, r, 0, Math.PI*2); g.fill();
      g.fillStyle = mixHex(col, '#ffffff', 0.4);
      g.fillRect(fx-1, fy-r+1, 2, 2);
    }else{                                          /* 南瓜：地上的大果子 */
      const r = 5 + Math.round(4*ripe);
      g.fillStyle = col;
      g.beginPath(); g.arc(cx, baseY-r+2, r, 0, Math.PI*2); g.fill();
      g.fillStyle = mixHex(col, '#000000', 0.22);
      g.fillRect(cx-1, baseY-r, 3, 4);
      g.fillStyle = mixHex(col, '#ffffff', 0.3);
      g.fillRect(cx-r+2, baseY-r+1, 3, 2);
    }
  }
  if(crop.mature){                                 /* 成熟：果实旁闪一下金光 */
    const bob = ((animTime*10)|0) % 6;
    g.fillStyle = 'rgba(255,215,106,' + (0.9 - bob*0.12).toFixed(2) + ')';
    g.fillRect(cx + 7, baseY - h - 5 + bob, 2, 2);
  }
}
function drawCrops(g,x0,y0,x1,y1){
  for(let ty=y0;ty<=y1;ty++){
    for(let tx=x0;tx<=x1;tx++){
      const c = crops[ty*MAP_W+tx];
      if(!c) continue;
      drawCrop(g, tx*TILE - cam.x, ty*TILE - cam.y, c);
    }
  }
}

/* --- 4.玩家 --- */
/* 站立帧（正面朝下）；第 18~22 行是腿部，走路帧替换为 LEGS_* */
const SPRITE_BASE = [
  '.....hhhhhh.....','....hhhhhhhh....','...hhhhhhhhhh...',
  '...hh......hh...','...hh......hh...','...ssssssssss...',
  '...ssssssssss...','...ss.ee..ee.ss.','...ssssssssss...',
  '....ssssssss....','.....ssssss.....','....bbbbbbbb....',
  '...bbbbbbbbbb...','..bbbbbbbbbbbb..','..bbbbbbbbbbbb..',
  '..sbbbbbbbbbbs..','..sbbbbbbbbbbs..','...bbbbbbbbbb...',
  '....pppppppp....','....pp....pp....','....pp....pp....',
  '....ss....ss....','....ss....ss....','................'
];
/* 正面走路：一腿迈出 */
const LEGS_FRONT = [
  '....pppppppp....','...ppp.....pp...','...pp...........',
  '...ss...........','................'
];
/* 侧面走路：一腿在前、一腿在后 */
const LEGS_SIDE = [
  '....pppppppp....','..ppp......pp...','..pp........pp..',
  '..ss........ss..','................'
];
const SPRITE_PALETTE = {
  h:CONFIG.COLORS.hair, s:CONFIG.COLORS.skin, e:CONFIG.COLORS.eye,
  b:CONFIG.COLORS.shirt, p:CONFIG.COLORS.pants, d:CONFIG.COLORS.shoe
};
/* 朝向：0=下 1=左 2=右 3=上 */
const DIR_NAMES = ['下','左','右','上'];
function eyeRow(dir){
  const r = new Array(CONFIG.PLAYER.BODY_W).fill('.');
  for(let c=3;c<=12;c++) r[c] = 's';
  if(dir === 0){ r[6]='e'; r[7]='e'; r[10]='e'; r[11]='e'; }
  else if(dir === 1){ r[5]='e'; r[6]='e'; }
  else if(dir === 2){ r[9]='e'; r[10]='e'; }
  return r;
}
/* 程序化生成 4 方向 × 2 帧 */
function buildFrames(){
  const frames = [];
  for(let dir=0; dir<4; dir++){
    frames[dir] = [];
    for(let step=0; step<2; step++){
      const rows = SPRITE_BASE.map(r=>r.split(''));
      if(step === 1){
        const legs = (dir===1 || dir===2) ? LEGS_SIDE : LEGS_FRONT;
        for(let i=0;i<legs.length;i++) rows[18+i] = legs[i].split('');
      }
      if(dir === 3){                       /* 背面：后脑勺，无五官 */
        rows[5] = '...hhhhhhhhhh...'.split('');
        rows[6] = '...hhhhhhhhhh...'.split('');
        rows[7] = '...hhhhhhhhhh...'.split('');
        rows[8] = '...hhhhhhhhhh...'.split('');
      } else {
        rows[7] = eyeRow(dir);
      }
      frames[dir][step] = rows;
    }
  }
  return frames;
}
const FRAMES = buildFrames();

const player = {
  x: SPAWN.x*TILE + TILE/2, y: SPAWN.y*TILE + TILE/2,   /* 精灵中心（浮点） */
  vx: 0, vy: 0,                                          /* 速度 */
  dir: 0,                                                /* 朝向 0=下 1=左 2=右 3=上 */
  animT: 0, frame: 0,                                    /* 动画：帧号 + 计时 */
  moving: false,
  tool: CONFIG.PLAYER.START_TOOL                         /* 当前工具（CONFIG.TOOLS 下标） */
};
function drawPlayer(g){
  const s = CONFIG.PLAYER.BODY_W, h = CONFIG.PLAYER.BODY_H;
  const rows = FRAMES[player.dir][player.frame];
  const ox = Math.round(player.x - cam.x - s/2);
  const oy = Math.round(player.y - cam.y - h/2);
  /* 影子 */
  g.fillStyle = CONFIG.COLORS.shadow;
  g.fillRect(ox + 2, oy + h - 2, s - 4, 2);
  /* 逐行合并同色段后 fillRect */
  for(let r=0;r<h;r++){
    const row = rows[r] || [];
    let c = 0;
    while(c < s){
      const ch = row[c];
      if(!ch || ch === '.'){ c++; continue; }
      let run = 1;
      while(c + run < s && row[c+run] === ch) run++;
      g.fillStyle = SPRITE_PALETTE[ch] || CONFIG.COLORS.skin;
      g.fillRect(ox + c, oy + r, run, 1);
      c += run;
    }
  }
}

/* === 5.系统 === */
/* --- 碰撞 --- */
function isSolid(tx,ty){
  if(tx<0 || ty<0 || tx>=MAP_W || ty>=MAP_H) return true;   /* 地图外 = 实心 */
  const t = map[ty*MAP_W+tx];
  return t===T.TREE || t===T.ROCK || t===T.WATER || t===T.HOUSE || t===T.SHOP;
}
/* 碰撞盒（脚部）：相对精灵中心下移 (BODY_H - BOX_H)/2 */
const BOX_OFF_Y = (CONFIG.PLAYER.BODY_H - CONFIG.PLAYER.BOX_H) / 2;
function boxHitsSolid(cx, cy){
  const hw = CONFIG.PLAYER.BOX_W/2, hh = CONFIG.PLAYER.BOX_H/2;
  const x0 = Math.floor((cx - hw) / TILE);
  const x1 = Math.floor((cx + hw - 0.001) / TILE);
  const y0 = Math.floor((cy - hh) / TILE);
  const y1 = Math.floor((cy + hh - 0.001) / TILE);
  for(let ty=y0;ty<=y1;ty++)
    for(let tx=x0;tx<=x1;tx++)
      if(isSolid(tx,ty)) return true;
  return false;
}
/* 分轴移动：先 X 再 Y；某轴被挡则该轴位移作废 → 天然沿墙滑动 */
function movePlayer(dx, dy){
  const by = player.y + BOX_OFF_Y;
  if(!boxHitsSolid(player.x + dx, by)) player.x += dx;
  if(!boxHitsSolid(player.x, by + dy)) player.y += dy;
}
/* 脱困：若当前位置与实心格重叠（例如存档落在障碍里）则向 8 个方向逐像素找最近的空位 */
function unstickPlayer(){
  const by = player.y + BOX_OFF_Y;
  for(let r=1;r<=TILE;r++){
    const offs=[[-r,0],[r,0],[0,-r],[0,r],[-r,-r],[r,-r],[-r,r],[r,r]];
    for(let i=0;i<offs.length;i++){
      if(!boxHitsSolid(player.x + offs[i][0], by + offs[i][1])){
        player.x += offs[i][0]; player.y += offs[i][1];
        return true;
      }
    }
  }
  return false;
}
function updatePlayer(dt){
  /* 兜底：位置与实心格重叠时先脱困（静止时也要处理，否则会被永久卡住） */
  if(boxHitsSolid(player.x, player.y + BOX_OFF_Y)) unstickPlayer();

  let ix = 0, iy = 0;
  if(keys['a'] || keys['arrowleft'])  ix -= 1;
  if(keys['d'] || keys['arrowright']) ix += 1;
  if(keys['w'] || keys['arrowup'])    iy -= 1;
  if(keys['s'] || keys['arrowdown'])  iy += 1;

  const moving = (ix !== 0 || iy !== 0);
  player.moving = moving;
  if(moving){
    /* 对角线归一化：斜向速度与直线一致，不加速 */
    const len = Math.hypot(ix, iy) || 1;
    ix /= len; iy /= len;
    const running = !!keys['shift'];
    const sp = CONFIG.PLAYER.SPEED * (running ? CONFIG.PLAYER.RUN_MULT : 1);
    player.vx = ix * sp; player.vy = iy * sp;
    /* 朝向：两轴同按时以最后按下的轴为准 */
    if(ix !== 0 && iy !== 0) player.dir = lastAxis === 'x' ? (ix<0?1:2) : (iy<0?3:0);
    else if(ix !== 0) player.dir = ix<0 ? 1 : 2;
    else player.dir = iy<0 ? 3 : 0;
    movePlayer(player.vx * dt, player.vy * dt);
    /* 摆腿动画：时间驱动帧切换 */
    player.animT += dt;
    const interval = 1 / CONFIG.PLAYER.ANIM_FPS;
    if(player.animT >= interval){ player.animT -= interval; player.frame ^= 1; }
  } else {
    player.vx = 0; player.vy = 0;
    player.frame = 0;         /* 静止回到站立帧 */
    player.animT = 0;
  }
}

/* --- 摄像机：跟随玩家（轻微缓动）+ 边界钳制 --- */
const cam = {x:0, y:0};
function updateCamera(dt){
  const tx = player.x - VIEW_W/2, ty = player.y - VIEW_H/2;
  const k = 1 - Math.exp(-CONFIG.CAMERA.SMOOTH * dt);
  cam.x += (tx - cam.x) * k;
  cam.y += (ty - cam.y) * k;
  const maxX = MAP_W*TILE - VIEW_W, maxY = MAP_H*TILE - VIEW_H;
  cam.x = clamp(cam.x, 0, maxX);
  cam.y = clamp(cam.y, 0, maxY);
}

/* --- 音效：Web Audio 实时合成（浏览器要求先有用户交互才允许播放） --- */
let actx = null;
function ensureAudio(){
  try{
    if(!actx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      actx = new AC();
    }
    if(actx.state === 'suspended') actx.resume();
    return actx;
  }catch(err){ return null; }
}
function playSfx(freq, type, dur, vol){
  const ac = ensureAudio();
  if(!ac) return false;
  const t0 = ac.currentTime;
  const osc = ac.createOscillator(), gain = ac.createGain();
  osc.type = type || CONFIG.AUDIO.TYPE;
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain); gain.connect(ac.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
  return true;
}

/* --- 临时资源计数（本轮不做背包，第 7 轮替换） --- */
const resources = {wood:0, stone:0};
function addResource(res, n){ resources[res] = (resources[res] || 0) + n; }

/* --- 提示条：屏幕底部，1.5 秒淡出，多条向上排 --- */
const toastBox = document.getElementById('toasts');
/* 把提示条锚定到画布下沿（而不是视口底部，避免掉进黑边） */
function layoutToasts(){
  if(!toastBox) return;
  const r = canvas.getBoundingClientRect();
  toastBox.style.left = (r.left + r.width / 2) + 'px';
  toastBox.style.bottom = Math.max(12, window.innerHeight - (r.top + r.height) + 16) + 'px';
}
function toast(msg){
  if(!toastBox) return;
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  el.style.animationDuration = CONFIG.INTERACT.TOAST_TIME + 's';
  toastBox.appendChild(el);                       /* 新的一条排在最下面，旧的被顶上去 */
  while(toastBox.children.length > CONFIG.INTERACT.TOAST_MAX)
    toastBox.removeChild(toastBox.firstChild);
  setTimeout(()=>{ if(el.parentNode) el.parentNode.removeChild(el); },
             CONFIG.INTERACT.TOAST_TIME * 1000);
}

/* --- 工具使用：距离判定 → 适用性判定 → 改地块 + 产出 + 音效 + 提示 --- */
function tileCenterDist(tx,ty){
  const dx = (tx+0.5)*TILE - player.x, dy = (ty+0.5)*TILE - player.y;
  return Math.hypot(dx, dy) / TILE;               /* 单位：格 */
}

/* --- 作物系统：播种 → 浇水 → 生长 → 收获 --- */
let canWater = CONFIG.WATER_CAN.CAPACITY;          /* 水壶剩余容量 */
function cropDef(type){ return CONFIG.CROPS.find(c => c.id === type); }
function cropAt(tx,ty){ return crops[ty*MAP_W+tx]; }
/* 视觉阶段 = 已生长的天数（封顶 3），每次浇水+1 */
function cropStage(c){ return Math.min(3, c.grown); }
/* 成熟度 0~1：长周期作物在结果期逐渐变红 */
function ripeness(c){
  const def = cropDef(c.type);
  if(c.mature) return 1;
  const start = Math.max(0, def.days - 3);
  return clamp((c.grown - start) / Math.max(1, def.days - start), 0, 1);
}
function sowCrop(tx,ty,type){
  const def = cropDef(type);
  const season = seasonName();
  if(season === '冬'){ toast('土地休眠了'); playSfx(120,'sawtooth',0.10,CONFIG.AUDIO.VOLUME*0.6); return false; }
  if(def.season !== season){ toast(def.name + '只能在' + def.season + '季种'); playSfx(120,'sawtooth',0.10,CONFIG.AUDIO.VOLUME*0.6); return false; }
  const i = ty*MAP_W+tx;
  if(map[i] !== T.TILLED){ toast('先用锄头把这块地开垦了'); playSfx(120,'sawtooth',0.10,CONFIG.AUDIO.VOLUME*0.6); return false; }
  crops[i] = {type:type, stage:0, grown:0, watered:false, mature:false, dead:false};
  toast('播下了' + def.name);
  playSfx(def.sfx || 523, CONFIG.AUDIO.TYPE, CONFIG.AUDIO.DUR, CONFIG.AUDIO.VOLUME);
  return true;
}
function waterTile(tx,ty){
  const i = ty*MAP_W+tx;
  if(canWater <= 0){ toast('水壶空了，去水边右键补水'); playSfx(120,'sawtooth',0.10,CONFIG.AUDIO.VOLUME*0.6); return false; }
  if(map[i] === T.WATERED){ toast('今天已经浇过水了'); playSfx(120,'sawtooth',0.10,CONFIG.AUDIO.VOLUME*0.6); return false; }
  if(map[i] !== T.TILLED){ toast('这里不能浇水'); playSfx(120,'sawtooth',0.10,CONFIG.AUDIO.VOLUME*0.6); return false; }
  canWater--;
  map[i] = T.WATERED;                       /* 视觉变深色 */
  const c = crops[i];
  if(c) c.watered = true;
  toast('浇好了水（壶里还剩 ' + canWater + '）');
  playSfx(784, CONFIG.AUDIO.TYPE, CONFIG.AUDIO.DUR, CONFIG.AUDIO.VOLUME);
  return true;
}
function harvestCrop(tx,ty){
  const i = ty*MAP_W+tx;
  const c = crops[i];
  const def = cropDef(c.type);
  addResource(c.type, 1);
  if(def.regrow > 0){                      /* 番茄：收获后回到阶段 3，继续结果 */
    c.grown = def.days - def.regrow;
    c.stage = 3; c.mature = false; c.watered = false;
    toast('收获 ' + def.name + ' ×1（还能再结）');
  }else{
    crops[i] = null;
    if(map[i] === T.WATERED) map[i] = T.TILLED;   /* 收获后地块变回耕地 */
    toast('收获 ' + def.name + ' ×1');
  }
  playSfx(1046, 'triangle', 0.16, CONFIG.AUDIO.VOLUME);
  return true;
}
function clearDeadCrop(tx,ty){
  const i = ty*MAP_W+tx;
  const def = cropDef(crops[i].type);
  crops[i] = null;
  if(map[i] === T.WATERED) map[i] = T.TILLED;
  toast('清理了枯萎的' + def.name);
  playSfx(988, CONFIG.AUDIO.TYPE, CONFIG.AUDIO.DUR, CONFIG.AUDIO.VOLUME);
  return true;
}
/* 附近有没有水（站在水边右键补水） */
function findWaterNear(){
  const px = Math.floor(player.x/TILE), py = Math.floor(player.y/TILE);
  const R = Math.ceil(CONFIG.WATER_CAN.REFILL_RANGE);
  for(let ty=py-R; ty<=py+R; ty++) for(let tx=px-R; tx<=px+R; tx++){
    if(tx<0 || ty<0 || tx>=MAP_W || ty>=MAP_H) continue;
    if(map[ty*MAP_W+tx] !== T.WATER) continue;
    if(tileCenterDist(tx,ty) <= CONFIG.WATER_CAN.REFILL_RANGE) return {tx:tx, ty:ty};
  }
  return null;
}
function refillCan(){
  if(canWater >= CONFIG.WATER_CAN.CAPACITY){ toast('水壶是满的'); return false; }
  if(!findWaterNear()){ toast('附近没有水源'); playSfx(140,'sawtooth',0.09,CONFIG.AUDIO.VOLUME*0.6); return false; }
  canWater = CONFIG.WATER_CAN.CAPACITY;
  toast('水壶补满了（' + canWater + '）');
  playSfx(880, 'sine', 0.12, CONFIG.AUDIO.VOLUME);
  return true;
}
/* 每天 6:00 结算：浇过水才生长；换季时非当季作物枯萎；浇水状态重置 */
function settleDay(){
  const newSeason = seasonName();          /* 此刻 clock.day 已经是新的一天 */
  let grew = 0, matured = 0, withered = 0, wateredTiles = 0;
  for(let i=0;i<crops.length;i++){
    const c = crops[i];
    if(!c || c.dead) continue;
    const def = cropDef(c.type);
    if(def.season !== newSeason){          /* 换季 → 非当季作物枯萎 */
      c.dead = true; c.stage = 0; withered++;
      continue;
    }
    if(map[i] === T.WATERED){              /* 当天浇过水 → 生长一天 */
      c.grown++;
      if(c.grown >= def.days) c.mature = true;
      grew++;
    }
    c.stage = cropStage(c);
    if(c.mature) matured++;
  }
  for(let i=0;i<map.length;i++){           /* 浇水状态每天重置 */
    if(map[i] === T.WATERED){ map[i] = T.TILLED; wateredTiles++; }
  }
  for(let i=0;i<crops.length;i++){ if(crops[i]) crops[i].watered = false; }
  if(withered) toast('换季了，' + withered + ' 株作物枯萎了');
  if(matured)  toast('有 ' + matured + ' 株作物成熟了');
  console.log('[settle] 第 ' + clock.day + ' 天结算：生长 ' + grew + ' 株，成熟 ' + matured +
              ' 株，枯萎 ' + withered + ' 株，重置浇水 ' + wateredTiles + ' 格');
  return {grew:grew, matured:matured, withered:withered};
}

function useTool(tx,ty){
  const tool = CONFIG.TOOLS[player.tool];
  if(tx < 0 || ty < 0 || tx >= MAP_W || ty >= MAP_H) return false;
  if(tileCenterDist(tx,ty) > CONFIG.INTERACT.RANGE_TILES){
    toast('太远了，走近一点再试试');
    playSfx(110, 'sawtooth', 0.10, CONFIG.AUDIO.VOLUME * 0.6);
    return false;
  }
  const i = ty*MAP_W + tx, t = map[i];
  const crop = crops[i];

  /* 1. 地里有作物 */
  if(crop){
    if(tool.id === 'can') return waterTile(tx,ty);           /* 照常浇水 */
    if(crop.dead){
      if(tool.id === 'sickle') return clearDeadCrop(tx,ty);
      toast('作物已经枯萎了，用镰刀清理');
      playSfx(120, 'sawtooth', 0.10, CONFIG.AUDIO.VOLUME * 0.6);
      return false;
    }
    if(crop.mature) return harvestCrop(tx,ty);                /* 成熟即可收获 */
    if(tool.kind === 'seed'){ toast('这里已经种了东西'); playSfx(120,'sawtooth',0.10,CONFIG.AUDIO.VOLUME*0.6); return false; }
    if(tool.id === 'sickle'){ toast('还没长好，再等几天'); playSfx(120,'sawtooth',0.10,CONFIG.AUDIO.VOLUME*0.6); return false; }
    toast('这块地里还有没熟的作物');
    playSfx(120, 'sawtooth', 0.10, CONFIG.AUDIO.VOLUME * 0.6);
    return false;
  }

  /* 2. 种子：只能种在耕地上 */
  if(tool.kind === 'seed') return sowCrop(tx,ty,tool.crop);

  /* 3. 水壶 */
  if(tool.id === 'can') return waterTile(tx,ty);

  /* 4. 普通工具：按地块类型处理 */
  if(tool.accepts.indexOf(t) < 0){
    toast(tool.name + '不能用在' + TILE_NAMES[t] + '上');
    playSfx(110, 'sawtooth', 0.10, CONFIG.AUDIO.VOLUME * 0.6);
    return false;
  }
  map[i] = tool.to;
  if(tool.out){
    addResource(tool.out.res, tool.out.n);
    toast('获得 ' + CONFIG.RESOURCES.NAME[tool.out.res] + ' ×' + tool.out.n);
  }else{
    toast(tool.msg);
  }
  playSfx(tool.sfx, CONFIG.AUDIO.TYPE, CONFIG.AUDIO.DUR, CONFIG.AUDIO.VOLUME);
  return true;
}

/* --- 时间系统：每 tick 推进；6:00 天亮 → 20:00 入夜 → 2:00 强制结束一天 --- */
const clock = {day:1, min:0, hold:0};          /* min = 从 6:00 起经过的游戏分钟 */
const DAY_SPAN_MIN = (24 - CONFIG.DAY_START_HOUR + CONFIG.DAY_END_HOUR) * 60;  /* 6:00→次日2:00 = 1200 分 */
const GAME_MIN_PER_SEC = DAY_SPAN_MIN / (CONFIG.DAY_MINUTES * 60);             /* 每现实秒推进多少游戏分钟 */
function clockHM(){
  const total = CONFIG.DAY_START_HOUR * 60 + clock.min;
  const h = Math.floor(total / 60) % 24, m = Math.floor(total % 60);
  return {h:h, m:m, s:String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0')};
}
function skyHour(){ return (CONFIG.DAY_START_HOUR + clock.min / 60) % 24; }
function seasonName(){
  const i = Math.floor((clock.day - 1) / CONFIG.DAYS_PER_SEASON) % CONFIG.SEASONS.length;
  return CONFIG.SEASONS[i];
}
function updateClock(dt){
  if(clock.hold > 0){                          /* 停在 2:00，等 hold 结束再翻到次日 6:00 */
    clock.hold -= dt;
    if(clock.hold <= 0){
      clock.hold = 0; clock.day++; clock.min = 0;
      settleDay();                            /* 每天 6:00 结算：生长 / 枯萎 / 浇水重置 */
      rollWeather();
      console.log('[time] 第 ' + clock.day + ' 天 ' + clockHM().s + ' · ' + seasonName() + ' · ' + weather.name);
    }
    return;
  }
  clock.min += dt * GAME_MIN_PER_SEC;
  if(clock.min >= DAY_SPAN_MIN){
    clock.min = DAY_SPAN_MIN;                  /* 停在 02:00 */
    clock.hold = CONFIG.DAY_END_HOLD;
    console.log('[time] 第 ' + clock.day + ' 天结束（' + clockHM().s + '）→ 次日 06:00');
  }
}

/* --- 天气：每天早晨随机（带权重） --- */
let weather = CONFIG.WEATHER[0];
function rollWeather(){
  let total = 0;
  for(const w of CONFIG.WEATHER) total += w.w;
  let r = Math.random() * total;
  let picked = CONFIG.WEATHER[CONFIG.WEATHER.length-1];
  for(const w of CONFIG.WEATHER){ r -= w.w; if(r < 0){ picked = w; break; } }
  weather = picked;
  spawnParticles();
  console.log('[weather] 第 ' + clock.day + ' 天天气：' + weather.name);
}

/* --- 天气粒子（画在画布坐标系里，随画布缩放自动对齐） --- */
let fxParticles = [];
let rainTimer = 0;
function newParticle(init){
  const rain = weather.id === 'rain';
  return {
    x: Math.random() * VIEW_W,
    y: init ? Math.random() * VIEW_H : -8 - Math.random() * (VIEW_H * 0.4),
    vx: rain ? -CONFIG.WEATHER_FX.RAIN_SPEED * 0.30 : (Math.random() * 26 - 13),
    vy: rain ? CONFIG.WEATHER_FX.RAIN_SPEED : CONFIG.WEATHER_FX.SNOW_SPEED * (0.6 + Math.random() * 0.8),
    len: rain ? 9 + Math.random() * 8 : 0,
    r: 1 + Math.random() * 1.7,
    a: 0.45 + Math.random() * 0.5
  };
}
function spawnParticles(){
  fxParticles = [];
  const n = weather.id === 'rain'  ? CONFIG.WEATHER_FX.RAIN_COUNT
          : weather.id === 'snow'  ? CONFIG.WEATHER_FX.SNOW_COUNT : 0;
  for(let i=0;i<n;i++) fxParticles.push(newParticle(true));
}
function updateWeather(dt){
  if(weather.id === 'rain'){                   /* 滴答声 */
    rainTimer -= dt;
    if(rainTimer <= 0){
      rainTimer = CONFIG.RAIN_TICK_MIN + Math.random() * (CONFIG.RAIN_TICK_MAX - CONFIG.RAIN_TICK_MIN);
      playSfx(2200 + Math.random() * 1500, 'square', 0.035, CONFIG.AUDIO.VOLUME * 0.30);
    }
  }
  for(const p of fxParticles){
    p.x += p.vx * dt; p.y += p.vy * dt;
    if(p.y > VIEW_H + 12){ p.y = -12; p.x = Math.random() * VIEW_W; }
    if(p.x < -14) p.x = VIEW_W + 12;
    if(p.x > VIEW_W + 14) p.x = -12;
  }
}
function drawWeather(g){
  if(!fxParticles.length) return;
  if(weather.id === 'rain'){
    g.strokeStyle = 'rgba(175,210,255,0.55)';
    g.lineWidth = 1;
    for(const p of fxParticles){
      g.beginPath();
      g.moveTo(p.x, p.y);
      g.lineTo(p.x + p.vx * 0.024, p.y + p.len);
      g.stroke();
    }
  }else if(weather.id === 'snow'){
    for(const p of fxParticles){
      g.fillStyle = 'rgba(255,255,255,' + p.a.toFixed(2) + ')';
      g.fillRect(p.x | 0, p.y | 0, (p.r * 2) | 0, (p.r * 2) | 0);
    }
  }
}

/* --- 昼夜染色 + 夜间暗角 --- */
function hexToRgb(h){
  let s = String(h).replace('#','');
  if(s.length === 3) s = s[0]+s[0]+s[1]+s[1]+s[2]+s[2];
  const n = parseInt(s, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function skyAt(h){
  const K = CONFIG.SKY;
  let i = 0;
  while(i < K.length - 2 && K[i+1].h <= h) i++;
  const a = K[i], b = K[i+1];
  const t = Math.min(1, Math.max(0, (h - a.h) / Math.max(1e-6, b.h - a.h)));
  const ca = hexToRgb(a.c), cb = hexToRgb(b.c);
  return {
    r: ca[0] + (cb[0]-ca[0])*t,  g: ca[1] + (cb[1]-ca[1])*t,  b: ca[2] + (cb[2]-ca[2])*t,
    a: a.a + (b.a - a.a) * t,   v: a.v + (b.v - a.v) * t
  };
}
const sky = {cur:{r:8,g:20,b:50,a:0.55,v:1}};
function updateSky(dt){
  const t = skyAt(skyHour());
  const k = 1 - Math.exp(-CONFIG.SKY_SMOOTH * dt);   /* 平滑过渡，杜绝闪变 */
  const c = sky.cur;
  c.r += (t.r - c.r) * k; c.g += (t.g - c.g) * k; c.b += (t.b - c.b) * k;
  c.a += (t.a - c.a) * k; c.v += (t.v - c.v) * k;
}
function drawAtmosphere(g){
  const c = sky.cur;
  if(c.a > 0.002){                                /* 整体染色 */
    g.fillStyle = 'rgb(' + (c.r|0) + ',' + (c.g|0) + ',' + (c.b|0) + ')';
    g.globalAlpha = c.a;
    g.fillRect(0, 0, VIEW_W, VIEW_H);
    g.globalAlpha = 1;
  }
  if(c.v > 0.002){                                /* 夜间暗角：以玩家为中心 */
    const px = player.x - cam.x, py = player.y - cam.y;
    const R = CONFIG.VIGNETTE.DAY_R + (CONFIG.VIGNETTE.NIGHT_R - CONFIG.VIGNETTE.DAY_R) * c.v;
    const A = CONFIG.VIGNETTE.NIGHT_A * c.v;
    const grd = g.createRadialGradient(px, py, R * 0.32, px, py, R);
    grd.addColorStop(0, 'rgba(0,0,0,0)');
    grd.addColorStop(1, 'rgba(0,0,0,' + A.toFixed(3) + ')');
    g.fillStyle = grd;
    g.fillRect(0, 0, VIEW_W, VIEW_H);
  }
}

/* --- 暂停：所有系统（时间/天气/角色/摄像机）一起冻结 --- */
let paused = false;
function setPaused(v){ paused = !!v; }

/* --- 输入 --- */
const keys = {};
let lastAxis = 'x';
window.addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  if(['arrowleft','arrowright','arrowup','arrowdown',' '].includes(k)) e.preventDefault();
  keys[k] = true;
  if(k==='a'||k==='arrowleft'||k==='d'||k==='arrowright') lastAxis = 'x';
  else if(k==='w'||k==='arrowup'||k==='s'||k==='arrowdown') lastAxis = 'y';
  /* 数字键 1~9 切换工具（1~5 工具，6~9 种子） */
  if(k >= '1' && k <= String(CONFIG.TOOLS.length)){
    player.tool = Number(k) - 1;
    ensureAudio();                 /* 键盘也算一次用户交互，解锁音频 */
  }
  if(k === CONFIG.PAUSE_KEY) setPaused(!paused);   /* 暂停/恢复 */
});
window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = false; });
window.addEventListener('blur', ()=>{ for(const k in keys) keys[k] = false; });

/* --- 鼠标 → 指向的瓦片（换算与 CSS 缩放无关） --- */
const mouse = {x:0, y:0, inside:false};
const hover = {tx:-1, ty:-1};
function toLogical(e){
  const r = canvas.getBoundingClientRect();
  return {x:(e.clientX - r.left) * (VIEW_W / r.width),
          y:(e.clientY - r.top)  * (VIEW_H / r.height)};
}
canvas.addEventListener('mousemove', e=>{
  const p = toLogical(e);
  mouse.x = p.x; mouse.y = p.y; mouse.inside = true;
  hover.tx = Math.floor((cam.x + p.x) / TILE);
  hover.ty = Math.floor((cam.y + p.y) / TILE);
});
canvas.addEventListener('mouseleave', ()=>{ mouse.inside = false; hover.tx = -1; hover.ty = -1; });
/* 左键 = 使用当前工具（这次点击同时作为音频解锁的用户交互）；右键 = 站在水边给水壶补水 */
canvas.addEventListener('mousedown', e=>{
  if(e.button === 2){ ensureAudio(); refillCan(); return; }
  if(e.button !== 0) return;
  ensureAudio();
  const p = toLogical(e);
  const tx = Math.floor((cam.x + p.x) / TILE);
  const ty = Math.floor((cam.y + p.y) / TILE);
  useTool(tx, ty);
});
canvas.addEventListener('contextmenu', e=> e.preventDefault());

/* === 6.UI === */
/* 3×5 点阵字库（像素风 HUD 文字，缩放后依然锐利） */
const FONT = {
  '0':['111','101','101','101','111'],'1':['010','110','010','010','111'],
  '2':['111','001','111','100','111'],'3':['111','001','111','001','111'],
  '4':['101','101','111','001','001'],'5':['111','100','111','001','111'],
  '6':['111','100','111','101','111'],'7':['111','001','010','010','010'],
  '8':['111','101','111','101','111'],'9':['111','101','111','001','111'],
  'F':['111','100','111','100','100'],'P':['110','101','110','100','100'],
  'S':['111','100','111','001','111'],'V':['101','101','101','101','010'],
  'v':['101','101','101','101','010'],
  'H':['101','101','111','101','101'],
  'Z':['111','001','010','100','111'],'.':['000','000','000','000','010'],
  '-':['000','000','111','000','000'],' ':['000','000','000','000','000']
};
const GLYPH_W = 3, GLYPH_H = 5;
/* HUD 用到的系统字体（emoji / 中文；不引入任何外部字体文件） */
const FONT_EMOJI = '"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
const FONT_CJK   = '"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif';
function drawText(g, text, x, y, scale, color){
  g.fillStyle = color;
  let cx = x;
  for(const raw of String(text)){
    const glyph = FONT[raw.toUpperCase()] || FONT[raw] || FONT[' '];
    for(let r=0;r<GLYPH_H;r++){
      const row = glyph[r];
      for(let c=0;c<GLYPH_W;c++)
        if(row[c] === '1') g.fillRect(cx + c*scale, y + r*scale, scale, scale);
    }
    cx += (GLYPH_W + 1) * scale;
  }
  return cx;
}
function drawUI(g){
  /* 鼠标指向的瓦片高亮（半透明白框） */
  if(hover.tx >= 0 && hover.ty >= 0 && hover.tx < MAP_W && hover.ty < MAP_H){
    const hx = hover.tx*TILE - cam.x, hy = hover.ty*TILE - cam.y;
    g.strokeStyle = 'rgba(255,255,255,0.55)';
    g.lineWidth = 2;
    g.strokeRect(hx + 1, hy + 1, TILE - 2, TILE - 2);
  }
  /* FPS + 版本 */
  const scale = 2, pad = 6;
  const l1 = 'FPS ' + String(Math.round(fps)).padStart(2,' ');
  const l2 = CONFIG.VERSION + ' ' + CONFIG.TARGET_FPS + 'HZ';
  const charW = (GLYPH_W + 1) * scale;                 /* 每个字形占位（含 1px 字距） */
  const lineW = Math.max(l1.length, l2.length) * charW;
  const boxW = lineW + pad*2, boxH = GLYPH_H*scale*2 + pad*2 + 4;
  g.fillStyle = CONFIG.COLORS.hudBg; g.fillRect(8, 8, boxW, boxH);
  g.fillStyle = CONFIG.COLORS.hudBorder;
  g.fillRect(8, 8, boxW, 1); g.fillRect(8, 8+boxH-1, boxW, 1);
  g.fillRect(8, 8, 1, boxH);   g.fillRect(8+boxW-1, 8, 1, boxH);
  drawText(g, l1, 8+pad, 8+pad, scale, CONFIG.COLORS.hudAccent);
  drawText(g, l2, 8+pad, 8+pad + GLYPH_H*scale + 4, scale, CONFIG.COLORS.hudText);

  /* 左上角：临时资源计数（本轮不做背包） */
  const R = CONFIG.RESOURCES;
  g.textBaseline = 'top'; g.textAlign = 'left';
  g.font = '15px ' + FONT_EMOJI;
  const resList = R.ORDER.map(r => ({icon:R.ICON[r], n:resources[r] || 0}));
  const iconWs = resList.map(it => g.measureText(it.icon).width);
  let rowW = 0;
  for(let i=0;i<resList.length;i++)
    rowW += iconWs[i] + 4 + String(resList[i].n).length*(GLYPH_W+1)*scale + 12;
  const rowH = 24, rowY = 8 + boxH + 6;
  g.fillStyle = CONFIG.COLORS.hudBg; g.fillRect(8, rowY, rowW, rowH);
  g.fillStyle = CONFIG.COLORS.hudBorder;
  g.fillRect(8, rowY, rowW, 1); g.fillRect(8, rowY+rowH-1, rowW, 1);
  g.fillRect(8, rowY, 1, rowH); g.fillRect(8+rowW-1, rowY, 1, rowH);
  let rx = 8 + 8;
  for(let i=0;i<resList.length;i++){
    g.font = '15px ' + FONT_EMOJI; g.fillStyle = CONFIG.COLORS.hudText;
    g.fillText(resList[i].icon, rx, rowY + 4);
    drawText(g, String(resList[i].n), rx + iconWs[i] + 4, rowY + 7, scale, CONFIG.COLORS.hudAccent);
    rx += iconWs[i] + 4 + String(resList[i].n).length*(GLYPH_W+1)*scale + 12;
  }

  /* 左上角：季节 · 第几天 · 时刻 · 天气 */
  const dA = seasonName() + ' · 第 ' + clock.day + ' 天 · ' + clockHM().s + ' · ';
  const dB = ' ' + weather.name;
  g.font = '13px ' + FONT_CJK;   const wA = g.measureText(dA).width;
  g.font = '15px ' + FONT_EMOJI; const wI = g.measureText(weather.icon).width;
  g.font = '13px ' + FONT_CJK;   const wB = g.measureText(dB).width;
  const dW = Math.ceil(wA + wI + wB) + 16, dH = 24, dY = rowY + rowH + 6;
  g.fillStyle = CONFIG.COLORS.hudBg; g.fillRect(8, dY, dW, dH);
  g.fillStyle = CONFIG.COLORS.hudBorder;
  g.fillRect(8, dY, dW, 1); g.fillRect(8, dY+dH-1, dW, 1);
  g.fillRect(8, dY, 1, dH); g.fillRect(8+dW-1, dY, 1, dH);
  g.textBaseline = 'top';
  g.font = '13px ' + FONT_CJK; g.fillStyle = CONFIG.COLORS.hudText;
  g.fillText(dA, 16, dY + 5);
  g.font = '15px ' + FONT_EMOJI; g.fillStyle = CONFIG.COLORS.hudAccent;
  g.fillText(weather.icon, 16 + wA, dY + 4);
  g.font = '13px ' + FONT_CJK; g.fillStyle = CONFIG.COLORS.hudText;
  g.fillText(dB, 16 + wA + wI, dY + 5);

  /* 右下角：当前工具（图标 + 名称 + 快捷键 + 水壶余量） */
  const tool = CONFIG.TOOLS[player.tool];
  const waterTxt = (tool.id === 'can') ? '💧' + canWater + '/' + CONFIG.WATER_CAN.CAPACITY : '';
  g.font = '20px ' + FONT_EMOJI; const iw = g.measureText(tool.icon).width;
  g.font = '14px ' + FONT_CJK;   const nw = g.measureText(tool.name).width;
  g.font = '12px ' + FONT_CJK;   const kw = g.measureText('(' + tool.key + ')').width;
  g.font = '12px ' + FONT_EMOJI; const ww = waterTxt ? g.measureText(waterTxt).width : 0;
  const tbW = Math.ceil(iw + nw + kw + ww + 34), tbH = 32;
  const tbX = VIEW_W - tbW - 10, tbY = VIEW_H - tbH - 10;
  g.fillStyle = CONFIG.COLORS.hudBg; g.fillRect(tbX, tbY, tbW, tbH);
  g.fillStyle = CONFIG.COLORS.hudBorder;
  g.fillRect(tbX, tbY, tbW, 1); g.fillRect(tbX, tbY+tbH-1, tbW, 1);
  g.fillRect(tbX, tbY, 1, tbH); g.fillRect(tbX+tbW-1, tbY, 1, tbH);
  g.textBaseline = 'top';
  g.font = '20px ' + FONT_EMOJI; g.fillStyle = CONFIG.COLORS.hudAccent;
  g.fillText(tool.icon, tbX + 8, tbY + 6);
  g.font = '14px ' + FONT_CJK; g.fillStyle = CONFIG.COLORS.hudText;
  g.fillText(tool.name, tbX + 8 + iw + 4, tbY + 9);
  g.font = '12px ' + FONT_CJK; g.fillStyle = CONFIG.COLORS.hudBorder;
  g.fillText('(' + tool.key + ')', tbX + 8 + iw + 4 + nw + 3, tbY + 10);
  if(waterTxt){
    g.font = '12px ' + FONT_EMOJI;
    g.fillStyle = canWater > 0 ? CONFIG.COLORS.hudText : '#ff8a7a';
    g.fillText(waterTxt, tbX + 8 + iw + 4 + nw + 3 + kw + 4, tbY + 10);
  }

  /* 左下角：种子栏（6~9），当前选中的高亮 */
  const seeds = CONFIG.TOOLS.filter(t => t.kind === 'seed');
  g.font = '18px ' + FONT_EMOJI;
  let sw = 0;
  for(const s of seeds) sw += g.measureText(s.icon).width + 26;
  const sbW = Math.ceil(sw) + 12, sbH = 30, sbX = 10, sbY = VIEW_H - sbH - 10;
  g.fillStyle = CONFIG.COLORS.hudBg; g.fillRect(sbX, sbY, sbW, sbH);
  g.fillStyle = CONFIG.COLORS.hudBorder;
  g.fillRect(sbX, sbY, sbW, 1); g.fillRect(sbX, sbY+sbH-1, sbW, 1);
  g.fillRect(sbX, sbY, 1, sbH); g.fillRect(sbX+sbW-1, sbY, 1, sbH);
  let sx = sbX + 6;
  for(const s of seeds){
    const on = (CONFIG.TOOLS[player.tool] === s);
    g.font = '18px ' + FONT_EMOJI;
    const iw2 = g.measureText(s.icon).width;
    if(on){
      g.fillStyle = 'rgba(255,215,106,0.20)';
      g.fillRect(sx-3, sbY+3, iw2+16, sbH-6);
    }
    g.fillStyle = on ? CONFIG.COLORS.hudAccent : CONFIG.COLORS.hudText;
    g.fillText(s.icon, sx, sbY + 6);
    g.font = '11px ' + FONT_CJK;
    g.fillStyle = on ? CONFIG.COLORS.hudAccent : CONFIG.COLORS.hudBorder;
    g.fillText(s.key, sx + iw2 + 2, sbY + 9);
    sx += iw2 + 26;
  }
}
const statsEl = document.getElementById('stats');
function updateStats(){
  const inMap = (hover.tx>=0 && hover.ty>=0 && hover.tx<MAP_W && hover.ty<MAP_H);
  const t = inMap ? TILE_NAMES[map[hover.ty*MAP_W+hover.tx]] : '-';
  const hc = inMap ? crops[hover.ty*MAP_W+hover.tx] : null;
  let cropInfo = '';
  if(hc){
    const d = cropDef(hc.type);
    cropInfo = '　' + d.icon + d.name + ' 阶段' + hc.stage + ' 生长' + hc.grown + '/' + d.days +
               (hc.dead ? ' <b>已枯萎</b>' : (hc.mature ? ' <b>已成熟</b>' : ''));
  }
  const spd = Math.round(Math.hypot(player.vx, player.vy));
  statsEl.innerHTML =
    '玩家 <b>' + player.x.toFixed(1) + ', ' + player.y.toFixed(1) + '</b>  格 ' +
    Math.floor(player.x/TILE) + ',' + Math.floor(player.y/TILE) + '\n' +
    '朝向 <b>' + DIR_NAMES[player.dir] + '</b>　速度 <b>' + spd + '</b> px/s　帧 ' + player.frame + '\n' +
    '光标 <b>' + hover.tx + ',' + hover.ty + '</b> ' + t + cropInfo + '\n' +
    '绘制瓦片 <b>' + visibleCount + '</b> / ' + (MAP_W*MAP_H) +
    ' (' + (visibleCount/(MAP_W*MAP_H)*100).toFixed(1) + '%)\n' +
    '工具 ' + CONFIG.TOOLS.map((t,i)=>
        (i===player.tool ? '<b>[' + t.key + ']' + t.icon + t.name + '</b>'
                         : ' ' + t.key + ' ' + t.icon + t.name)).join('　') + '\n' +
    '水壶 <b>' + canWater + '</b>/' + CONFIG.WATER_CAN.CAPACITY + '　右键站在水边补水\n' +
    '作物 ' + CONFIG.CROPS.map(c =>
        c.icon + c.name + '(' + c.season + c.days + '天' + (c.regrow ? '可再收' : '') + ')' +
        ' 种' + c.seedCost + '/售' + c.sell).join('　') + '\n' +
    '资源 ' + CONFIG.RESOURCES.ORDER.map(r =>
        CONFIG.RESOURCES.ICON[r] + ' ' + CONFIG.RESOURCES.NAME[r] + ' <b>' + (resources[r]||0) + '</b>').join('　') + '\n' +
    '时间 <b>' + seasonName() + ' · 第 ' + clock.day + ' 天 · ' + clockHM().s + '</b>　' +
        CONFIG.WEATHER.map(w=>w.icon+w.name).join(' ') + '\n' +
    '种子 <b>' + CONFIG.SEED + '</b>　WASD/方向键移动 · Shift 奔跑 · 数字键换工具 · 左键使用 · 右键补水 · P 暂停';
}

/* === 7.存档 === */
/* 本轮不做存档 */

/* === 8.主循环 === */
const FIXED_DT = 1 / CONFIG.TARGET_FPS;
let accumulator = 0;
let lastTime = performance.now();
let firstRenderDone = false;
const renderLog = {ground:false, objects:false, player:false, ui:false};
let animTime = 0, fps = 0, frameCount = 0, fpsTimer = 0, frameNo = 0, visibleCount = 0;

function update(dt){
  if(paused) return;                 /* 暂停：时间/天气/角色/摄像机全部冻结 */
  animTime += dt;
  updateClock(dt);                   /* 时间推进 */
  updateWeather(dt);                 /* 天气粒子 + 雨声 */
  updatePlayer(dt);
  updateCamera(dt);
  updateSky(dt);                     /* 昼夜色平滑过渡 */
}
function render(){
  ctx.imageSmoothingEnabled = false;
  /* 视锥裁剪：只绘制可见范围内的瓦片 */
  const x0 = Math.max(0, Math.floor(cam.x / TILE));
  const x1 = Math.min(MAP_W-1, Math.floor((cam.x + VIEW_W - 1) / TILE));
  const y0 = Math.max(0, Math.floor(cam.y / TILE));
  const y1 = Math.min(MAP_H-1, Math.floor((cam.y + VIEW_H - 1) / TILE));
  visibleCount = (x1-x0+1) * (y1-y0+1);

  if(!renderLog.ground){ renderLog.ground = true; console.log('[render] 1/4 drawGround'); }
  if(!renderLog.objects){ renderLog.objects = true; console.log('[render] 2/4 drawObjects'); }
  if(!renderLog.player){ renderLog.player = true; console.log('[render] 3/4 drawPlayer'); }
  if(!renderLog.ui){ renderLog.ui = true; console.log('[render] 4/4 drawUI'); }

  drawGround(ctx, x0, y0, x1, y1);
  drawSeasonOverlay(ctx, x0, y0, x1, y1);
  drawCrops(ctx, x0, y0, x1, y1);
  drawObjects(ctx, x0, y0, x1, y1);
  drawBuildings(ctx);
  drawPlayer(ctx);
  drawWeather(ctx);
  drawAtmosphere(ctx);
  drawUI(ctx);

  /* 网格线叠加 */
  if(CONFIG.GRID_OVERLAY){
    ctx.fillStyle = CONFIG.GRID_COLOR;
    for(let tx=x0;tx<=x1+1;tx++) ctx.fillRect(Math.round(tx*TILE - cam.x), 0, 1, VIEW_H);
    for(let ty=y0;ty<=y1+1;ty++) ctx.fillRect(0, Math.round(ty*TILE - cam.y), VIEW_W, 1);
  }
  if(!firstRenderDone){
    firstRenderDone = true;
    console.log('[render] 顺序确认: drawGround -> drawObjects -> drawPlayer -> drawUI');
  }
}
function loop(now){
  let frameTime = (now - lastTime) / 1000;
  lastTime = now;
  if(frameTime < 0) frameTime = 0;
  if(frameTime > CONFIG.MAX_FRAME_TIME) frameTime = CONFIG.MAX_FRAME_TIME;

  accumulator += frameTime;
  let steps = 0;
  while(accumulator >= FIXED_DT && steps < CONFIG.MAX_STEPS){
    update(FIXED_DT);
    accumulator -= FIXED_DT;
    steps++;
  }
  if(steps === CONFIG.MAX_STEPS) accumulator = 0;

  render();

  frameCount++; frameNo++;
  fpsTimer += frameTime;
  if(fpsTimer >= CONFIG.FPS_INTERVAL){
    fps = frameCount / fpsTimer;
    frameCount = 0; fpsTimer = 0;
    updateStats();
  }
  if(CONFIG.LOG_EVERY > 0 && frameNo % CONFIG.LOG_EVERY === 0){
    console.log('[map] tiles drawn ' + visibleCount + ' / ' + (MAP_W*MAP_H) +
      ' (' + (visibleCount/(MAP_W*MAP_H)*100).toFixed(1) + '%)  player(' +
      player.x.toFixed(0) + ',' + player.y.toFixed(0) + ')  seed ' + CONFIG.SEED);
  }
  requestAnimationFrame(loop);
}

/* --- 启动 --- */
genMap(CONFIG.SEED);
player.x = SPAWN.x*TILE + TILE/2;
player.y = SPAWN.y*TILE + TILE/2;
cam.x = clamp(player.x - VIEW_W/2, 0, MAP_W*TILE - VIEW_W);
cam.y = clamp(player.y - VIEW_H/2, 0, MAP_W*TILE - VIEW_H);
rollWeather();                         /* 第 1 天早晨的天气 */
const sky0 = skyAt(skyHour());
sky.cur = {r:sky0.r, g:sky0.g, b:sky0.b, a:sky0.a, v:sky0.v};
updateStats();
layoutToasts();
requestAnimationFrame(loop);

/* 调试钩子（CONFIG.DEBUG_HOOK 打开时才暴露） */
if(CONFIG.DEBUG_HOOK) window.__game = {player, cam, map, keys, CONFIG, useTool, toast, resources, layoutToasts,
  clock, sky, seasonName, clockHM, skyHour, skyAt, setPaused, paused:()=>paused,
  updateClock, updateWeather, updateSky, rollWeather, spawnParticles,
  get weather(){ return weather; }, set weather(v){ weather = v; },
  get fxParticles(){ return fxParticles; }, set fxParticles(v){ fxParticles = v; },
  get crops(){ return crops; }, set crops(v){ crops = v; },
  get canWater(){ return canWater; }, set canWater(v){ canWater = v; },
  sowCrop, waterTile, harvestCrop, clearDeadCrop, settleDay, refillCan, findWaterNear,
  cropDef, ripeness, cropStage, drawCrop, TILE_NAMES, T};
</script>
