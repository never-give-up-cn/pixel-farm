<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>TCP/IP 3D 封装产线 · IK 精准抓取</title>
  <style>
    body { margin: 0; overflow: hidden; background: #1a252f; font-family: 'Segoe UI', sans-serif; }
    #ui {
      position: absolute; top: 20px; left: 20px; color: white; z-index: 100;
      background: rgba(0,0,0,0.6); padding: 20px; border-radius: 12px;
      backdrop-filter: blur(8px); box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    h1 { margin: 0 0 10px 0; font-size: 20px; color: #00b894; }
    p { margin: 0 0 15px 0; font-size: 13px; color: #b2bec3; }
    button {
      padding: 10px 24px; font-size: 15px; cursor: pointer;
      background: #0984e3; color: white; border: none; border-radius: 6px;
      font-weight: bold; transition: all 0.2s;
    }
    button:hover { background: #74b9ff; }
    button:disabled { background: #636e72; cursor: not-allowed; }
    #status { margin-top: 12px; font-size: 14px; font-weight: 600; color: #dfe6e9; }
    .header-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin: 0 2px; }
    .tcp { background: #3498db; } .ip { background: #2ecc71; } .eth { background: #9b59b6; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="ui">
    <h1>TCP/IP 3D 封装产线</h1>
    <p>拖拽旋转视角 · 滚轮缩放</p>
    <button id="startBtn">开始运行</button>
    <div id="status">状态: 等待开始</div>
    <div id="headers" style="margin-top: 10px; font-size: 12px;"></div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ========== 场景初始化 ==========
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a252f);
    scene.fog = new THREE.Fog(0x1a252f, 25, 60);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(15, 15, 20);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 4, 0);
    controls.maxPolarAngle = Math.PI / 2.2;
    controls.minDistance = 8;
    controls.maxDistance = 50;
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // ========== 灯光系统 ==========
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 2);
    dirLight.position.set(10, 25, 15);
    dirLight.castShadow = true;
    dirLight.shadow.camera.left = -20;
    dirLight.shadow.camera.right = 20;
    dirLight.shadow.camera.top = 20;
    dirLight.shadow.camera.bottom = -20;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    scene.add(dirLight);

    const pointLight = new THREE.PointLight(0x00b894, 50, 20);
    pointLight.position.set(0, 8, 5);
    scene.add(pointLight);

    const gridHelper = new THREE.GridHelper(60, 60, 0x444444, 0x222222);
    gridHelper.position.y = -0.01;
    scene.add(gridHelper);

    // ========== 工具函数：文字纹理 ==========
    function createTextTexture(text, color) {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      
      ctx.fillStyle = color;
      ctx.fillRect(0, 0, 256, 256);
      
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 12;
      ctx.strokeRect(6, 6, 244, 244);
      
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 80px Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 128, 128);
      
      return new THREE.CanvasTexture(canvas);
    }

    // ========== 传送带 ==========
    const beltGroup = new THREE.Group();
    const beltMat = new THREE.MeshStandardMaterial({ color: 0x2d3748, roughness: 0.8 });
    const belt = new THREE.Mesh(new THREE.BoxGeometry(34, 0.4, 2.5), beltMat);
    belt.position.y = 0.15;          // 顶面 0.35，给夹爪下指留出净空
    belt.receiveShadow = true;
    beltGroup.add(belt);

    // 传送带纹理
    const beltTextures = [];
    for (let i = -16; i <= 16; i += 1) {
      const line = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.42, 2.5), new THREE.MeshStandardMaterial({ color: 0x1a202c }));
      line.position.set(i, 0.16, 0);
      beltGroup.add(line);
      beltTextures.push(line);
    }

    const rollGeo = new THREE.CylinderGeometry(0.6, 0.6, 2.6, 32);
    rollGeo.rotateX(Math.PI / 2);
    const rollMat = new THREE.MeshStandardMaterial({ color: 0x718096, metalness: 0.6, roughness: 0.3 });
    const rollL = new THREE.Mesh(rollGeo, rollMat); rollL.position.set(-17, 0.45, 0); rollL.castShadow = true; beltGroup.add(rollL);
    const rollR = new THREE.Mesh(rollGeo, rollMat); rollR.position.set(17, 0.45, 0); rollR.castShadow = true; beltGroup.add(rollR);

    const legGeo = new THREE.BoxGeometry(0.4, 1.45, 0.4);
    const legMat = new THREE.MeshStandardMaterial({ color: 0x4a5568 });
    for (let i = -1; i <= 1; i += 2) {
      for (let j = -1; j <= 1; j += 2) {
        const leg = new THREE.Mesh(legGeo, legMat);
        leg.position.set(i * 15, -0.775, j * 1);
        leg.castShadow = true;
        beltGroup.add(leg);
      }
    }
    scene.add(beltGroup);

    // ========== 设备生成 ==========
    // 设备外壳为「底部开口」的腔体（四面壁 + 顶板 + 四角立柱），
    // 这样机械臂可以从下方把数据包放进去、再原路取出来。
    function createDevice(x, label, colorHex) {
      const group = new THREE.Group();
      group.position.set(x, 0, 0);

      const frameMat = new THREE.MeshStandardMaterial({ color: 0x4a5568, metalness: 0.5, roughness: 0.5 });

      // 四角立柱（中间留空，供机械臂上下取件；腔体下沿 5.0，高于机械臂肘部轨迹）
      const legGeo = new THREE.BoxGeometry(0.22, 5.0, 0.22);
      for (const sx of [-0.85, 0.85]) {
        for (const sz of [-0.85, 0.85]) {
          const leg = new THREE.Mesh(legGeo, frameMat);
          leg.position.set(sx, 2.5, sz);
          leg.castShadow = true;
          group.add(leg);
        }
      }

      const boxGeo = new THREE.BoxGeometry(2, 2.4, 2);
      const texture = createTextTexture(label, colorHex);
      const boxMat = new THREE.MeshStandardMaterial({
        map: texture,
        transparent: true,
        opacity: 0.6,
        emissive: new THREE.Color(colorHex).multiplyScalar(0.4),
        metalness: 0.2,
        roughness: 0.3
      });
      const sideMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(colorHex).multiplyScalar(0.35),
        transparent: true,
        opacity: 0.55,
        emissive: new THREE.Color(colorHex).multiplyScalar(0.15),
        metalness: 0.2,
        roughness: 0.3
      });

      // 前 / 后壁（带标签）
      for (const sz of [0.94, -0.94]) {
        const panel = new THREE.Mesh(new THREE.BoxGeometry(2, 2.4, 0.12), boxMat);
        panel.position.set(0, 6.2, sz);
        panel.castShadow = true;
        panel.receiveShadow = true;
        group.add(panel);
      }
      // 左 / 右壁
      for (const sx of [-0.94, 0.94]) {
        const panel = new THREE.Mesh(new THREE.BoxGeometry(0.12, 2.4, 1.88), sideMat);
        panel.position.set(sx, 6.2, 0);
        panel.castShadow = true;
        group.add(panel);
      }
      // 顶板（下方完全开口）
      const topPanel = new THREE.Mesh(new THREE.BoxGeometry(2, 0.12, 1.88), sideMat);
      topPanel.position.set(0, 7.34, 0);
      topPanel.castShadow = true;
      group.add(topPanel);

      const edges = new THREE.EdgesGeometry(boxGeo);
      const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: colorHex, linewidth: 2 }));
      line.position.y = 6.2;
      group.add(line);

      const lightGeo = new THREE.SphereGeometry(0.15, 16, 16);
      const lightMat = new THREE.MeshStandardMaterial({ color: 0x27ae60, emissive: 0x27ae60, emissiveIntensity: 1 });
      const light = new THREE.Mesh(lightGeo, lightMat);
      light.position.set(0, 7.8, 0);
      group.add(light);

      group.userData = { light, boxMat };
      return group;
    }

    const devices = [
      createDevice(-8, 'TCP', '#3498db'),
      createDevice(0, 'IP', '#2ecc71'),
      createDevice(8, 'ETH', '#9b59b6')
    ];
    devices.forEach(d => scene.add(d));

    // ========== 机械臂 ==========
    const L1 = 1.8;
    const L2 = 1.5;

    // ========== 关键几何常量 ==========
    const BELT_TOP = 0.35;           // 传送带顶面高度
    const PACKET_HALF = 0.5;         // 数据包半高
    const PICK_Y = BELT_TOP + PACKET_HALF;  // 传送带上数据包中心高度 (0.85)
    const MACH_Y = 5.7;              // 设备腔体内数据包中心高度
    const ARM_BASE_Y = 3.0;          // 机械臂基座高度（抬高，避开 IK 奇异点）
    const CLAW_OPEN = 0.42;          // 夹爪张开角度（弧度）
    const GRIP_X = 0.53;             // 夹持中心相对腕部的偏置（腕关节恒定竖直 → 世界 +x）
    const WRIST_ANGLE = 0;           // 期望的夹爪世界朝向（0 = 竖直）

    // 机械臂的目标点（腕部原点在机械臂局部坐标系中的位置，x 相对基座）
    const TGT = {
      belt: { x: -GRIP_X, y: PICK_Y - ARM_BASE_Y },   // 夹持中心对准传送带上的数据包
      mach: { x: -GRIP_X, y: MACH_Y - ARM_BASE_Y },   // 夹持中心对准设备腔体中心
      idle: { x: 1 - GRIP_X, y: 1.6 }                // 待机姿态
    };

    function createArm(x) {
      const group = new THREE.Group();
      group.position.set(x, ARM_BASE_Y, 0);

      const shoulder = new THREE.Group();
      const arm1 = new THREE.Mesh(
        new THREE.BoxGeometry(L1, 0.3, 0.3), 
        new THREE.MeshStandardMaterial({ color: 0xf39c12, metalness: 0.4, roughness: 0.5 })
      );
      arm1.position.x = L1 / 2;
      arm1.castShadow = true;
      shoulder.add(arm1);

      const elbow = new THREE.Group();
      elbow.position.x = L1;
      const arm2 = new THREE.Mesh(
        new THREE.BoxGeometry(L2, 0.25, 0.25), 
        new THREE.MeshStandardMaterial({ color: 0xe67e22, metalness: 0.4, roughness: 0.5 })
      );
      arm2.position.x = L2 / 2;
      arm2.castShadow = true;
      elbow.add(arm2);

      // 腕关节：抵消肩/肘的旋转，让夹爪始终保持期望的世界朝向（竖直）
      const wrist = new THREE.Group();
      wrist.position.x = L2;

      const gripper = new THREE.Group();
      wrist.add(gripper);

      // 腕部（连接臂杆与夹爪）
      const baseGrip = new THREE.Mesh(
        new THREE.CylinderGeometry(0.16, 0.16, 0.38, 16),
        new THREE.MeshStandardMaterial({ color: 0x718096, metalness: 0.7 })
      );
      baseGrip.rotation.z = Math.PI / 2;
      gripper.add(baseGrip);

      // ---- 铰链式夹爪：两根手指绕腕部两侧的销轴旋转 ----
      const HINGE_Y = 0.17;   // 铰链轴离腕部中心的距离
      const PIN_R = 0.11;     // 销轴半径
      const PIN_LEN = 1.18;   // 销轴长度（略宽于数据包，前后都露出）
      const BAR_LEN = 0.86;   // 手指长度
      const BAR_T = 0.15;     // 手指厚度
      const BAR_OFF = 0.40;   // 手指相对铰链的高度偏移（闭合时正好压在数据包上下表面）
      const BAR_X = 0.53;     // 手指相对铰链的前后偏移

      // 上手指：pivot 组负责绕 z 轴（销轴）旋转
      const clawPivotL = new THREE.Group();
      clawPivotL.position.set(0, HINGE_Y, 0);
      // 连接臂：从销轴根部连到手指，保证与机械臂连成一体
      const postL = new THREE.Mesh(
        new THREE.BoxGeometry(0.13, 0.62, 0.86),
        new THREE.MeshStandardMaterial({ color: 0x7f8c8d, metalness: 0.75 })
      );
      postL.position.set(0.10, 0.31, 0);
      postL.castShadow = true;
      clawPivotL.add(postL);
      const clawL = new THREE.Mesh(
        new THREE.BoxGeometry(BAR_LEN, BAR_T, 1.12),
        new THREE.MeshStandardMaterial({ color: 0x95a5a6, metalness: 0.8 })
      );
      clawL.position.set(BAR_X, BAR_OFF, 0);
      clawL.castShadow = true;
      clawPivotL.add(clawL);
      gripper.add(clawPivotL);

      // 下手指（镜像）
      const clawPivotR = new THREE.Group();
      clawPivotR.position.set(0, -HINGE_Y, 0);
      const postR = new THREE.Mesh(
        new THREE.BoxGeometry(0.13, 0.62, 0.86),
        new THREE.MeshStandardMaterial({ color: 0x7f8c8d, metalness: 0.75 })
      );
      postR.position.set(0.10, -0.31, 0);
      postR.castShadow = true;
      clawPivotR.add(postR);
      const clawR = new THREE.Mesh(
        new THREE.BoxGeometry(BAR_LEN, BAR_T, 1.12),
        new THREE.MeshStandardMaterial({ color: 0x95a5a6, metalness: 0.8 })
      );
      clawR.position.set(BAR_X, -BAR_OFF, 0);
      clawR.castShadow = true;
      clawPivotR.add(clawR);
      gripper.add(clawPivotR);

      // 销轴（固定不转，就是手指的旋转轴，视觉上把手指和腕部连起来）
      const pinMat = new THREE.MeshStandardMaterial({ color: 0x34495e, metalness: 0.85, roughness: 0.25 });
      for (const sy of [1, -1]) {
        const pin = new THREE.Mesh(
          new THREE.CylinderGeometry(PIN_R, PIN_R, PIN_LEN, 16),
          pinMat
        );
        pin.rotation.x = Math.PI / 2;   // 圆柱默认沿 y 轴，转成沿 z 轴
        pin.position.set(0, sy * HINGE_Y, 0);
        pin.castShadow = true;
        gripper.add(pin);
      }

      elbow.add(wrist);
      shoulder.add(elbow);
      group.add(shoulder);

      // 臂基座做成中空圆筒，让数据包能从基座中间的通道上下穿行
      const baseCyl = new THREE.Mesh(
        new THREE.CylinderGeometry(0.8, 0.85, 0.5, 32, 1, true),
        new THREE.MeshStandardMaterial({ color: 0x34495e, side: THREE.DoubleSide })
      );
      baseCyl.position.y = -0.25;
      baseCyl.castShadow = true;
      group.add(baseCyl);
      const baseRim = new THREE.Mesh(
        new THREE.TorusGeometry(0.82, 0.07, 10, 32),
        new THREE.MeshStandardMaterial({ color: 0x2c3e50, metalness: 0.6 })
      );
      baseRim.rotation.x = Math.PI / 2;
      baseRim.position.y = 0.02;
      group.add(baseRim);

      // 支撑立柱：让机械臂不再悬空（放在传送带外侧，不挡取件通道）
      const colMat = new THREE.MeshStandardMaterial({ color: 0x4a5568, metalness: 0.5, roughness: 0.5 });
      const col = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 2.75, 20), colMat);
      col.position.set(0, -1.625, -1.5);
      col.castShadow = true;
      group.add(col);
      const colFoot = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.16, 1.1), colMat);
      colFoot.position.set(0, -2.92, -1.5);
      colFoot.castShadow = true;
      group.add(colFoot);
      const bracket = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.4, 1.2), colMat);
      bracket.position.set(0, -0.25, -1.2);
      bracket.castShadow = true;
      group.add(bracket);

      // 初始姿态（待机位）
      const ikIdle = solveIK(TGT.idle.x, TGT.idle.y, L1, L2);

      group.userData = {
        shoulder, elbow, wrist, gripper, clawL, clawR, clawPivotL, clawPivotR,
        state: 'idle', timer: 0,
        currentT1: ikIdle.theta1, currentT2: ikIdle.theta2,
        // cur / from：当前与起始的笛卡尔目标（腕部原点，机械臂局部坐标）
        cur: { x: TGT.idle.x, y: TGT.idle.y },
        from: { x: TGT.idle.x, y: TGT.idle.y },
        stationIndex: 0
      };

      // 初始张开
      clawPivotL.rotation.z = CLAW_OPEN;
      clawPivotR.rotation.z = -CLAW_OPEN;

      group.rotation.y = 0;
      return group;
    }

    const arms = [ createArm(-8), createArm(0), createArm(8) ];
    arms.forEach(a => scene.add(a));

    // ========== IK 求解器 ==========
    function solveIK(tx, ty, l1, l2) {
      const d = Math.min(Math.hypot(tx, ty), l1 + l2 - 0.01);
      const a = Math.acos(THREE.MathUtils.clamp((l1*l1 + d*d - l2*l2) / (2 * l1 * d), -1, 1));
      const b = Math.acos(THREE.MathUtils.clamp((l1*l1 + l2*l2 - d*d) / (2 * l1 * l2), -1, 1));
      const theta1 = Math.atan2(ty, tx) - a;
      const theta2 = Math.PI - b;
      return { theta1, theta2 };
    }

    // 复用临时向量，避免每帧 new Vector3 造成 GC 压力
    const _endPos = new THREE.Vector3();
    function getArmEndPos(arm, t1, t2) {
      return _endPos.set(
        arm.position.x + L1 * Math.cos(t1) + L2 * Math.cos(t1 + t2),
        arm.position.y + L1 * Math.sin(t1) + L2 * Math.sin(t1 + t2),
        0
      );
    }

    // ========== 数据包 ==========
    let packetGroup = null;
    let gameState = 'idle';

    function createPacket() {
      const group = new THREE.Group();
      const payload = new THREE.Mesh(
        new THREE.BoxGeometry(1, 1, 1), 
        new THREE.MeshStandardMaterial({ color: 0xf1c40f, metalness: 0.2, roughness: 0.6 })
      );
      payload.castShadow = true;
      payload.receiveShadow = true;
      group.add(payload);
      group.position.set(-16, PICK_Y, 0);
      return group;
    }

    // ========== UI 状态 ==========
    const startBtn = document.getElementById('startBtn');
    const statusEl = document.getElementById('status');
    const headersEl = document.getElementById('headers');

    function updateHeadersUI(headers) {
      if (headers.length === 0) {
        headersEl.innerHTML = '当前数据包: 无';
        return;
      }
      const map = { tcp: '<span class="header-tag tcp">TCP</span>', 
                    ip: '<span class="header-tag ip">IP</span>', 
                    eth: '<span class="header-tag eth">ETH</span>' };
      headersEl.innerHTML = '当前数据包: ' + headers.map(h => map[h]).join(' ');
    }

    function startGame() {
      if (gameState !== 'idle') return;
      gameState = 'running';
      startBtn.disabled = true;
      statusEl.textContent = '状态: 运行中...';
      
      if (packetGroup) scene.remove(packetGroup);
      packetGroup = createPacket();
      scene.add(packetGroup);

      packetGroup.userData = {
        state: 'moving',
        timer: 0,
        headers: [],
        speed: 4,
        targetX: -16,
        processedStations: []
      };

      arms.forEach(arm => {
        const aData = arm.userData;
        aData.state = 'idle';
        aData.timer = 0;
        aData.cur = { x: TGT.idle.x, y: TGT.idle.y };
        aData.from = { x: TGT.idle.x, y: TGT.idle.y };
        const ik = solveIK(TGT.idle.x, TGT.idle.y, L1, L2);
        aData.currentT1 = ik.theta1;
        aData.currentT2 = ik.theta2;
        aData.shoulder.rotation.z = ik.theta1;
        aData.elbow.rotation.z = ik.theta2;
        aData.wrist.rotation.z = -(ik.theta1 + ik.theta2) + WRIST_ANGLE;
        aData.clawPivotL.rotation.z = CLAW_OPEN;
        aData.clawPivotR.rotation.z = -CLAW_OPEN;
      });

      devices.forEach(d => {
        d.userData.light.material.color.setHex(0x27ae60);
        d.userData.light.material.emissive.setHex(0x27ae60);
        d.userData.light.material.emissiveIntensity = 1;
      });

      updateHeadersUI([]);
    }

    startBtn.addEventListener('click', startGame);

    // ========== 主循环 ==========
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.1);

      if (gameState === 'running' && packetGroup) {
        updateGame(dt);
      }

      arms.forEach(arm => {
        updateArm(arm, dt);
      });

      // 核心修复：传送带纹理始终滚动（只要游戏正在运行）
      if (gameState === 'running') {
        beltTextures.forEach((texture) => {
          texture.position.x += 4 * dt; 
          if (texture.position.x > 17) texture.position.x -= 34;
        });
      }

      devices.forEach((d, i) => {
        const t = clock.getElapsedTime();
        d.userData.boxMat.emissiveIntensity = 0.4 + Math.sin(t * 4 + i * 2) * 0.2;
      });

      controls.update();
      renderer.render(scene, camera);
    }

    // ========== 游戏逻辑 ==========
    // 让机械臂开始抓取数据包
    function startGrab(arm, idx) {
      const pData = packetGroup.userData;
      packetGroup.position.x = arm.position.x;
      pData.state = 'grabbed';
      arm.userData.state = 'reaching_belt';
      arm.userData.timer = 0;
      arm.userData.stationIndex = idx;
      arm.userData.from = { x: arm.userData.cur.x, y: arm.userData.cur.y };
      pData.processedStations.push(idx);
    }

    function updateGame(dt) {
      const pData = packetGroup.userData;

      if (pData.state === 'moving') {
        // 找出下一个尚未处理的工位
        let nextIdx = -1;
        for (let i = 0; i < arms.length; i++) {
          if (!pData.processedStations.includes(i)) { nextIdx = i; break; }
        }

        if (nextIdx >= 0) {
          const arm = arms[nextIdx];
          const armX = arm.position.x;
          if (packetGroup.position.x >= armX - 0.4) {
            if (arm.userData.state === 'idle') {
              startGrab(arm, nextIdx);
            } else {
              // 机械臂正忙 → 停在站前等待，绝不漏封直接穿过去
              packetGroup.position.x = armX - 0.4;
              pData.state = 'waiting_station';
              pData.waitStation = nextIdx;
              statusEl.textContent = '状态: 等待工位空闲...';
            }
          } else {
            packetGroup.position.x += pData.speed * dt;
          }
        } else {
          packetGroup.position.x += pData.speed * dt;
        }

        if (packetGroup.position.x > 16) {
          gameState = 'ending';
          statusEl.textContent = '状态: ✓ 封装完成！';
          startBtn.disabled = false;
          startBtn.textContent = '重新开始';
          setTimeout(() => {
            gameState = 'idle';
            statusEl.textContent = '状态: 等待开始';
            startBtn.textContent = '开始运行';
          }, 3000);
        }
      }
      else if (pData.state === 'waiting_station') {
        // 等待指定工位空闲
        const arm = arms[pData.waitStation];
        if (arm && arm.userData.state === 'idle') {
          startGrab(arm, pData.waitStation);
        }
      }
      else if (pData.state === 'in_machine') {
        pData.timer += dt;
        const payload = packetGroup.children[0];
        payload.material.emissive.setHex(0xffaa00);
        payload.material.emissiveIntensity = Math.sin(pData.timer * 20) > 0 ? 1 : 0;

        const armIndex = Math.round(pData.targetX / 8) + 1;
        const type = ['tcp', 'ip', 'eth'][armIndex];
        const colorMap = { tcp: 0x3498db, ip: 0x2ecc71, eth: 0x9b59b6 };
        const dev = devices[armIndex];
        if (dev) {
          dev.userData.light.material.color.setHex(colorMap[type]);
          dev.userData.light.material.emissive.setHex(colorMap[type]);
          dev.userData.light.material.emissiveIntensity = Math.sin(pData.timer * 20) > 0 ? 2.5 : 0.6;
        }

        if (pData.timer >= 1.2) {
          payload.material.emissiveIntensity = 0;

          const header = new THREE.Mesh(
            new THREE.BoxGeometry(0.6, 1.02, 1.02),
            new THREE.MeshStandardMaterial({
              color: colorMap[type], metalness: 0.3, roughness: 0.4,
              emissive: new THREE.Color(colorMap[type]).multiplyScalar(0.3)
            })
          );
          header.position.x = -0.8 - pData.headers.length * 0.6;
          header.castShadow = true;
          packetGroup.add(header);

          pData.headers.push(type);
          updateHeadersUI(pData.headers);
          statusEl.textContent = `状态: 已封装 ${pData.headers.length}/3 层，等待机械臂取出`;

          // 封装完成 → 等待机械臂来把数据包取回传送带
          pData.state = 'ready_to_take';
          pData.timer = 0;
        }
      }
    }

    // ========== 机械臂动画 ==========
    function updateArm(arm, dt) {
      const aData = arm.userData;
      if (aData.state === 'idle') return;

      aData.timer += dt;
      const pData = packetGroup ? packetGroup.userData : null;

      // 笛卡尔直线插值 + 实时解 IK：
      // 末端沿直线运动，不会因为关节角插值而走圆弧蹭到设备壁
      const moveTo = (from, to, t) => {
        const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        const tx = THREE.MathUtils.lerp(from.x, to.x, ease);
        const ty = THREE.MathUtils.lerp(from.y, to.y, ease);
        const ik = solveIK(tx, ty, L1, L2);
        // 保险：NaN 写进 rotation 会让整条臂停止渲染（看起来"消失"）
        if (!isFinite(ik.theta1) || !isFinite(ik.theta2)) {
          console.warn('[IK] 目标不可达，跳过本帧', tx, ty);
          return;
        }
        aData.currentT1 = ik.theta1;
        aData.currentT2 = ik.theta2;
        aData.shoulder.rotation.z = ik.theta1;
        aData.elbow.rotation.z = ik.theta2;
        // 腕关节反向补偿 → 夹爪世界朝向恒为 WRIST_ANGLE（竖直）
        aData.wrist.rotation.z = -(ik.theta1 + ik.theta2) + WRIST_ANGLE;
        aData.cur = { x: tx, y: ty };
      };

      // 夹持中心（数据包中心）：腕部原点 + 沿夹爪朝向的固定偏置
      const clampCenter = () => {
        const end = getArmEndPos(arm, aData.currentT1, aData.currentT2);
        const ang = aData.currentT1 + aData.currentT2 + aData.wrist.rotation.z; // === WRIST_ANGLE
        return {
          x: end.x + GRIP_X * Math.cos(ang),
          y: end.y + GRIP_X * Math.sin(ang)
        };
      };

      // 数据包跟随夹爪（统一在这里设置位置，杜绝 NaN 坐标）
      const setPacketPos = (x, y) => {
        if (!packetGroup || !isFinite(x) || !isFinite(y)) return;
        // 自愈：万一坐标已被污染成 NaN，先复位再赋值
        if (!isFinite(packetGroup.position.x) || !isFinite(packetGroup.position.y)) {
          packetGroup.position.set(arm.position.x, PICK_Y, 0);
        }
        packetGroup.position.set(x, y, 0);
      };

      const followPacket = () => {
        if (!packetGroup) return;
        const c = clampCenter();
        setPacketPos(c.x, c.y);
      };

      // 爪子绕腕部销轴旋转：张开 / 夹紧
      const closeClaws = (t) => {
        aData.clawPivotL.rotation.z = THREE.MathUtils.lerp(CLAW_OPEN, 0, t);
        aData.clawPivotR.rotation.z = THREE.MathUtils.lerp(-CLAW_OPEN, 0, t);
      };

      const openClaws = (t) => {
        aData.clawPivotL.rotation.z = THREE.MathUtils.lerp(0, CLAW_OPEN, t);
        aData.clawPivotR.rotation.z = THREE.MathUtils.lerp(0, -CLAW_OPEN, t);
      };

      switch (aData.state) {
        // ① 伸向传送带（直线下降到数据包位置）
        case 'reaching_belt': {
          const t = Math.min(1, aData.timer / 0.4);
          moveTo(aData.from, TGT.belt, t);
          if (t >= 1) { aData.state = 'grabbing'; aData.timer = 0; }
          break;
        }
        // ② 夹紧传送带上的数据包（数据包不动，手指合拢）
        case 'grabbing': {
          const t = Math.min(1, aData.timer / 0.2);
          closeClaws(t);
          followPacket();
          if (t >= 1) { aData.state = 'lifting'; aData.timer = 0; }
          break;
        }
        // ③ 竖直抬起送入设备（直线上升，从腔体下开口进入）
        case 'lifting': {
          const t = Math.min(1, aData.timer / 0.6);
          moveTo(TGT.belt, TGT.mach, t);
          followPacket();
          if (t >= 1) { aData.state = 'releasing'; aData.timer = 0; }
          break;
        }
        // ④ 松爪，把数据包放进设备腔体（数据包停在夹持中心 = 腔体中心）
        case 'releasing': {
          const t = Math.min(1, aData.timer / 0.2);
          openClaws(t);
          if (t >= 1) {
            if (packetGroup) {
              const c = clampCenter();
              packetGroup.position.set(c.x, c.y, 0);
              packetGroup.userData.state = 'in_machine';
              packetGroup.userData.timer = 0;
              packetGroup.userData.targetX = arm.position.x;
            }
            aData.state = 'holding';
            aData.timer = 0;
          }
          break;
        }
        // ⑤ 原地待命，等设备封装完成
        case 'holding': {
          if (pData && pData.state === 'ready_to_take') {
            aData.state = 'gripping';
            aData.timer = 0;
          } else if (!pData || (pData.state !== 'in_machine' && pData.state !== 'grabbed')) {
            // 数据包已不在腔体 → 复位，避免卡死
            aData.state = 'returning';
            aData.timer = 0;
            aData.from = { x: aData.cur.x, y: aData.cur.y };
          }
          break;
        }
        // ⑥ 夹紧封装好的数据包（手指合拢，数据包完全不动）
        case 'gripping': {
          const t = Math.min(1, aData.timer / 0.25);
          closeClaws(t);
          if (t >= 1) { aData.state = 'lifting_out'; aData.timer = 0; }
          break;
        }
        // ⑦ 从设备腔体中垂直取出（数据包从下开口退出）
        case 'lifting_out': {
          const t = Math.min(1, aData.timer / 0.6);
          moveTo(TGT.mach, TGT.belt, t);
          followPacket();
          if (t >= 1) { aData.state = 'placing'; aData.timer = 0; }
          break;
        }
        // ⑧ 放到传送带上并松爪
        case 'placing': {
          const t = Math.min(1, aData.timer / 0.2);
          openClaws(t);
          followPacket();
          if (t >= 1) {
            if (packetGroup) {
              const c = clampCenter();
              packetGroup.position.set(c.x, c.y, 0);
              packetGroup.userData.state = 'moving';
              packetGroup.userData.timer = 0;
              const payload = packetGroup.children[0];
              if (payload && payload.material) {
                payload.material.emissive.setHex(0x000000);
                payload.material.emissiveIntensity = 0;
              }
            }
            const dev = devices[aData.stationIndex];
            if (dev) {
              dev.userData.light.material.color.setHex(0x27ae60);
              dev.userData.light.material.emissive.setHex(0x27ae60);
              dev.userData.light.material.emissiveIntensity = 1;
            }
            aData.state = 'returning';
            aData.timer = 0;
            aData.from = { x: aData.cur.x, y: aData.cur.y };
          }
          break;
        }
        // ⑨ 回到待机位
        case 'returning': {
          const t = Math.min(1, aData.timer / 0.4);
          moveTo(aData.from, TGT.idle, t);
          if (t >= 1) { aData.state = 'idle'; aData.timer = 0; }
          break;
        }
      }
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
